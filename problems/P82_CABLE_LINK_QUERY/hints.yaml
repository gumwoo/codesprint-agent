# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "케이블은 사라지지 않는다. 두 컴퓨터가 한 번 이어지면 끝까지 이어져 있으므로, 질문이 올 때마다 길을 처음부터 다시 찾을 이유가 없다."
  - level: 2
    text: "서로 이어진 컴퓨터들을 하나의 묶음으로 본다. 필요한 연산은 두 묶음을 하나로 합치기와 두 컴퓨터가 같은 묶음인지 묻기 두 가지뿐이다. 서로소 집합(Union-Find) 문제다."
  - level: 3
    text: "컴퓨터마다 부모 번호 하나를 저장하는 배열을 둔다. 자기 자신을 부모로 가리키는 컴퓨터가 그 묶음의 대표다. 처음에는 모두 자기 자신이 대표다."
  - level: 4
    text: "합칠 때는 a, b 자신이 아니라 각자의 대표를 먼저 찾고, 대표가 다르면 한 대표를 다른 대표 밑에 붙인다. 대표를 찾으러 올라가며 지나친 컴퓨터들은 대표를 바로 가리키도록 고쳐 두면 다음 탐색이 짧아진다."
  - level: 5
    text: "부모[i] = i 로 초기화\n대표찾기(x): 부모를 따라 올라가 자기 자신을 가리키는 곳 r 을 찾고, 지나온 칸을 모두 r 로 바꾼 뒤 r 을 돌려준다\n명령마다: ra = 대표찾기(a), rb = 대표찾기(b)\n  1 이면 ra 와 rb 가 다를 때 한 대표의 부모를 다른 대표로 둔다\n  2 이면 ra 와 rb 가 같은지에 따라 YES / NO 를 모아 둔다\n모은 줄을 출력"
