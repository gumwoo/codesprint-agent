# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "단어마다 본문을 처음부터 다시 훑으면 단어 수 × 본문 길이만큼 걸린다. 본문을 한 번만 읽으면서 모든 단어의 등장을 동시에 알아낼 방법이 필요하다. 한 위치에서 끝나는 단어가 여럿일 수 있다는 점(예: aba 가 끝나는 곳에서 ba 와 a 도 끝난다)에 주목한다."
  - level: 2
    text: "여러 패턴을 한꺼번에 찾는 문자열 매칭 오토마톤(Aho-Corasick) 범주의 문제다. 한 패턴용 KMP 의 실패 함수를 여러 패턴으로 넓힌 것이다."
  - level: 3
    text: "모든 단어를 넣은 트라이를 만든다. 각 노드는 '지금까지 읽은 본문의 끝이 이 문자열과 같다'는 상태이고, 노드마다 실패 링크(트라이에 있는 가장 긴 진짜 접미사 노드)와 도달 횟수를 둔다. 단어마다 자기 끝 노드 번호를 기억한다."
  - level: 4
    text: "실패 링크는 트라이를 BFS 순서로 돌며 부모의 실패 링크를 따라가 같은 글자로 이어지는 자식을 찾아 정한다. 본문을 읽을 때는 현재 노드에 그 글자 자식이 없으면 실패 링크로 물러나고, 도착한 노드의 횟수를 1 늘린다. 마지막에 BFS 역순으로 각 노드의 횟수를 실패 링크 노드에 더해 주면, 어떤 노드의 횟수가 그 문자열로 끝나는 모든 위치의 수가 된다."
  - level: 5
    text: "트라이에 단어 삽입, 끝 노드 기록\nBFS 로 노드 순서 저장, 각 자식의 실패 링크 계산\n상태 = 루트\n본문의 각 글자 c:\n    상태에 c 자식이 없고 루트가 아니면 실패 링크로 이동 반복\n    c 자식이 있으면 그리로, 없으면 루트\n    상태 횟수 += 1\nBFS 역순으로 노드마다 실패 링크 노드에 횟수 누적\n단어마다 끝 노드의 횟수 출력"
