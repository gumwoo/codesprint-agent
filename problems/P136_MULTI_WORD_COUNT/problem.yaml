# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P136_MULTI_WORD_COUNT
title: 여러 단어의 등장 횟수
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 2400
referenceComplexity: O(|T| + Σ|P_i|)
statement: |
  소문자로 된 본문 T 와 단어 N 개가 주어진다. 각 단어가 T 안에 연속된 부분 문자열로 몇 번 나타나는지 센다. 겹쳐서 나타나는 것도 모두 센다. 예: T = aaaa 에서 aa 는 시작 위치 0, 1, 2 (0-based) 에서 나타나므로 3 번이다. 같은 단어가 여러 번 주어질 수 있으며 각각 따로 답한다.

  입력
  첫째 줄에 본문 T 가 주어진다.
  둘째 줄에 단어의 개수 N 이 주어진다.
  다음 N 줄에 걸쳐 단어 P_1, P_2, ..., P_N 이 한 줄에 하나씩 주어진다. 단어 번호는 1 부터 센다.

  출력
  N 줄을 출력한다. i 번째 줄에 P_i 가 T 에 나타나는 횟수를 출력한다.

  제약
  - 1 ≤ |T| ≤ 200000
  - 1 ≤ N ≤ 100000
  - 1 ≤ |P_i|
  - |P_1| + |P_2| + ... + |P_N| ≤ 200000
  - T 와 모든 P_i 는 알파벳 소문자(a-z)로만 이루어진다.
  - 본문의 위치는 0 부터 센다.
skills:
- code: MULTI_PATTERN_MATCHING
  role: PRIMARY
  weight: 0.7
- code: TRIE_PREFIX
  role: SECONDARY
  weight: 0.3
commonMistakes:
- IMPLEMENTATION_MISC
- INPUT_PARSE
negativeControl:
  mistake: IMPLEMENTATION_MISC
  expectedStatus: WRONG_ANSWER
skillControl:
  approach: 단어마다 str.find 로 본문을 따로 훑으며 겹치는 등장을 하나씩 센다.
