# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "회의를 하나 고르면 그 회의가 끝나는 시각 이후만 남은 회의에게 쓸 수 있다. 남는 시간이 많을수록 뒤에 더 많이 넣을 수 있다."
  - level: 2
    text: "모든 조합을 따지지 않고, 정해진 순서로 보면서 지금 넣을 수 있으면 넣는 그리디 선택으로 최적해가 나온다."
  - level: 3
    text: "회의를 (끝나는 시각, 시작 시각) 기준으로 정렬한 목록과, 마지막으로 고른 회의의 끝나는 시각 하나만 상태로 둔다."
  - level: 4
    text: "정렬 순서대로 보면서 현재 회의의 시작 시각이 마지막 끝나는 시각 이상이면 개수를 1 늘리고 마지막 끝나는 시각을 현재 회의의 끝나는 시각으로 바꾼다. 아니면 건너뛴다."
  - level: 5
    text: "입력을 읽는다 -> 끝나는 시각 오름차순으로 정렬한다 -> 기준 시각을 아주 작은 값으로 둔다 -> 각 회의에 대해 시작 >= 기준이면 개수 증가, 기준 = 그 회의의 끝 -> 개수를 출력한다."
