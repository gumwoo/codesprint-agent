# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "M 원을 만드는 방법의 수는 더 작은 금액을 만드는 방법의 수로부터 정해진다. 같은 금액을 여러 번 새로 세지 않아야 하고, 장수만 같고 순서가 다른 구성을 두 번 세지 않아야 한다."
  - level: 2
    text: "개수 제한 없는 배낭 형태의 동적 계획법이다. 작은 금액부터 채워 나간다."
  - level: 3
    text: "길이 M+1 의 1차원 배열 하나를 쓴다. 칸 s 에는 지금까지 고려한 우표 종류만으로 s 원을 만드는 방법의 수를 둔다. 0원을 만드는 방법은 아무것도 고르지 않는 1가지다."
  - level: 4
    text: "우표 종류를 하나씩 추가한다. 금액 c 인 종류를 추가할 때 c 이상인 각 금액 s 에 대해, s-c 원을 만드는 방법 수를 s 원의 방법 수에 더한다. 같은 종류를 여러 장 쓰는 경우가 들어가도록 s 를 작은 쪽부터 본다. 종류를 바깥 반복에 두어야 순서가 다른 같은 구성이 한 번만 세진다."
  - level: 5
    text: "배열 전체를 0 으로, 0번 칸을 1 로 둔다\n각 우표 금액 c 에 대해:\n    s 를 c 부터 M 까지 증가시키며:\n        s번 칸에 (s-c)번 칸 값을 더하고 1,000,000,007 로 나눈 나머지로 둔다\nM번 칸을 출력한다"
