# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "x 가 정해지면 A*x + B*y = C 에서 y 가 될 수 있는 값은 하나뿐이다."
  - level: 2
    text: "완전 탐색 문제다. 두 변수를 모두 돌리지 않고 한 변수만 0 부터 P 까지 빠짐없이 열거해도 모든 후보를 본다."
  - level: 3
    text: "필요한 상태는 현재 x 와 남은 금액 C - A*x, 그리고 조건을 만족한 쌍의 개수뿐이다."
  - level: 4
    text: "남은 금액이 음수가 아니고 B 로 나누어떨어지며 그 몫이 Q 이하일 때만 유효한 쌍이다. x 의 범위는 양 끝 0 과 P 를 모두 포함한다."
  - level: 5
    text: "개수 = 0\nx = 0, 1, ..., P 에 대해:\n    남은 금액 = C - A*x\n    남은 금액 < 0 이면 중단\n    남은 금액이 B 의 배수이고 (남은 금액 / B) <= Q 이면 개수 += 1\n개수를 출력"
