# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "P(K) 는 P(K-1) 세 개와 빈 블록 하나로 이루어진다. 큰 패턴이 같은 모양의 작은 패턴으로 정의된다."
  - level: 2
    text: "재귀 문제다. 크기 K 의 패턴을 그리는 일을 크기 K-1 의 패턴을 그리는 일 세 번으로 나누고, K = 0 을 기저 조건으로 둔다."
  - level: 3
    text: "2^K × 2^K 크기의 문자 2차원 리스트를 '.' 로 채워 두고, 재귀 함수는 (단계 k, 블록의 왼쪽 위 행 r, 열 c) 를 상태로 받는다."
  - level: 4
    text: "블록 한 변의 절반을 h = 2^(k-1) 이라 하면 (r, c), (r, c+h), (r+h, c+h) 세 위치에서 k-1 단계를 호출한다. (r+h, c) 는 건너뛴다. k = 0 이면 grid[r][c] 한 칸만 '#' 로 바꾼다."
  - level: 5
    text: "함수 그리기(k, r, c): k 가 0 이면 r 행 c 열에 '#' 를 놓고 끝낸다. 아니면 h 를 구해 왼쪽 위 · 오른쪽 위 · 오른쪽 아래 블록에 대해 그리기(k-1, ...) 를 부른다. 본문에서 그리기(K, 0, 0) 을 부른 뒤 각 행을 이어 붙여 출력한다."
