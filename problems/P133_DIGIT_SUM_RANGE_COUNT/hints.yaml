# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "R 은 10^18 까지 커서 구간의 수를 하나씩 확인할 수 없다. 구간 [L, R] 의 답은 '1 이상 R 이하' 의 답과 '1 이상 L-1 이하' 의 답으로 나눠 생각할 수 있다."
  - level: 2
    text: "상한 이하의 수를 앞자리부터 한 자리씩 정해 가며 조건을 만족하는 수를 세는 자릿수 DP 문제다."
  - level: 3
    text: "자리 숫자를 자유롭게 고를 수 있는 남은 자리 수와 그 자리들이 채워야 할 합을 상태로 두는 2차원 표를 한 번 만들어 두면 모든 질의에서 다시 쓸 수 있다."
  - level: 4
    text: "상한의 i 번째 자리에서 상한의 숫자보다 작은 숫자 c 를 고르면 그 뒤 자리는 0~9 를 자유롭게 고를 수 있으므로, 지금까지 고른 앞자리 합과 c 를 뺀 나머지 합을 남은 자리 수로 만드는 경우의 수를 표에서 더한다. 상한과 같은 숫자를 고르면 다음 자리로 넘어간다."
  - level: 5
    text: "표[d][t] = 길이 d 의 0~9 숫자열 중 합이 t 인 개수 (표[d][t] = 표[d-1][t-0] + ... + 표[d-1][t-9]).\n세기(n): 앞자리합 = 0; 결과 = 0; 각 자리 i 에 대해 상한 숫자 보다 작은 c 마다 결과 += 표[남은 자리 수][S - 앞자리합 - c]; 앞자리합 += 상한 숫자; 앞자리합 > S 면 중단. 끝까지 오면 앞자리합 == S 일 때 결과 += 1.\n답 = 세기(R) - 세기(L - 1)."
