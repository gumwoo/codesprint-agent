# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P69_SQUARE_TILE_GCD_LCM
title: 정사각형 타일과 정사각형 판
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 600
referenceComplexity: O(Q log min(A, B))
statement: |
  가로 A, 세로 B 인 직사각형이 주어진다. 두 값을 구한다.
  1) 크기가 모두 같은 정사각형 타일로 A x B 직사각형을 빈틈 없이, 겹치지 않게 채울 때 쓸 수 있는 가장 큰 정사각형 타일의 한 변 길이 G.
  2) A x B 직사각형 타일을 회전하지 않고 빈틈 없이, 겹치지 않게 이어 붙여 만들 수 있는 가장 작은 정사각형의 한 변 길이 L.
  질의가 Q 개 주어진다.

  입력 형식
  첫 줄에 정수 Q (1 <= Q <= 1000).
  다음 Q 개 줄에 정수 A, B 가 공백 하나로 구분되어 주어진다. (1 <= A, B <= 10^12)

  출력 형식
  질의가 주어진 순서대로 한 줄에 하나씩 G 와 L 을 공백 하나로 구분해 출력한다. L 은 정수로 출력한다.

  인덱스 기준
  배열 인덱스를 출력하지 않는다. 질의는 입력 순서대로 처리하며, 설명에서 질의 번호를 말할 때는 1 부터 센다.
skills:
- code: MATH_GCD_LCM
  role: PRIMARY
  weight: 1.0
commonMistakes:
- IMPLEMENTATION_MISC
- OUTPUT_FORMAT
- INPUT_PARSE
negativeControl:
  mistake: IMPLEMENTATION_MISC
  expectedStatus: WRONG_ANSWER
skillControl:
  approach: min(A, B) 부터 1 까지 내려가며 A 와 B 를 모두 나누는 첫 수를 최대공약수로 삼는다.
