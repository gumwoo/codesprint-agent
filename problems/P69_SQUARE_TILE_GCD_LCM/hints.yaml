# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "가장 큰 타일의 한 변은 A 와 B 를 모두 나누어떨어지게 해야 하고, 가장 작은 정사각형의 한 변은 A 로도 B 로도 나누어떨어져야 한다."
  - level: 2
    text: "G 는 최대공약수, L 은 최소공배수다. A, B 가 10^12 까지이므로 약수를 하나씩 시험하는 방법은 시간 안에 끝나지 않는다. 유클리드 호제법을 쓴다."
  - level: 3
    text: "질의마다 두 정수만 들고 있으면 된다. 호제법은 (큰 수, 작은 수) 한 쌍을 계속 바꿔 가며 줄여 나간다."
  - level: 4
    text: "gcd(a, b) = gcd(b, a mod b) 이고 b 가 0 이 되면 남은 a 가 답이다. 최소공배수는 A / G * B 로 구하며, 먼저 나누면 중간값이 작아진다."
  - level: 5
    text: "각 질의에 대해: x=A, y=B 로 두고 y 가 0 이 아닐 동안 (x, y) 를 (y, x mod y) 로 바꾼다. G=x. L=(A 를 G 로 나눈 몫)*B. G 와 L 을 한 줄에 출력한다."
