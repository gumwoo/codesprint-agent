# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "동시 접속자 수는 어떤 기록이 시작하거나 끝나는 시각에서만 바뀐다. 그 사이 구간에서는 값이 일정하다."
  - level: 2
    text: "모든 기록 쌍이나 모든 후보 시각마다 기록 전체를 다시 세지 말고, 시각이 커지는 순서로 한 번만 훑는 스위핑으로 접근한다."
  - level: 3
    text: "각 기록을 '시작' 사건과 '끝' 사건 두 개로 나누어 (시각, 변화량) 목록을 만들고 정렬한다. 훑는 동안 현재 접속자 수, 지금까지의 최댓값, 그 최댓값이 처음 나온 시각을 들고 다닌다."
  - level: 4
    text: "같은 시각에 끝과 시작이 겹치면 끝을 먼저 반영해야 한다. 끝나는 시각은 기록에 포함되지 않기 때문이다. 현재 수가 기존 최댓값보다 엄격히 커질 때만 시각을 갱신하면 가장 이른 시각이 남는다."
  - level: 5
    text: "사건 목록 = 각 기록마다 (s, +1), (e, -1)\n끝(-1)이 시작(+1)보다 앞서도록 시각 기준 정렬\ncur = 0, best = 0, T = 0\n사건을 앞에서부터 보며:\n    cur 에 변화량을 더한다\n    cur 가 best 보다 크면 best 와 T 를 갱신\nbest, T 출력"
