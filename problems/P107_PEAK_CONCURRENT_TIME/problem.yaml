# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P107_PEAK_CONCURRENT_TIME
title: 가장 붐비는 시각
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 900
referenceComplexity: O(N log N)
statement: |
  서버에 접속 기록 N개가 있다. i번째 기록은 두 정수 s, e 로 주어지며, 그 사용자는 시각 s 이상 e 미만인 모든 실수 시각 x 에 접속해 있다. 시각 s 는 포함하고 시각 e 는 포함하지 않는다. 따라서 한 기록이 시각 3 에 끝나고 다른 기록이 시각 3 에 시작하면, 시각 3 에 접속해 있는 사람은 뒤의 기록 한 명뿐이다.

  어떤 시각 x 의 동시 접속자 수는 s <= x < e 를 만족하는 기록의 개수다. 모든 실수 시각 가운데 동시 접속자 수의 최댓값 M 을 구하고, 동시 접속자 수가 M 이 되는 가장 이른 시각 T 를 구한다. T 는 항상 정수이다.

  입력 형식
  첫째 줄에 정수 N (1 <= N <= 100000).
  다음 N개의 줄의 i번째 줄에 정수 s, e (0 <= s < e <= 1000000000).
  기록의 순서는 답에 영향을 주지 않는다. 같은 기록이 여러 번 주어질 수 있다.

  출력 형식
  M 과 T 를 공백 하나로 구분해 한 줄에 출력한다.

  시각은 입력에 주어진 정수 값 그대로 사용한다. 기록의 번호는 출력하지 않는다.
skills:
