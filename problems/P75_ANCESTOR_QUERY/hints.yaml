# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "u가 v의 조상이라는 것은 v가 u의 서브트리 안에 있다는 뜻이다. 질의마다 트리를 다시 훑으면 N과 Q가 클 때 느리다."
  - level: 2
    text: "루트 R에서 한 번 깊이 우선 순회를 하며 각 정점에 방문 번호를 매기는 방법(오일러 투어)을 쓴다. 간선은 양방향으로 연결해야 루트가 어디든 모든 정점에 닿는다."
  - level: 3
    text: "정점마다 진입 번호 tin과, 그 서브트리 안에서 가장 큰 진입 번호 tout을 저장한다. N이 크므로 재귀 대신 명시적 스택과 정점별 다음 이웃 위치를 둔다."
  - level: 4
    text: "한 정점의 서브트리는 진입 번호가 연속된 구간 [tin, tout]을 차지한다. 따라서 u가 v의 조상인 것은 tin[u] <= tin[v] <= tout[u]와 같다."
  - level: 5
    text: "양방향 인접 리스트 생성 -> 루트를 스택에 넣고 번호 부여 -> 스택 맨 위 정점에 아직 보지 않은 이웃이 있으면 번호를 주고 넣음, 없으면 현재까지의 최대 번호를 tout으로 기록하고 뺌 -> 질의마다 구간 포함 여부로 YES/NO 출력"
