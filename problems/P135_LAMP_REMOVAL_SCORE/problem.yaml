# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P135_LAMP_REMOVAL_SCORE
title: 등불 끄기
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 1500
referenceComplexity: O(N^3) 시간, O(N^2) 공간
statement: |
  등불 N개가 일렬로 놓여 있다. 왼쪽에서 i번째(1부터 센다) 등불의 밝기는 a_i 이다.

  등불을 하나씩 골라 끄고, 끈 등불은 줄에서 뺀다. 모든 등불을 끌 때까지 반복한다. 등불 하나를 끌 때 얻는 점수는 (그 순간 줄에서 바로 왼쪽에 남아 있는 등불의 밝기) × (끄는 등불의 밝기) × (그 순간 줄에서 바로 오른쪽에 남아 있는 등불의 밝기) 이다. 왼쪽이나 오른쪽에 남은 등불이 없으면 그쪽 밝기를 1로 본다.

  예를 들어 밝기가 2 3 4 이고 가운데 등불부터 끄면 2×3×4=24 점을 얻고 줄은 2 4 가 된다. 이어서 2 를 끄면 1×2×4=8 점, 마지막 4 를 끄면 1×4×1=4 점으로 이 순서의 점수 합은 36 이다.

  끄는 순서를 잘 골라 얻을 수 있는 점수 합의 최댓값을 구하라.

  입력 형식
  첫째 줄에 N 이 주어진다. (1 ≤ N ≤ 150)
  둘째 줄에 a_1, a_2, ..., a_N 이 공백으로 구분되어 주어진다. (1 ≤ a_i ≤ 100)

  출력 형식
  점수 합의 최댓값을 한 줄에 출력한다.

  인덱스 기준
  등불의 위치는 왼쪽부터 1부터 센다.
skills:
- code: INTERVAL_DP
  role: PRIMARY
  weight: 1.0
commonMistakes:
- IMPLEMENTATION_MISC
- INDEX_ERROR
- INPUT_PARSE
negativeControl:
  mistake: IMPLEMENTATION_MISC
  expectedStatus: WRONG_ANSWER
skillControl:
  approach: 남아 있는 등불 집합을 비트마스크로 두고 다음에 끌 등불을 모두 시도하는 메모이제이션 탐색 (상태 수 2^N).
