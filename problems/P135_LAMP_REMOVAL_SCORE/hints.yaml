# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "끄는 순서를 모두 따져 보면 N! 가지다. 어떤 등불을 먼저 끄는지보다, 어떤 등불이 마지막까지 남는지를 보면 줄이 서로 영향을 주지 않는 조각으로 나뉜다."
  - level: 2
    text: "연속한 등불 묶음 하나를 단위로 최적값을 구하고, 짧은 묶음의 값으로 긴 묶음의 값을 만드는 구간 DP 문제다."
  - level: 3
    text: "양 끝에 밝기 1인 가상의 등불을 붙이고, 2차원 표에 '구간 [l, r] 의 등불만 모두 끄고 l-1 번과 r+1 번은 아직 켜져 있을 때의 최대 점수'를 저장한다."
  - level: 4
    text: "구간 [l, r] 에서 마지막으로 끄는 등불을 k 라 하면, k 를 끌 때 양옆은 구간 바깥의 l-1 번과 r+1 번 등불이다. 따라서 값은 왼쪽 구간 [l, k-1] 의 값, 오른쪽 구간 [k+1, r] 의 값, 그리고 k 를 끄는 점수의 합이고 모든 k 중 최댓값을 고른다."
  - level: 5
    text: "길이를 1부터 N 까지 늘리며: 각 시작 l 에 대해 r 을 정하고, l..r 의 모든 k 에 대해 (왼쪽 구간 값 + 오른쪽 구간 값 + 바깥 양옆 밝기와 k 밝기의 곱) 의 최댓값을 표에 적는다. 답은 구간 [1, N] 의 값이다."
