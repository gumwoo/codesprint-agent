# 정본 형식: contracts/problem.schema.json
# Skill / Mistake 참조는 curriculum/ 에 실재해야 하며 CI 가 검증한다.

code: P11_LIST_BASIC
title: 구간의 합이 가장 큰 곳 찾기
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 300
referenceComplexity: "O(N)"

statement: |
  첫 줄에 정수의 개수 N 과 구간의 길이 K 가 주어진다.
  둘째 줄에 N 개의 정수가 공백으로 주어진다.

  길이가 정확히 K 인 연속 구간 중 합이 가장 큰 것의 합을 출력한다.
  K 는 N 이하다.

skills:
  - code: PYTHON_LIST_BASIC
    role: PRIMARY
    weight: 1.0

commonMistakes:
  - INPUT_PARSE
  - INDEX_ERROR
  - OUTPUT_FORMAT

# wrong.py 가 무엇을 틀리게 했고 그 결과가 어떤 판정이어야 하는가.
# 마지막 구간을 세지 않는다 - range 의 끝을 하나 적게 잡았다
negativeControl:
  mistake: INDEX_ERROR
  expectedStatus: WRONG_ANSWER
