# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# **H6(전체 풀이)는 여기 없다.** reference.py 가 그것이고, 복사본을 만들지 않는다
# (ADR-0012). 두 곳에 적으면 한쪽만 고쳐진 날 사용자가 틀린 풀이를 본다.
#
# 사다리는 위로 갈수록 더 준다. 아래 단계가 위 단계보다 많이 알려 주면 순서가
# 의미를 잃고, 그때 힌트 의존도(Addendum 74)는 아무것도 재지 못한다.
hints:
  - level: 1
    text: "인덱스는 0 부터 셉니다. 그리고 출력해야 하는 것은 get 의 결과뿐입니다."
  - level: 2
    text: "자료구조를 고르는 문제가 아닙니다. 리스트를 인덱스로 읽고 쓰기만 하면 됩니다."
  - level: 3
    text: "정수 리스트 하나를 만들어 두고, 명령을 읽으며 그 자리를 직접 바꿉니다."
  - level: 4
    text: "get i 는 values[i] 를 결과에 담고, set i v 는 values[i] = v 로 덮어씁니다. set 은 아무것도 출력하지 않습니다."
  - level: 5
    text: "values = 둘째 줄을 정수 리스트로 / 명령을 Q 번 읽는다 / 'get' 이면 values[i] 를 결과에 담고 'set' 이면 values[i] = v / 담아 둔 결과만 줄바꿈으로 출력한다"
