# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "행 우선 순서에서 같은 행 안의 칸들은 인덱스가 1씩 증가하고, 행이 바뀔 때 인덱스는 열의 개수만큼 건너뛴다."
  - level: 2
    text: "탐색이나 별도 알고리즘 없이 산술 변환만으로 각 질의를 O(1) 에 처리하는 문제다."
  - level: 3
    text: "변환에 필요한 값은 열의 개수 M 하나뿐이다. 격자 자체나 방문 배열을 저장할 필요가 없다."
  - level: 4
    text: "좌표를 인덱스로 바꿀 때는 idx = r * M + c 를, 인덱스를 좌표로 되돌릴 때는 row = idx // M, col = idx % M 을 사용한다. 여기서 곱하고 나누는 값은 항상 M 이며 N 이 아니다."
  - level: 5
    text: "질의 문자가 'R' 이면 r*M+c 를 출력하고, 'I' 이면 idx//M 과 idx%M 을 공백으로 이어 출력한다."
