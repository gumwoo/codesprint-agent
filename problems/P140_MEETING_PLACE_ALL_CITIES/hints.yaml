# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "도시마다 따로 모든 사람의 이동 거리를 다시 더하면 N번의 트리 탐색이 필요하다. 모임 장소를 도로 하나 건너 이웃 도시로 옮길 때 비용이 얼마나 바뀌는지 살펴보라."
  - level: 2
    text: "트리 DP를 두 번 한다. 한 번은 한 도시를 루트로 잡아 그 루트의 답을 구하고, 다음 번에는 그 답을 이웃으로 전파하는 재루팅(rerooting) 기법이다."
  - level: 3
    text: "루트를 하나 정해 부모 배열, 부모로 가는 도로 길이, 각 서브트리에 사는 사람 수의 합을 저장한다. 전체 인구 합도 따로 둔다. 재귀 깊이가 N까지 갈 수 있으니 방문 순서를 리스트로 기록해 반복문으로 처리한다."
  - level: 4
    text: "장소를 부모 p에서 자식 c로 길이 w인 도로를 따라 옮기면, c의 서브트리에 사는 사람은 w만큼 가까워지고 나머지 사람은 w만큼 멀어진다. 따라서 c의 비용은 p의 비용에 w × (서브트리 밖 인구 − 서브트리 안 인구)를 더한 값이다."
  - level: 5
    text: "1) 1번 도시에서 스택으로 탐색해 방문 순서, 부모, 부모 도로 길이, 루트까지 거리를 기록한다. 2) 방문 순서를 거꾸로 돌며 서브트리 인구를 부모에 누적한다. 3) 1번 도시의 비용을 (인구 × 거리)의 합으로 구한다. 4) 방문 순서대로 돌며 각 자식의 비용을 부모의 비용과 H4의 변화량으로 채운다. 5) 1번부터 N번까지 한 줄씩 출력한다."
