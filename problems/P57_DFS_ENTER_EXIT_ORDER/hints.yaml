# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "한 정점의 탐색이 끝나는 시점은 그 정점의 모든 이웃이 이미 방문된 뒤다. 들어간 순서와 끝난 순서가 서로 다르게 쌓인다."
  - level: 2
    text: "깊이 우선 탐색이다. 갈 수 있는 곳까지 들어갔다가 막히면 되돌아온다."
  - level: 3
    text: "정점마다 이웃 목록을 번호 오름차순으로 정렬해 두고, 방문 여부 배열과 현재 경로를 담는 스택을 쓴다. N이 크므로 재귀 대신 스택과 정점별 다음 이웃 위치를 저장하면 깊이 제한을 피할 수 있다."
  - level: 4
    text: "스택 맨 위 정점에서 방문하지 않은 가장 작은 이웃을 찾는다. 있으면 방문 표시 후 진입 순서에 기록하고 스택에 넣는다. 없으면 스택에서 꺼내 종료 순서에 기록한다."
  - level: 5
    text: "정렬된 인접 리스트 준비\nS 방문 표시, 진입 목록에 S, 스택에 S\n스택이 빌 때까지:\n  top = 스택 맨 위\n  top의 다음 이웃 위치를 방문된 이웃 너머로 옮긴다\n  남은 이웃 w가 있으면: w 방문 표시, 진입 목록에 w, 스택에 w\n  없으면: 스택에서 top을 꺼내 종료 목록에 top\n두 목록을 한 줄씩 출력"
