# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "중심을 하나 정하면 그 중심의 회문은 짧은 것이 긴 것 안에 겹겹이 들어 있다. 중심마다 가장 긴 것 하나만 알면 된다. 같은 글자가 길게 이어지면 중심마다 넓혀 보는 비용이 N^2 에 가까워진다."
  - level: 2
    text: "모든 중심의 최대 회문 반지름을 한 번의 왼쪽→오른쪽 훑기로 구하는 선형 알고리즘 범주다. 이미 구한 회문의 대칭성을 재활용한다."
  - level: 3
    text: "글자 사이에 구분 문자를 끼워 홀수·짝수 중심을 한 배열로 통일하고, 중심별 반지름 배열과 지금까지 오른쪽 끝이 가장 먼 회문의 중심·오른쪽 끝 두 값을 상태로 둔다."
  - level: 4
    text: "새 중심이 그 가장 먼 회문 안에 있으면, 그 회문의 중심에 대해 거울 위치의 반지름을 시작값으로 쓰되 오른쪽 끝을 넘지 않게 자른다. 그다음에만 한 칸씩 넓혀 보고, 오른쪽 끝이 더 멀어지면 두 상태 값을 갱신한다."
  - level: 5
    text: "변환 문자열 T 를 만든다(양끝에 서로 다른 보초). 각 위치 i 에 대해: 가장 먼 끝 안이면 반지름 = min(끝까지 거리, 거울 위치 반지름). 양옆 글자가 같은 동안 반지름 증가. 끝을 넘었으면 중심·끝 갱신. 끝나면 원래 위치 k 의 글자 칸과 그 오른쪽 틈 칸의 반지름 중 큰 값을 출력한다."
