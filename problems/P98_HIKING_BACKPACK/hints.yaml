# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "물건마다 넣는다/안 넣는다 두 가지뿐이라 조합은 최대 2^100 가지다. 반면 무게 합은 0 부터 W 까지의 정수 중 하나라서 가짓수가 W+1 개뿐이라는 점에 주목한다."
  - level: 2
    text: "동적 계획법, 그중에서도 각 항목을 최대 한 번만 쓰는 0-1 배낭 유형이다."
  - level: 3
    text: "길이 W+1 의 배열 하나를 둔다. 칸 j 에는 '지금까지 살펴본 물건만 써서 무게 합을 j 이하로 맞췄을 때의 최대 가치'를 담는다. 물건을 하나씩 살펴볼 때마다 배열 전체를 새 상태로 바꾼다."
  - level: 4
    text: "무게 w, 가치 v 인 물건을 새로 살펴볼 때 칸 j 의 새 값은 '이 물건을 넣지 않은 이전 값'과 '이 물건을 넣기 전 상태의 칸 j-w 값에 v 를 더한 값' 중 큰 쪽이다. 같은 배열을 제자리에서 고친다면 이번 물건으로 이미 바뀐 칸을 다시 읽지 않도록 갱신 순서를 정해야 한다."
  - level: 5
    text: "배열 = 0 으로 채운 W+1 칸\n물건 (w, v) 를 입력 순서대로 하나씩:\n    j 를 W 부터 w 까지 1 씩 줄이며:\n        배열[j] 를 (배열[j], 배열[j-w] + v) 중 큰 값으로 바꾼다\n배열[W] 를 출력"
