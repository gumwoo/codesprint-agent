negativeControl:
  mistake: IMPLEMENTATION_MISC
  expectedStatus: WRONG_ANSWER
skillControl:
  approach: 가장 왼쪽 아래 점에서 시작해 매번 모든 점을 훑어 다음 모서리를 고르는 선물 포장(Jarvis march), O(N·H).
