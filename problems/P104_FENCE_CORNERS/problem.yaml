# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P104_FENCE_CORNERS
title: 울타리 모서리 세기
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 1500
referenceComplexity: O(N log N)
statement: |
  평면 위에 말뚝 N개가 박혀 있다. 모든 말뚝을 안쪽 또는 테두리 위에 두는 볼록 다각형 가운데 넓이가 가장 작은 것으로 울타리를 친다.

  울타리의 모서리는 테두리가 실제로 꺾이는 점(내각이 180도보다 작은 점)만 센다. 두 모서리 사이의 곧은 변 위에 놓인 말뚝은 모서리가 아니다. 같은 좌표에 말뚝이 여러 개 있으면 한 점으로 본다.

  말뚝이 모두 같은 좌표에 있으면 모서리는 1개, 넓이는 0이다. 서로 다른 좌표가 2개 이상이고 모두 한 직선 위에 있으면 모서리는 양 끝 2개, 넓이는 0이다.

  입력
  첫 줄에 N (1 ≤ N ≤ 100000).
  다음 N개 줄에 말뚝의 좌표 x y 가 공백으로 구분되어 주어진다. 모두 정수이고 -1000000000 ≤ x, y ≤ 1000000000.
  말뚝의 순서는 답에 영향을 주지 않으므로 번호를 쓰지 않는다(인덱스 기준 없음).

  출력
  한 줄에 모서리 수와 울타리 넓이의 2배를 공백으로 구분해 출력한다. 넓이의 2배는 항상 정수다.

  예시
  입력
  7
  0 0
  2 0
  4 0
  4 3
  0 3
  2 1
  2 3
  출력
  4 24
  (2,0) 과 (2,3) 은 곧은 변 위에 있어 모서리가 아니고, (2,1) 은 안쪽에 있다.
skills:
