# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "울타리 테두리는 아래쪽 경계와 위쪽 경계 두 갈래로 나눌 수 있다. 왼쪽 끝 점과 오른쪽 끝 점이 두 갈래를 잇는다."
  - level: 2
    text: "점을 한 방향으로 훑으며 경계를 한 번에 쌓아 가는 볼록 껍질 구성법이다. 점 쌍마다 나머지 점을 모두 확인하면 N 이 크면 시간 안에 끝나지 않는다."
  - level: 3
    text: "중복을 없앤 점을 x, 같으면 y 순으로 정렬해 두고, 지금까지의 경계를 스택 하나로 들고 간다. 아래 경계용과 위 경계용으로 두 번 쓴다."
  - level: 4
    text: "새 점을 넣기 전에, 스택 맨 위 두 점과 새 점이 왼쪽으로 꺾이지 않으면(오른쪽으로 꺾이거나 일직선이면) 맨 위 점을 버린다. 일직선인 점도 버려야 곧은 변 위의 말뚝이 모서리로 세어지지 않는다."
  - level: 5
    text: "중복 제거 후 점이 1개면 1 0 출력\n정렬\n아래 경계: 정렬 순으로 각 점 p 에 대해 { 스택 위 두 점과 p 가 왼쪽 회전이 아닐 동안 pop; p push }\n위 경계: 역순으로 같은 과정\n두 경계에서 겹치는 양 끝을 한 번씩만 남겨 이어 붙임\n이어진 순서로 이웃한 두 점의 외적을 더해 넓이의 2배를 구하고, 점 개수와 함께 출력"
