# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "질의는 최대 5만 개이고 n 은 50만까지 커진다. 질의마다 방법의 수를 처음부터 계산하면 같은 곱셈을 수없이 반복한다. 모든 질의가 같은 소수로 나눈 나머지를 묻는다는 점에 주목한다."
  - level: 2
    text: "소수로 나눈 나머지 세계에서는 나눗셈을 '곱셈 역원을 곱하는 것'으로 바꿀 수 있다. 소수 p 에 대해 a 의 역원은 a 를 p-2 번 거듭제곱한 값이다(페르마의 소정리)."
  - level: 3
    text: "입력에서 가장 큰 값까지 두 배열을 미리 채운다. 하나는 1 부터 i 까지의 곱을 나눈 나머지, 다른 하나는 그 값의 곱셈 역원이다."
  - level: 4
    text: "역원 배열은 가장 큰 칸 하나만 거듭제곱으로 구한다. 그 아래 칸은 바로 위 칸에 그 칸의 번호를 곱해 내려가며 채운다. 질의 하나는 곱셈 세 번이면 끝나고, k 가 n 보다 크면 배열을 보지 않고 0 이다."
  - level: 5
    text: "m = 입력 값의 최댓값\nF[0] = 1; i = 1..m 에 대해 F[i] = F[i-1] * i mod P\nG[m] = F[m] 의 (P-2) 제곱 mod P\ni = m..1 에 대해 G[i-1] = G[i] * i mod P\n각 질의 (n, k): k > n 이면 0, 아니면 F[n] * G[k] * G[n-k] 를 mod P 로 줄여 출력"
