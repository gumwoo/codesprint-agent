# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P101_BINOMIAL_QUERIES
title: 번호표 고르기 질의
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 900
referenceComplexity: O(N + Q + log MOD), N = 입력에 나온 n, k 의 최댓값
statement: |
  서로 다른 번호표 n 장 중에서 순서를 따지지 않고 k 장을 고르는 방법의 수를 묻는 질의가 Q 개 주어진다. 각 질의마다 그 방법의 수를 1,000,000,007 로 나눈 나머지를 출력한다. 같은 번호표 묶음은 고른 순서가 달라도 한 가지로 센다. 예를 들어 n = 4, k = 2 이면 {1,2}, {1,3}, {1,4}, {2,3}, {2,4}, {3,4} 의 6 가지다. 아무것도 고르지 않는 방법(k = 0)은 1 가지이고, k 가 n 보다 크면 고를 수 없으므로 0 이다.

  입력
  첫 줄에 질의 수 Q 가 주어진다. 다음 Q 줄의 각 줄에 두 정수 n, k 가 공백으로 구분되어 주어진다.

  출력
  질의가 주어진 순서대로 한 줄에 하나씩 답을 출력한다.

  제약
  - 1 ≤ Q ≤ 50,000
  - 0 ≤ n ≤ 500,000
  - 0 ≤ k ≤ 500,000
  - 번호표나 질의에 인덱스를 매기지 않는다. 질의는 입력 순서대로 답한다.
skills:
- code: BINOMIAL_MOD
  role: PRIMARY
  weight: 1.0
commonMistakes:
- IMPLEMENTATION_MISC
- INPUT_PARSE
negativeControl:
  mistake: IMPLEMENTATION_MISC
  expectedStatus: WRONG_ANSWER
skillControl:
  approach: 질의마다 math.comb 로 큰 정수 이항 계수를 구한 뒤 나머지를 취한다.
