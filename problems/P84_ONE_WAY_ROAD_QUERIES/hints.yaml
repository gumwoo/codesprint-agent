# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "질의가 최대 10000개인데 도시는 100개뿐이다. 질의마다 따로 경로를 찾기보다, 모든 출발-도착 쌍의 답을 먼저 한 번에 구해 두면 질의는 표를 읽기만 하면 된다."
  - level: 2
    text: "모든 정점 쌍의 최단 거리를 구하는 동적 계획법 범주다. '중간에 거쳐도 되는 도시의 집합'을 조금씩 넓혀 가며 답을 개선한다."
  - level: 3
    text: "N×N 거리 표 하나를 상태로 둔다. 처음에는 자기 자신은 0, 도로가 있으면 같은 쌍의 도로 중 가장 짧은 시간, 나머지는 아주 큰 값으로 채운다."
  - level: 4
    text: "거쳐 가도 되는 도시로 k를 새로 허용할 때, 모든 쌍 (i, j)에 대해 'i에서 k까지 + k에서 j까지'가 지금 값보다 짧으면 바꾼다. k에 대한 반복이 가장 바깥에 있어야 한다."
  - level: 5
    text: "거리 표 초기화 → 도로마다 더 짧은 값만 기록 → 바깥 반복 k, 그 안에서 모든 i, j 쌍을 k를 경유한 값과 비교해 갱신 → 질의마다 표의 값을 출력하고, 여전히 큰 값이면 -1."
