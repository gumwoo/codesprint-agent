# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "값의 범위는 20억이 넘지만 원소는 최대 10만 개다. 실제로 등장하는 서로 다른 값만 중요하고, 값의 크기 자체는 대소 관계로만 쓰인다."
  - level: 2
    text: "값을 크기 순서로 늘어놓으면 각 값의 자리가 곧 순위가 된다. 정렬로 푸는 문제다."
  - level: 3
    text: "중복을 없앤 값 목록을 오름차순으로 만들고, 값에서 그 목록 안의 위치로 가는 사전을 둔다. 같은 값이 여러 번 나와도 목록에는 한 번만 있어야 한다."
  - level: 4
    text: "중복을 없앤 정렬 목록에서 k 번째(0부터) 값의 순위는 k 다. 원래 수열의 각 원소는 사전에서 자기 순위를 바로 찾는다. 원소마다 작은 값을 다시 세면 O(N^2) 이 된다."
  - level: 5
    text: "1) N 과 수열을 읽는다. 2) 서로 다른 값만 모아 오름차순 정렬한다. 3) 정렬된 목록을 앞에서부터 보며 값마다 위치 번호를 사전에 기록한다. 4) 원래 순서대로 각 원소의 번호를 사전에서 꺼내 한 줄로 출력한다."
