# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P91_VALUE_TO_RANK
title: 값을 순위로 바꾸기
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 600
referenceComplexity: O(N log N)
statement: |
  길이 N 인 정수 수열 A 가 주어진다. 각 원소 A[i] 를 그 원소의 순위로 바꾼 수열을 출력한다.

  A[i] 의 순위는 수열에 등장하는 서로 다른 값들 가운데 A[i] 보다 작은 값의 개수다. 순위는 0 부터 센다. 같은 값은 같은 순위를 받는다.

  예: A = [30, -5, 30, 7] 이면 서로 다른 값은 -5, 7, 30 세 개이고, 출력은 2 0 2 1 이다.

  입력 형식
  - 첫째 줄: N (1 <= N <= 100000)
  - 둘째 줄: 공백으로 구분된 정수 N 개 A[0], A[1], ..., A[N-1] (-1000000000 <= A[i] <= 1000000000)

  출력 형식
  - 한 줄에 A[0], A[1], ..., A[N-1] 의 순위를 입력 순서대로 공백으로 구분해 출력한다.
skills:
- code: COORDINATE_COMPRESSION
  role: PRIMARY
  weight: 1.0
commonMistakes:
- IMPLEMENTATION_MISC
- INPUT_PARSE
- OUTPUT_FORMAT
negativeControl:
  mistake: IMPLEMENTATION_MISC
  expectedStatus: WRONG_ANSWER
skillControl: null
