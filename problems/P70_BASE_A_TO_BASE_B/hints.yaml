# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "각 자리 문자는 0 이상 35 이하의 값 하나를 뜻한다. A 진법 문자열과 B 진법 문자열 사이에 공통으로 쓸 수 있는 표현이 무엇인지 생각한다."
  - level: 2
    text: "두 단계로 나눈다: A 진법 문자열을 하나의 정수 값으로 합치고, 그 값을 B 진법 자릿수로 다시 나눈다."
  - level: 3
    text: "상태는 누적 정수 값 하나와, 나머지로 얻은 B 진법 자릿수 목록 하나면 된다. 문자와 자릿값의 대응은 0-9, A-Z 순서의 문자열 하나로 처리한다."
  - level: 4
    text: "합칠 때는 왼쪽 자리부터 읽으며 누적값에 A 를 곱하고 현재 자릿값을 더한다. 나눌 때는 값을 B 로 나눈 나머지가 가장 낮은 자리이고, 몫으로 값을 바꿔 0 이 될 때까지 반복한다. 값이 처음부터 0 이면 따로 처리한다."
  - level: 5
    text: "value = 0\nS 의 각 문자 c 에 대해: value = value * A + (c 의 자릿값)\nvalue 가 0 이면 \"0\" 출력 후 종료\n자릿수 목록 = []\nvalue > 0 인 동안: 나머지 r 을 구해 목록 끝에 r 에 해당하는 대문자 문자를 붙이고, value 를 몫으로 바꾼다\n목록을 뒤집어 이어 붙여 출력"
