# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "기록 사이의 구분자와 기록 안의 구분 기준이 다르다. 쉼표로 기록을 나누고, 기록 안에서는 문자 종류가 바뀌는 곳이 경계다."
  - level: 2
    text: "문자열을 한 번 훑으며 토큰으로 나누는 파싱 문제다. 계산은 이름별 누적 합뿐이다."
  - level: 3
    text: "이름을 키로, 잔액을 값으로 두는 사전을 쓴다. 삽입 순서를 유지하면 처음 등장 순서가 그대로 남는다."
  - level: 4
    text: "기록마다 앞뒤 공백을 걷어낸 뒤, 앞에서부터 소문자가 끝나는 위치를 찾는다. 그 위치의 문자가 부호, 나머지 전부가 수다. 수의 길이를 고정해서 읽으면 안 된다."
  - level: 5
    text: "줄을 읽어 양끝 공백 제거 → 쉼표로 분리 → 각 조각의 공백 제거 → 첫 번째 비문자 위치 p 찾기 → 이름=앞부분, 부호=p 위치, 수=p 뒤 전체를 정수로 → 부호에 따라 더하거나 빼서 누적 → 등장 순서대로 '이름 잔액' 출력."
