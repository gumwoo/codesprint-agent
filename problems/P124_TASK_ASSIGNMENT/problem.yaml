# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P124_TASK_ASSIGNMENT
title: 작업 배정
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 1200
referenceComplexity: O(N * E), E 는 모든 k 의 합
statement: |
  작업자 N명과 작업 M개가 있다. 작업자는 1번부터 N번까지, 작업은 1번부터 M번까지 번호가 붙어 있다(1-based). 각 작업자는 자신이 맡을 수 있는 작업의 목록을 가지고 있다. 한 작업자는 작업을 최대 하나만 맡고, 한 작업은 최대 한 명에게만 배정된다. 작업자는 자신의 목록에 있는 작업만 맡을 수 있다. 동시에 배정할 수 있는 (작업자, 작업) 쌍의 최대 개수를 구하라.

  입력
  첫 줄에 정수 N, M 이 공백으로 구분되어 주어진다.
  다음 N개의 줄 중 i번째 줄에는 i번 작업자의 정보가 주어진다. 줄의 첫 정수 k 는 그 작업자가 맡을 수 있는 작업의 수이고, 이어서 서로 다른 작업 번호 k개가 공백으로 구분되어 주어진다.

  제약
  1 <= N <= 100
  1 <= M <= 100
  0 <= k <= M
  작업 번호는 1 이상 M 이하이고, 한 줄 안에서 중복되지 않는다.
  모든 줄의 k 의 합은 5000 이하이다.

  출력
  동시에 배정할 수 있는 쌍의 최대 개수를 한 줄에 출력한다.

  예시 설명
  작업자 1이 작업 1, 2 를, 작업자 2가 작업 1 만 맡을 수 있을 때, 작업자 1에게 작업 1을 주면 작업자 2는 아무것도 맡지 못한다. 작업자 1에게 작업 2를 주면 두 쌍을 모두 배정할 수 있으므로 답은 2다.
skills:
- code: BIPARTITE_MATCHING
  role: PRIMARY
  weight: 0.7
- code: DFS_TRAVERSAL
  role: SECONDARY
  weight: 0.3
commonMistakes:
- INDEX_ERROR
- INPUT_PARSE
negativeControl:
  mistake: INDEX_ERROR
  expectedStatus: RUNTIME_ERROR
skillControl:
  approach: 각 작업자마다 아무것도 맡지 않는 경우와 비어 있는 작업 하나를 맡는 경우를 모두 재귀로 시도해 최댓값을 구한다.
