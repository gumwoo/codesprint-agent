# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "한 작업자에게 처음 고른 작업이 나중에 다른 작업자를 막을 수 있다. 먼저 고른 선택을 되돌릴 수 있어야 한다."
  - level: 2
    text: "작업자와 작업을 두 무리의 정점으로, 맡을 수 있는 관계를 간선으로 보는 그래프 문제다. 서로 끝점이 겹치지 않는 간선을 최대한 많이 고른다."
  - level: 3
    text: "각 작업이 현재 어느 작업자에게 배정됐는지 기록하는 배열과, 한 번의 탐색 안에서 이미 살펴본 작업을 표시하는 배열을 둔다."
  - level: 4
    text: "새 작업자가 원하는 작업이 이미 배정되어 있으면, 그 작업을 가진 작업자가 다른 작업으로 옮겨 갈 수 있는지 재귀적으로 확인한다. 옮겨 갈 수 있으면 비워진 작업을 새 작업자가 가져간다."
  - level: 5
    text: "각 작업자 u 에 대해: 살펴봄 표시를 모두 지운다. 탐색(u): u 의 각 작업 t 중 아직 살펴보지 않은 것에 대해 t 를 살펴봄으로 표시하고, t 가 비었거나 t 의 현재 주인에 대해 탐색이 성공하면 t 를 u 에게 주고 성공을 돌려준다. 모두 실패하면 실패. 성공한 횟수를 출력한다."
