# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P66_KTH_NEIGHBOR
title: k번째 이웃
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 900
referenceComplexity: O(N + M log M + Q)
statement: |
  정점 N개와 간선 M개로 이루어진 무방향 그래프가 주어진다. 정점 번호는 1부터 N까지다(1-based). 자기 자신으로 가는 간선과 같은 두 정점을 잇는 중복 간선은 없다. 질의 Q개가 주어진다. 각 질의는 정점 v와 정수 k로 이루어진다. v와 간선으로 직접 연결된 이웃들의 번호를 오름차순으로 나열했을 때 k번째(1-based) 번호를 출력한다. 이웃이 k개보다 적으면 -1을 출력한다.

  입력 형식
  - 첫 줄: N M
  - 다음 M줄: 간선의 두 끝점 u v (1 ≤ u, v ≤ N, u ≠ v)
  - 다음 줄: Q
  - 다음 Q줄: v k (1 ≤ v ≤ N, 1 ≤ k ≤ N)

  출력 형식
  - 질의마다 한 줄에 답 하나를 입력 순서대로 출력한다.

  제한
  - 1 ≤ N ≤ 200000
  - 0 ≤ M ≤ 200000
  - 1 ≤ Q ≤ 100000
skills:
- code: GRAPH_REPRESENTATION
  role: PRIMARY
  weight: 0.7
- code: PYTHON_LIST_BASIC
  role: SECONDARY
  weight: 0.3
commonMistakes:
- IMPLEMENTATION_MISC
- INDEX_ERROR
- INPUT_PARSE
negativeControl:
  mistake: IMPLEMENTATION_MISC
  expectedStatus: WRONG_ANSWER
skillControl:
  approach: 인접 리스트 없이 질의마다 간선 목록 전체를 훑어 v 의 이웃을 모은 뒤 정렬한다.
