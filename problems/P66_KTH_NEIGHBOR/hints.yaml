# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "같은 정점에 대한 질의가 여러 번 온다. 질의마다 간선 M개를 전부 다시 훑으면 전체 작업량이 Q × M 이 된다."
  - level: 2
    text: "그래프 표현 문제다. 간선 목록을 정점별 이웃 목록으로 한 번만 바꿔 두면 각 질의는 그 목록만 보면 된다."
  - level: 3
    text: "크기 N+1 인 리스트를 두고 칸 v 에 v 의 이웃 번호들을 모은다. 무방향 간선이므로 두 끝점 모두의 목록에 상대 정점을 넣는다. 모든 간선을 넣은 뒤 각 목록을 오름차순으로 정렬한다."
  - level: 4
    text: "질의 (v, k) 의 답은 v 의 정렬된 이웃 목록에서 1-based k번째 원소다. 목록 길이가 k 보다 작으면 -1 이다. 리스트 인덱스는 0 부터이므로 위치를 한 칸 당겨야 한다."
  - level: 5
    text: "adj = 빈 목록 N+1 개\n간선 (u, v) 마다: adj[u] 에 v 추가, adj[v] 에 u 추가\n각 adj[x] 정렬\n질의 (v, k) 마다: 길이(adj[v]) >= k 이면 adj[v] 의 (k-1) 위치 출력, 아니면 -1 출력"
