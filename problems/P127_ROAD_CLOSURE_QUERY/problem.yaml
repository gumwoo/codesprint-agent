# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P127_ROAD_CLOSURE_QUERY
title: 통제해도 되는 도로
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 1500
referenceComplexity: O(N + M + Q)
statement: |
  마을 N개와 양방향 도로 M개가 있다. 마을은 1번부터 N번까지, 도로는 입력 순서대로 1번부터 M번까지 번호가 붙는다(모두 1-based). 각 도로는 서로 다른 두 마을을 잇는다. 같은 두 마을을 잇는 도로가 여러 개 있을 수 있고, 처음부터 서로 오갈 수 없는 마을 묶음이 여러 개일 수 있다.

  두 마을은 도로를 따라 오갈 수 있으면 같은 묶음에 속한다. 공사 계획 Q개가 주어진다. 각 계획은 도로 번호 k 하나이며, 다른 도로는 모두 그대로 둔 채 k번 도로 하나만 막는 경우를 뜻한다. 계획마다 독립이다(앞 계획에서 막은 도로는 다시 열린다). k번 도로를 막았을 때 서로 오갈 수 없는 마을 묶음의 수가 처음보다 늘어나면 YES, 그대로면 NO 를 출력한다.

  예: 도로가 1-2, 2-3, 3-1 이면 어느 하나를 막아도 세 마을은 여전히 오갈 수 있으므로 NO 다. 4-5 를 잇는 도로가 두 개면 하나를 막아도 남은 하나로 오갈 수 있으므로 NO 다. 5-6 을 잇는 도로가 하나뿐이면 막는 순간 6은 떨어져 나가므로 YES 다.

  입력
  첫 줄에 N, M.
  다음 M줄에 i번 도로가 잇는 두 마을 u, v.
  다음 줄에 Q.
  다음 Q줄에 도로 번호 k 하나씩.

  출력
  계획마다 한 줄에 YES 또는 NO 를 입력 순서대로 출력한다.

  제약
  2 ≤ N ≤ 50000
  1 ≤ M ≤ 60000
  1 ≤ Q ≤ 20000
  1 ≤ u, v ≤ N, u ≠ v
  1 ≤ k ≤ M (같은 k 가 여러 번 나올 수 있다)
skills:
- code: BRIDGE
  role: PRIMARY
  weight: 0.7
- code: DFS_TRAVERSAL
  role: SECONDARY
  weight: 0.3
commonMistakes:
- IMPLEMENTATION_MISC
- INDEX_ERROR
- INPUT_PARSE
negativeControl:
  mistake: IMPLEMENTATION_MISC
  expectedStatus: WRONG_ANSWER
skillControl:
  approach: 계획마다 해당 도로만 빼고 한쪽 끝에서 BFS 를 돌려 다른 끝에 닿는지 확인한다.
