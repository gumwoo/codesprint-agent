# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "도로 하나를 막아서 묶음이 늘어나려면, 그 도로 양 끝 마을 사이에 그 도로를 쓰지 않는 다른 길이 없어야 한다. 모든 계획의 답은 도로마다 미리 한 번 정해 둘 수 있다."
  - level: 2
    text: "깊이 우선 탐색 한 번으로 모든 도로를 동시에 판정하는 그래프 탐색 문제다. 계획마다 탐색을 새로 하면 시간이 모자란다."
  - level: 3
    text: "정점마다 처음 방문한 순서와, 그 정점 아래 탐색 영역에서 트리 간선을 거슬러 올라가지 않고 닿을 수 있는 가장 이른 방문 순서를 저장한다. 되돌아가는 도로는 정점이 아니라 도로 번호로 구분해야 겹친 도로를 올바르게 다룬다."
  - level: 4
    text: "자식 c 의 탐색이 끝나면 c 가 닿는 가장 이른 순서를 부모에게 넘겨 최솟값으로 갱신한다. 그 값이 부모의 방문 순서보다 크면, 부모와 c 를 잇는 도로는 막는 순간 묶음을 늘린다."
  - level: 5
    text: "방문 안 한 정점마다 탐색 시작 -> 정점 u 에서 도로 (v, e) 를 볼 때 e 가 u 로 들어온 도로면 건너뜀 -> v 를 이미 방문했으면 u 의 최솟값을 v 의 방문 순서로 갱신 -> 아니면 순서를 매기고 v 로 내려감 -> v 가 끝나면 u 의 최솟값 갱신, v 의 값 > u 의 방문 순서이면 e 표시 -> 계획마다 표시 여부 출력. N 이 커서 재귀 대신 직접 관리하는 스택을 쓴다."
