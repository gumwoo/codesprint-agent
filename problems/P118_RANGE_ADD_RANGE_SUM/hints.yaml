# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "1 번 연산 하나가 바꾸는 원소는 N 개에 가까울 수 있다. 원소를 하나씩 고치면 갱신 Q 번만으로 N × Q 번의 작업이 된다. 2 번 연산도 구간을 하나씩 더하면 같은 문제가 생긴다."
  - level: 2
    text: "수열을 절반씩 나눈 구간들로 이루어진 트리로 보면, 어떤 [l, r] 도 O(log N) 개의 조각으로 덮인다. 갱신은 조각 전체에 대해 기록만 해 두고, 필요할 때까지 아래로 내려보내지 않는다."
  - level: 3
    text: "노드마다 담당 구간의 합, 아직 자식에게 넘기지 않은 '구간 전체에 더할 값', 담당 구간의 길이를 둔다. 길이가 있어야 보류된 값이 합에 얼마나 기여하는지 계산할 수 있다."
  - level: 4
    text: "노드 구간이 갱신 범위에 완전히 들어가면 그 노드의 합에 (x × 구간 길이)를 더하고 보류 값에 x 를 더한 뒤 더 내려가지 않는다. 자식을 들여다봐야 할 때는 먼저 보류 값을 두 자식에게 같은 방식으로 넘기고 비운다. 자식을 고친 뒤에는 부모의 합을 두 자식의 합으로 다시 계산한다."
  - level: 5
    text: "update(node, 구간, l, r, x): 겹치지 않으면 끝 / 완전히 포함되면 합 += x × 길이, 보류 += x, 끝 / 아니면 보류 값을 자식에게 넘김 → 두 자식에 재귀 → 합 = 왼쪽 합 + 오른쪽 합. query(node, 구간, l, r): 겹치지 않으면 0 / 완전히 포함되면 합 / 아니면 보류 값을 넘기고 두 자식 결과의 합."
