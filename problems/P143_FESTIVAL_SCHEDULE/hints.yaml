# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "공연 하나를 고르면 그 공연이 끝나는 날까지는 다른 공연을 볼 수 없다. 다음 공연을 고를 여지를 가장 많이 남기는 공연이 어떤 공연인지 생각해 본다."
  - level: 2
    text: "공연을 한 기준으로 줄 세운 뒤, 앞에서부터 고를 수 있으면 바로 고르는 탐욕 선택으로 푼다. 어떤 기준으로 줄 세워야 탐욕이 최적이 되는지가 핵심이다."
  - level: 3
    text: "공연을 (끝나는 날, 시작하는 날) 쌍으로 담은 목록과, 지금까지 고른 공연 중 마지막 공연이 끝난 날을 기억하는 변수 하나면 충분하다."
  - level: 4
    text: "끝나는 날이 빠른 순으로 보면서, 시작하는 날이 마지막으로 고른 공연의 끝나는 날보다 엄격히 뒤일 때만 고르고 끝난 날을 갱신한다. 같은 날에 끝나고 시작하면 겹친 것이다."
  - level: 5
    text: "공연 목록을 끝나는 날 기준으로 정렬한다 → 개수 = 0, 마지막 끝난 날 = 0 → 각 공연에 대해: 시작일이 마지막 끝난 날보다 크면 개수를 1 늘리고 마지막 끝난 날을 이 공연의 끝나는 날로 바꾼다 → 개수를 출력한다."
