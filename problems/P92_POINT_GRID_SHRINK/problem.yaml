# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P92_POINT_GRID_SHRINK
title: 점 지도 줄이기
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 600
referenceComplexity: O(N log N + H·W)
statement: |
  평면 위에 점 N 개가 주어진다. 좌표 값은 매우 클 수 있지만 점의 수는 적다. 빈 줄과 빈 칸을 모두 없앤 작은 지도를 만들어 출력한다.

  지도의 열은 점들의 x 좌표로 등장하는 서로 다른 값마다 하나씩 있고, x 값이 작은 것부터 왼쪽에 놓인다. 지도의 행은 점들의 y 좌표로 등장하는 서로 다른 값마다 하나씩 있고, y 값이 작은 것부터 위에 놓인다. 행과 열 번호는 0 부터 센다. 서로 다른 y 값의 개수를 H, 서로 다른 x 값의 개수를 W 라 한다. 각 칸에는 그 칸의 x 값과 y 값을 좌표로 가진 점의 개수를 적는다. 같은 좌표의 점이 여러 번 주어질 수 있고, 모두 센다.

  예: 점이 (100, -7), (5, -7), (100, 2000), (100, -7) 이면 x 값은 5, 100 두 가지, y 값은 -7, 2000 두 가지다. 0 번 행(y = -7)은 x = 5 에 1 개, x = 100 에 2 개가 있다. 1 번 행(y = 2000)은 x = 5 에 0 개, x = 100 에 1 개가 있다. 출력은
  2 2
  1 2
  0 1
  이다.

  입력 형식
  첫 줄에 N 이 주어진다. 다음 N 개의 줄에 점의 좌표 x y 가 공백으로 구분되어 주어진다.

  출력 형식
  첫 줄에 H 와 W 를 공백으로 구분해 출력한다. 다음 H 개의 줄에 0 번 행부터 차례로, 각 행의 W 개 칸 값을 0 번 열부터 공백으로 구분해 출력한다.

  제약
  1 ≤ N ≤ 200
  -1000000000 ≤ x, y ≤ 1000000000
  모든 값은 정수다.
