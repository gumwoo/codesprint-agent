# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "지도의 크기를 정하는 것은 좌표 값의 크기가 아니라 x, y 각각에 서로 다른 값이 몇 가지 나오는가이다."
  - level: 2
    text: "큰 값을 '작은 쪽부터 몇 번째 값인가'로 바꾸어 배열 인덱스로 쓰는 좌표 압축 문제다. x 와 y 를 따로 압축한다."
  - level: 3
    text: "x 축과 y 축 각각에 대해 중복 없이 정렬한 값 목록과, 값에서 그 위치로 가는 사전을 만든다. 칸 값은 H × W 크기의 2차원 리스트에 담는다."
  - level: 4
    text: "점 하나는 y 값의 위치를 행, x 값의 위치를 열로 하는 칸의 개수를 1 늘린다. 같은 값이 여러 번 나와도 위치는 한 번만 부여해야 행과 열 수가 맞는다."
  - level: 5
    text: "x 값 집합을 정렬해 목록 X 를, y 값 집합을 정렬해 목록 Y 를 만든다 → 각 목록의 값마다 위치 번호를 사전에 기록한다 → 0 으로 채운 len(Y) 행 len(X) 열 격자를 만든다 → 각 점마다 두 사전으로 행과 열을 찾아 칸을 1 늘린다 → 행 수, 열 수를 출력하고 격자를 한 행씩 출력한다."
