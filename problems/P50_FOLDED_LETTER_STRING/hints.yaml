# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "n이 26이면 문자열 길이가 약 6천7백만이다. S(n)은 S(n-1) 두 개와 가운데 글자 하나로만 이루어져 있다는 점을 본다."
  - level: 2
    text: "재귀로 문제를 더 작은 같은 문제로 줄인다. k가 왼쪽 S(n-1), 가운데 글자, 오른쪽 S(n-1) 중 어디에 있는지 판단한다."
  - level: 3
    text: "상태는 (n, k) 두 값뿐이다. S(n-1)의 길이 2^(n-1) - 1 만 알면 세 구간의 경계를 구할 수 있다."
  - level: 4
    text: "k가 왼쪽이면 (n-1, k)로, 가운데면 n번째 글자가 답, 오른쪽이면 왼쪽 길이와 가운데 한 칸을 뺀 위치로 (n-1)에 내려간다. n이 1이면 답은 'a'다."
  - level: 5
    text: "f(n, k): n이 1이면 'a' 반환. L = S(n-1)의 길이. k < L 이면 f(n-1, k). k == L 이면 n번째 소문자. 그 외 f(n-1, k - L - 1)."
