# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "같은 문자가 연속으로 이어진 구간 하나가 출력의 한 조각이 된다. 구간이 어디서 끊기는지 보라."
  - level: 2
    text: "문자열을 왼쪽에서 오른쪽으로 한 번만 훑는 선형 순회로 충분하다."
  - level: 3
    text: "현재 구간의 문자와 그 구간의 길이, 두 가지만 기억하면 된다. 결과는 조각을 모은 리스트에 담는다."
  - level: 4
    text: "다음 문자가 현재 문자와 같으면 길이를 1 늘리고, 다르면 지금까지의 구간을 결과에 기록한 뒤 새 구간을 시작한다. 순회가 끝나면 남은 마지막 구간도 기록해야 한다."
  - level: 5
    text: "cur = 첫 문자, len = 1\n나머지 문자 c 마다:\n  c 가 cur 와 같으면 len 증가\n  아니면 cur 와 (len 이 2 이상일 때만 len) 을 결과에 추가, cur = c, len = 1\n마지막 cur 와 len 을 같은 규칙으로 추가\n결과를 이어 붙여 출력"
