# 문제 템플릿 - 같은 Skill 을 재는 문제들의 가족과, 서로 무엇이 다른가
#
# 정본: PRD §63(Problem Template System) · §149(정답 암기 방지), ADR-0051.
# 계약: contracts/problem-template.schema.json. 검사: tools/check_problems.py.
#
# 이것은 §63 예시 같은 **생성 파라미터 스키마가 아니라 가족 레지스트리**다. 템플릿은 **문제를 만들지 않는다.** 문제는 LLM 초안을 채택 검사가 받아들여 만든다(ADR-0032) - 템플릿은
# 이미 있는 문제들이 같은 가족이라는 것과, 가족 안에서 무엇을 바꿨는지를 적는다. PRD §149 "같은 패턴의 숫자만
# 바꾼 문제를 반복하지 않는다" 를 데이터로 지키려는 것이다 - 가족 안의 두 문제는 **숫자(제약 조건) 말고 다른
# 축에서** 값이 달라야 한다(CI 가 본다). 단, **선언한 가족에만** 걸린다 - 어느 가족에도 넣지 않은 새 문제는
# 이 검사를 지나지 않는다(ADR-0051 남는 위험).
#
# 규칙(CI):
#   - variants 의 문제는 problems/ 에 있고, PRIMARY Skill 이 템플릿의 skill 과 같다
#   - 한 문제는 한 템플릿에만 속한다
#   - 변형은 둘 이상이다
#   - 변형은 parameters 의 값을 모두 적는다
#   - 두 변형은 axis 가 "제약 조건" 이 아닌 parameter 하나 이상에서 값이 다르다

templates:
  - code: GRID_REGION
    name: 격자 영역
    skill: BFS_GRID_TRAVERSAL
    parameters:
      - name: requiredOutput
        axis: 출력 요구
    variants:
      - problem: P02_GRID_TRAVERSAL
        values: { requiredOutput: "(0, 0) 에서 도달할 수 있는 칸의 개수" }
      - problem: P03_CONNECTED_COMPONENT
        values: { requiredOutput: "영역의 개수" }
      - problem: P04_AREA_SIZE
        values: { requiredOutput: "가장 큰 영역의 크기" }

  - code: GRID_SHORTEST_DISTANCE
    name: 격자 최단 거리
    skill: BFS_SHORTEST_PATH
    parameters:
      - name: moves
        axis: 문제 서술
      - name: requiredOutput
        axis: 출력 요구
    variants:
      - problem: P05_SHORTEST_PATH
        values: { moves: "상하좌우", requiredOutput: "도착 칸까지 지나는 칸의 최소 개수" }
      - problem: P09_BFS_VARIANT_A
        values: { moves: "상하좌우와 대각선", requiredOutput: "도착 칸까지 지나는 칸의 최소 개수" }
      - problem: P10_BFS_REVIEW
        values: { moves: "상하좌우", requiredOutput: "도달 가능한 칸 중 가장 먼 칸까지의 거리" }

  - code: GRAPH_BFS
    name: 그래프 너비 우선 탐색
    skill: BFS_BASIC
    parameters:
      - name: requiredOutput
        axis: 출력 요구
    variants:
      - problem: P14_GRAPH_REACHABLE
        values: { requiredOutput: "1 번에서 도달할 수 있는 정점의 개수" }
      - problem: P16_BFS_VISIT_ORDER
        values: { requiredOutput: "시작 정점에서의 방문 순서" }

  - code: INTERVAL_OVERLAP
    name: 구간 겹침
    skill: INTERVAL_SWEEP
    parameters:
      - name: requiredOutput
        axis: 출력 요구
    variants:
      - problem: P106_INTERVAL_COVER_AT_LEAST_K
        values: { requiredOutput: "K 개 이상에 덮인 부분의 길이" }
      - problem: P107_PEAK_CONCURRENT_TIME
        values: { requiredOutput: "동시 접속자 수의 최댓값과 그 값이 되는 가장 이른 시각" }

  - code: PREFIX_BORDER
    name: 접두사 경계
    skill: PREFIX_FUNCTION
    parameters:
      - name: requiredOutput
        axis: 출력 요구
    variants:
      - problem: P108_REPEATED_PREFIX_SUM
        values: { requiredOutput: "접두사마다 가장 큰 반복 횟수의 합" }
      - problem: P109_PREFIX_OCCURRENCE_COUNT
        values: { requiredOutput: "접두사마다 문자열 안의 등장 횟수" }

  - code: BIPARTITE_ASSIGNMENT
    name: 두 무리 짝짓기
    skill: BIPARTITE_MATCHING
    parameters:
      - name: representation
        axis: 자료 표현
    variants:
      - problem: P124_TASK_ASSIGNMENT
        values: { representation: "작업자마다 맡을 수 있는 작업의 목록" }
      - problem: P125_DOMINO_TILE_FLOOR
        values: { representation: "격자 - 인접한 두 빈 칸이 짝" }
