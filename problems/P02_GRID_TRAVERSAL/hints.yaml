# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# **H6(전체 풀이)는 여기 없다.** reference.py 가 그것이고, 복사본을 만들지 않는다
# (ADR-0012). 두 곳에 적으면 한쪽만 고쳐진 날 사용자가 틀린 풀이를 본다.
#
# 사다리는 위로 갈수록 더 준다. 아래 단계가 위 단계보다 많이 알려 주면 순서가
# 의미를 잃고, 그때 힌트 의존도(Addendum 74)는 아무것도 재지 못한다.
hints:
  - level: 1
    text: "\"도달할 수 있는 칸\" 이라는 표현을 보세요. 전체 1 의 개수가 아니라 (0,0) 에서 이어진 것만 셉니다."
  - level: 2
    text: "격자 BFS 입니다. 시작점에서 퍼져 나가며 닿은 칸을 세면 됩니다."
  - level: 3
    text: "deque 큐와 visited 이차원 배열을 두세요. 방향은 dr = [-1,1,0,0], dc = [0,0,-1,1] 로 묶습니다."
  - level: 4
    text: "큐에서 칸을 꺼내 네 이웃을 봅니다. 격자 안이고, 값이 1 이고, 아직 방문하지 않았으면 **넣는 시점에** 방문 표시하고 큐에 넣습니다."
  - level: 5
    text: "시작 칸이 0 이면 0 을 출력하고 끝낸다 / visited[0][0]=True, 큐에 (0,0) / 큐가 빌 때까지: 꺼내서 count 를 1 늘리고 네 이웃 중 조건을 만족하는 것을 표시하며 넣는다 / count 를 출력한다"
