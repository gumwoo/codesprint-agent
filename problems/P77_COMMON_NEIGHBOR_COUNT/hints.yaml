# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "질의마다 u 의 이웃이 누구인지, v 의 이웃이 누구인지 알아야 한다. 질의가 만 개이고 간선이 이십만 개라, 질의마다 간선 전체를 훑으면 20억 번을 본다."
  - level: 2
    text: "그래프를 입력받을 때 한 번만 정리해 두고, 질의에서는 정리해 둔 것을 꺼내 쓴다. 정점마다 이웃을 모아 두는 인접 리스트가 그 정리다."
  - level: 3
    text: "정점 번호가 1 부터 N 까지라 N + 1 칸짜리 목록을 만든다. 각 칸에 이웃을 담되, 어떤 정점이 이웃인지 바로 확인할 수 있게 집합(set)으로 담는다."
  - level: 4
    text: "무방향 간선 a b 는 a 의 이웃에 b 를, b 의 이웃에 a 를 넣는다. 공통 이웃의 수는 두 집합의 교집합 크기다. 작은 쪽 집합을 훑으며 큰 쪽에 있는지 확인하면 된다."
  - level: 5
    text: "adj = N + 1 개의 빈 집합. 간선마다 adj[a] 에 b, adj[b] 에 a 를 넣는다. 질의 u v 마다 len(adj[u] & adj[v]) 를 답 목록에 넣고, 끝나면 줄마다 출력한다."
