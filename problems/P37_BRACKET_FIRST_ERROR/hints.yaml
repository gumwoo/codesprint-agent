# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "닫는 괄호가 맞는지는 그보다 앞에 있으면서 아직 닫히지 않은 여는 괄호 중 가장 최근 것 하나만 보면 판단할 수 있다."
  - level: 2
    text: "문자열을 왼쪽부터 한 번 훑으면서 나중에 연 것을 먼저 닫는 후입선출 처리를 한다."
  - level: 3
    text: "아직 닫히지 않은 여는 괄호들을 연 순서대로 쌓아 두는 스택 하나를 상태로 둔다."
  - level: 4
    text: "여는 괄호는 쌓는다. 닫는 괄호는 스택이 비었거나 맨 위가 다른 종류이면 그 위치가 답이고, 같은 종류이면 맨 위를 꺼낸다. 끝까지 읽은 뒤 스택이 남아 있으면 답은 N 이다."
  - level: 5
    text: "스택을 비운다\n각 위치 i 와 문자 c 에 대해:\n  c 가 여는 괄호면 스택에 넣는다\n  아니면 스택이 비었거나 맨 위가 c 의 짝이 아니면 i 를 출력하고 끝낸다\n  아니면 맨 위를 꺼낸다\n스택이 비었으면 -1, 아니면 N 을 출력한다"
