# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# **H6(전체 풀이)는 여기 없다.** reference.py 가 그것이고, 복사본을 만들지 않는다
# (ADR-0012). 두 곳에 적으면 한쪽만 고쳐진 날 사용자가 틀린 풀이를 본다.
#
# 사다리는 위로 갈수록 더 준다. 아래 단계가 위 단계보다 많이 알려 주면 순서가
# 의미를 잃고, 그때 힌트 의존도(Addendum 74)는 아무것도 재지 못한다.
hints:
  - level: 1
    text: "시작점이 **여럿**이고 동시에 퍼집니다. 하나씩 따로 퍼뜨려 합치면 답이 달라집니다."
  - level: 2
    text: "다중 시작점 BFS 입니다. 시작점을 전부 큐에 먼저 넣고 한 번만 돌립니다."
  - level: 3
    text: "거리(=단계 수)를 담는 이차원 배열을 두세요. 벽 -1 은 큐에 넣지도, 세지도 않습니다."
  - level: 4
    text: "모든 1 을 거리 0 으로 두고 큐에 넣은 뒤 퍼뜨립니다. 답은 채워진 거리들의 **최댓값**이고, 끝까지 0 으로 남은 칸이 있으면 -1 입니다."
  - level: 5
    text: "처음부터 0 이 없으면 0 을 출력하고 끝낸다 / 모든 1 의 거리를 0 으로 두고 전부 큐에 넣는다 / BFS 로 0 인 칸을 거리 +1 로 채우며 퍼뜨린다 / 남은 0 이 있으면 -1, 없으면 채운 거리의 최댓값을 출력한다"
