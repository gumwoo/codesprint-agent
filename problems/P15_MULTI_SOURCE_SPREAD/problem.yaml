# 정본 형식: contracts/problem.schema.json
# Skill / Mistake 참조는 curriculum/ 에 실재해야 하며 CI 가 검증한다.

code: P15_MULTI_SOURCE_SPREAD
title: 여러 곳에서 퍼져나가는 데 걸리는 시간
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 600
referenceComplexity: "O(N*M)"

statement: |
  첫 줄에 격자의 크기 N M 이 주어진다.
  이어지는 N 개의 줄에 격자가 주어진다. 1 은 시작점, 0 은 아직 닿지 않은 칸, -1 은 벽이다.

  매 단계마다 1 인 칸의 상하좌우에 있는 0 이 1 로 바뀐다.
  모든 0 이 1 이 되는 데 걸리는 단계 수를 출력한다.
  처음부터 0 이 없으면 0 을, 끝내 채워지지 않는 칸이 있으면 -1 을 출력한다.

  시작점이 여럿이면 동시에 퍼진다. **어느 칸을 이미 봤는지**를 큐에 넣는 시점에
  기록하지 않으면 같은 칸이 여러 번 들어가 단계 수가 어긋난다.

skills:
  - code: BFS_VISITED_MANAGEMENT
    role: PRIMARY
    weight: 0.6
  - code: BFS_BASIC
    role: SECONDARY
    weight: 0.2
  - code: GRID_BOUNDARY_CHECK
    role: SECONDARY
    weight: 0.2

commonMistakes:
  - VISITED_TIMING
  - NO_VISITED
  - BOUNDARY_CHECK
  - IMPLEMENTATION_MISC

# 벽을 세지 않아, 채워지지 않은 칸이 있는데도 다 됐다고 본다.
negativeControl:
  mistake: IMPLEMENTATION_MISC
  expectedStatus: WRONG_ANSWER
