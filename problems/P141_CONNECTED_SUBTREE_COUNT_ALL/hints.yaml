# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "한 정점을 루트로 정하면, 루트를 포함하는 연결 부분집합은 각 자식 서브트리에서 '아무것도 고르지 않거나, 그 자식을 포함하는 연결 부분집합 하나를 고르는' 선택의 조합으로 나뉜다. 정점마다 루트를 새로 잡아 이 계산을 반복하면 N이 클 때 끝나지 않는다."
  - level: 2
    text: "트리 DP를 한 번 아래 방향으로 계산한 뒤, 그 결과를 재사용해 루트를 이웃 정점으로 옮기는 전이를 위에서 아래로 한 번 더 계산하는 두 번의 순회(rerooting)로 푼다."
  - level: 3
    text: "정점마다 두 값을 둔다. 아래쪽 값: 고정 루트 기준으로 자기 서브트리 안에서 자신을 포함하는 연결 부분집합 수. 위쪽 값: 자기 서브트리를 뺀 나머지 트리에서 부모를 포함하는 연결 부분집합 수. 모듈러가 소수라도 곱이 0이 될 수 있으므로 나눗셈 대신 자식 목록의 접두 곱과 접미 곱을 쓴다."
  - level: 4
    text: "아래쪽 값은 자식마다 (자식의 아래쪽 값 + 1)을 곱한 것이다. 자식 c의 위쪽 값은 (부모 v의 위쪽 값 + 1)에 v의 다른 자식들의 (아래쪽 값 + 1)을 모두 곱한 것이다. 루트의 위쪽 값은 0으로 둔다. 정점 v의 답은 아래쪽 값 × (위쪽 값 + 1)이다."
  - level: 5
    text: "1) 정점 1에서 반복 DFS로 방문 순서와 부모를 구한다. 2) 방문 순서의 역순으로 아래쪽 값을 채운다. 3) 방문 순서대로 각 정점의 자식 목록에 대해 접두 곱 배열을 만들고, 뒤에서부터 접미 곱을 누적하며 각 자식의 위쪽 값을 (자기 위쪽 값 + 1) × 접두 곱 × 접미 곱으로 채운다. 4) 모든 정점에 대해 아래쪽 값 × (위쪽 값 + 1)을 모듈러로 출력한다. 재귀 대신 스택을 써서 깊은 트리에서도 멈추지 않게 한다."
