# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P74_KEYS_AND_DOORS
title: 열쇠를 모아 문 열기
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 1500
referenceComplexity: O(N * M * 2^6)
statement: |
  N행 M열 격자가 주어진다. 행과 열 번호는 0부터 센다. 각 칸은 다음 문자 중 하나다.
  '.' 빈 칸, '#' 벽, 'S' 출발 칸, 'T' 도착 칸, 'a'~'f' 열쇠, 'A'~'F' 문.
  'S'와 'T'는 각각 정확히 하나 있다.

  한 번의 이동으로 상하좌우로 인접한 칸 하나로 옮긴다. 격자 밖과 벽 칸으로는 이동할 수 없다.
  열쇠 칸에 들어가면 그 종류의 열쇠를 얻는다. 얻은 열쇠는 사라지지 않고, 같은 종류의 열쇠 칸이 여러 개 있을 수 있다.
  문 칸은 대응하는 소문자 열쇠를 이미 가지고 있을 때만 들어갈 수 있다('A'는 'a', 'B'는 'b', ...). 문은 열어도 그대로 남는다.
  같은 칸을 여러 번 지나가도 된다. 처음에는 열쇠가 없다.

  'S'에서 'T'까지 가는 최소 이동 횟수를 구한다.

  입력
  첫 줄에 N M (1 <= N, M <= 50, N*M >= 2).
  다음 N줄에 길이 M의 문자열이 하나씩 주어진다.

  출력
  최소 이동 횟수를 한 줄에 출력한다. 도착할 수 없으면 -1을 출력한다.
