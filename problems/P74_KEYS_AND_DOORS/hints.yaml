# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "열쇠를 얻은 뒤에는 이미 지나온 칸으로 되돌아가야 할 수 있다. 같은 칸이라도 가진 열쇠가 다르면 다른 상황이다."
  - level: 2
    text: "간선 가중치가 모두 1인 그래프의 최단 거리 문제다. 정점을 칸이 아니라 (칸, 가진 열쇠 집합)으로 잡고 너비 우선 탐색을 한다."
  - level: 3
    text: "열쇠 종류가 6개뿐이므로 가진 열쇠 집합을 6비트 정수로 나타낸다. 거리 배열은 행 x 열 x 64 크기의 3차원으로 두고, 큐에는 (행, 열, 비트마스크)를 넣는다."
  - level: 4
    text: "이웃 칸이 벽이면 막히고, 문이면 대응 비트가 켜져 있을 때만 들어간다. 열쇠 칸에 들어가면 그 비트를 켠 새 마스크가 다음 상태의 마스크가 된다. 방문 판정은 (이웃 칸, 새 마스크) 기준이다."
  - level: 5
    text: "시작 상태 (S, 0)의 거리를 0으로 두고 큐에 넣는다. 큐에서 상태를 꺼내 칸이 T면 거리를 출력하고 끝낸다. 아니면 네 방향마다 경계 · 벽 · 문 조건을 검사하고 새 마스크를 구해, 그 상태가 처음이면 거리+1을 기록하고 큐에 넣는다. 큐가 비면 -1을 출력한다."
