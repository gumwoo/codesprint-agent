# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# **H6(전체 풀이)는 여기 없다.** reference.py 가 그것이고, 복사본을 만들지 않는다
# (ADR-0012). 두 곳에 적으면 한쪽만 고쳐진 날 사용자가 틀린 풀이를 본다.
#
# 사다리는 위로 갈수록 더 준다. 아래 단계가 위 단계보다 많이 알려 주면 순서가
# 의미를 잃고, 그때 힌트 의존도(Addendum 74)는 아무것도 재지 못한다.
hints:
  - level: 1
    text: "P05 와 문장이 거의 같습니다. 딱 한 줄, 이동할 수 있는 방향이 다릅니다."
  - level: 2
    text: "같은 BFS 입니다. 알고리즘을 바꾸는 것이 아니라 방향 목록을 바꾸는 문제입니다."
  - level: 3
    text: "방향을 네 개가 아니라 여덟 개로 둡니다. dr, dc 가 각각 -1, 0, 1 인 조합에서 (0,0) 만 뺀 것입니다."
  - level: 4
    text: "나머지는 그대로입니다. 거리 채우기도, 시작 칸을 1 로 두는 것도, 도달 실패 시 -1 도 P05 와 같습니다."
  - level: 5
    text: "DIRS = 8 방향 / dist[0][0]=1, 큐에 (0,0) / 꺼낸 칸이 (N-1, M-1) 이면 거리를 출력하고 끝낸다 / 여덟 이웃 중 격자 안이고 1 이고 미방문이면 거리를 +1 로 채우고 넣는다 / 못 닿으면 -1"
