# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "회전 명령은 위치를 바꾸지 않고, F 명령만 위치를 바꾼다. F 가 무시되는 경우가 두 가지 있다."
  - level: 2
    text: "명령을 앞에서부터 하나씩 적용하며 상태를 갱신하는 시뮬레이션이다. 명령마다 한 번의 상수 시간 갱신이면 충분하다."
  - level: 3
    text: "상태는 (행, 열, 방향) 세 값이다. 방향을 0~3 정수로 두고 방향별 행 변화량과 열 변화량을 배열로 준비하면 이동이 간단해진다."
  - level: 4
    text: "L 은 방향 번호를 1 줄이고 R 은 1 늘린다(4로 나눈 나머지). F 는 다음 칸을 계산한 뒤, 그 칸이 격자 안이고 벽이 아닐 때만 현재 위치를 그 칸으로 바꾼다. 격자 안인지 먼저 확인해야 격자를 읽을 수 있다."
  - level: 5
    text: "방향 순서를 N, E, S, W 로 정하고 변화량 배열을 만든다\n각 명령 ch 에 대해:\n  ch 가 L 이면 방향을 왼쪽으로 한 칸 돌린다\n  ch 가 R 이면 방향을 오른쪽으로 한 칸 돌린다\n  ch 가 F 이면 다음 칸을 구하고, 범위 안이며 빈 칸일 때만 이동한다\n마지막 행, 열, 방향 문자를 출력한다"
