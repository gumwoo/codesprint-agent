# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "1일차에 할 수 있는 작업은 선행 작업이 하나도 없는 작업뿐이다. 어떤 작업이 끝나면 그 작업을 기다리던 작업들의 남은 조건이 하나씩 줄어든다."
  - level: 2
    text: "선행 관계를 방향 그래프의 간선으로 보고, 들어오는 간선이 모두 처리된 정점부터 차례로 꺼내는 순서 정하기 문제다. 끝까지 꺼내지지 않는 정점은 사이클에 있거나 사이클 뒤에 걸려 있다."
  - level: 3
    text: "정점마다 아직 끝나지 않은 선행 작업의 수와 지금까지 알려진 가장 이른 날을 저장한다. 조건이 모두 풀린 정점을 담아 둘 큐가 필요하다. 결과는 처리되지 않은 상태를 뜻하는 값으로 초기화해 둔다."
  - level: 4
    text: "정점 u 를 꺼내면 u 의 날이 확정된다. u 에서 나가는 간선 u->w 마다 w 의 날 후보를 (u 의 날 + 1) 과 비교해 큰 값으로 갱신하고, w 의 남은 선행 수를 1 줄인다. 0 이 되면 w 를 큐에 넣는다."
  - level: 5
    text: "선행 수 0 인 정점을 모두 큐에 넣고 후보 날을 1 로 둔다\n큐가 빌 때까지: u 를 꺼내 결과[u] = 후보[u]\n  u 의 각 후속 w: 후보[w] = max(후보[w], 후보[u] + 1), 선행 수[w] 감소, 0 이면 큐에 추가\n한 번도 꺼내지지 않은 정점의 결과는 -1 로 남긴다"
