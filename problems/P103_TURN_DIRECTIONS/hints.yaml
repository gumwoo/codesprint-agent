# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "각 판정에는 연속한 세 점만 필요하다. 앞의 두 점이 만드는 진행 방향에 대해 세 번째 점이 어느 쪽에 있는지만 알면 된다."
  - level: 2
    text: "기울기나 각도를 실수로 비교하지 않고, 두 벡터로 만든 값의 부호 하나로 왼쪽 · 오른쪽 · 일직선을 가르는 기하 판정 문제다."
  - level: 3
    text: "각 i 에 대해 P_{i-1}→P_i 벡터와 P_{i-1}→P_{i+1} 벡터 두 개만 있으면 된다. 좌표가 10^9 까지라 곱이 커지지만 Python 정수는 정확하므로 실수로 바꾸지 않는다."
  - level: 4
    text: "두 벡터 (u1, u2), (v1, v2) 의 외적 u1·v2 - u2·v1 을 구한다. 양수면 왼쪽, 음수면 오른쪽, 0 이면 일직선이다. 되돌아가는 경우도 0 이 된다는 점에 주의한다."
  - level: 5
    text: "점 목록을 읽는다 → i = 1..N-2 마다 앞 점에서 현재 점, 앞 점에서 다음 점으로 가는 두 벡터를 만든다 → 외적의 부호로 L / R / S 중 하나를 고른다 → 결과 문자들을 이어 붙여 한 줄로 출력한다."
