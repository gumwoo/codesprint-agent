# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "조회는 최대 100000번이다. 조회마다 등록 번호 전체를 확인하면 N x Q 번 비교하게 된다."
  - level: 2
    text: "값이 있는지만 알면 되는 존재 확인 문제다. 위치나 개수는 필요 없다."
  - level: 3
    text: "등록 번호를 해시 기반 집합에 한 번 담아 두면 조회 한 번을 평균 상수 시간에 답할 수 있다. 중복은 집합에서 자연히 합쳐진다."
  - level: 4
    text: "입력을 읽는 단계에서 집합을 만들고, 조회 단계에서는 각 번호의 소속 여부만 확인해 1 또는 0으로 바꾼다."
  - level: 5
    text: "N을 읽는다 -> 다음 N개로 집합 S를 만든다 -> Q를 읽는다 -> 조회 번호 x마다 x가 S에 있으면 1, 없으면 0을 결과 목록에 넣는다 -> 결과를 줄마다 출력한다."
