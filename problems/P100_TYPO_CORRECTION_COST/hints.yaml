# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "S 의 앞 i 글자를 T 의 앞 j 글자로 바꾸는 최소 횟수를 안다면, 한 글자씩 늘린 경우의 답도 마지막 글자만 보고 정할 수 있다."
  - level: 2
    text: "같은 앞부분 쌍이 여러 경로에서 반복해서 나오므로, 작은 문제의 답을 저장해 두고 재사용하는 동적 계획법 문제다."
  - level: 3
    text: "(|S|+1) x (|T|+1) 크기의 표를 쓰고, 칸 (i, j) 에 S 의 앞 i 글자와 T 의 앞 j 글자 사이의 최소 편집 횟수를 둔다. 한쪽이 빈 문자열인 줄은 남은 글자 수만큼이 답이다."
  - level: 4
    text: "칸 (i, j) 는 왼쪽 위 · 위 · 왼쪽 세 칸에서 온다. S 의 i 번째 글자와 T 의 j 번째 글자가 같으면 왼쪽 위 값을 그대로 쓰고, 다르면 세 칸 중 가장 작은 값에 1 을 더한다. 각각 교체 · 삭제 · 삽입에 해당한다."
  - level: 5
    text: "표의 첫 행을 0..|T|, 첫 열을 0..|S| 로 채운다 → i 를 1..|S|, j 를 1..|T| 순서로 돌며 위의 규칙으로 칸을 채운다 → 오른쪽 아래 칸을 출력한다. 바로 윗줄만 필요하므로 두 줄만 들고 다녀도 된다."
