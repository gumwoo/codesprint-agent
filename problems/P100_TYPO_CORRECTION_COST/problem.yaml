# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P100_TYPO_CORRECTION_COST
title: 오타 교정 비용
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 1200
referenceComplexity: O(|S|·|T|) 시간, O(|T|) 메모리
statement: |
  입력한 단어 S 를 의도한 단어 T 로 고치려 한다. 한 번의 편집으로 다음 셋 중 하나를 할 수 있다.

  - 삽입: S 의 아무 위치에 문자 하나를 넣는다.
  - 삭제: S 에서 문자 하나를 지운다.
  - 교체: S 의 문자 하나를 다른 문자로 바꾼다.

  S 를 T 와 똑같이 만드는 데 필요한 편집의 최소 횟수를 구한다.

  예: S = "kitten", T = "sitting" 이면 k 를 s 로 교체, 끝에서 두 번째 e 를 i 로 교체, 끝에 g 삽입으로 3 번이면 되고, 2 번으로는 만들 수 없다.

  입력
  첫째 줄에 S, 둘째 줄에 T 가 주어진다. 두 문자열은 영어 소문자로만 이루어지며 길이는 각각 1 이상 1000 이하다.

  출력
  필요한 편집의 최소 횟수를 정수 하나로 출력한다.

  문자 위치를 입력이나 출력으로 다루지 않으므로 인덱스 기준은 답에 영향을 주지 않는다. 설명에서 위치는 0 부터 센다.
skills:
- code: EDIT_DISTANCE
  role: PRIMARY
  weight: 0.7
- code: STRING_MANIPULATION
  role: SECONDARY
  weight: 0.3
commonMistakes:
- IMPLEMENTATION_MISC
- INDEX_ERROR
- INPUT_PARSE
negativeControl:
  mistake: IMPLEMENTATION_MISC
  expectedStatus: WRONG_ANSWER
skillControl:
  approach: 표에 저장하지 않고 글자가 다를 때마다 교체 · 삭제 · 삽입 세 갈래로 다시 재귀한다.
