# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "시각 T 에 M 개를 만들 수 있다면 T 보다 늦은 어떤 시각에도 M 개를 만들 수 있다. 가능 여부가 시각에 대해 단조롭다."
  - level: 2
    text: "최솟값을 직접 구하지 말고 '시각 T 까지 M 개 이상 만들 수 있는가' 라는 예/아니오 문제로 바꾼 뒤, 그 답이 바뀌는 경계를 이분 탐색으로 찾는다."
  - level: 3
    text: "필요한 상태는 탐색 구간의 하한과 상한뿐이다. 하한은 1, 상한은 가장 빠른 기계 한 대가 M 개를 모두 만드는 시각으로 잡으면 답이 반드시 구간 안에 있다."
  - level: 4
    text: "중간 시각 T 에서 각 기계가 만든 개수(T 를 t_i 로 나눈 몫)를 모두 더한다. 합이 M 이상이면 답은 T 이하이므로 상한을 T 로 줄이고, 아니면 하한을 T+1 로 올린다."
  - level: 5
    text: "lo = 1, hi = (가장 작은 t) * M\n하한 < 상한 인 동안:\n    T = 두 값의 중간\n    cnt = 모든 기계에 대해 T // t_i 의 합\n    cnt >= M 이면 상한 = T, 아니면 하한 = T + 1\n하한을 출력"
