# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P72_MACHINE_PRODUCTION_TIME
title: 기계 생산 시간
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 900
referenceComplexity: O(N log(min(t_i) * M))
statement: |
  N 대의 기계가 있다. 기계에는 1 번부터 N 번까지 번호가 붙어 있고, i 번 기계는 물건 하나를 만드는 데 정확히 t_i 초가 걸린다. 모든 기계는 시각 0 에 동시에 작업을 시작하고, 물건을 하나 완성하면 쉬지 않고 바로 다음 물건을 만든다. 각 기계는 한 번에 물건 하나만 만든다. 모든 기계가 만든 물건의 개수 합이 M 개 이상이 되는 가장 이른 시각(초)을 구하라. 시각 T 까지 i 번 기계가 완성한 물건의 개수는 T 를 t_i 로 나눈 몫이다.

  입력 형식
  첫째 줄에 정수 N, M 이 공백으로 구분되어 주어진다. (1 <= N <= 10000, 1 <= M <= 1000000000)
  둘째 줄에 정수 t_1, t_2, ..., t_N 이 공백으로 구분되어 주어진다. (1 <= t_i <= 1000000000)

  출력 형식
  물건 M 개 이상이 완성되는 가장 이른 시각을 정수 하나로 출력한다.

  인덱스 기준
  기계 번호는 1 부터 센다. 답은 기계 번호와 무관하다.
skills:
- code: PARAMETRIC_SEARCH
  role: PRIMARY
  weight: 1.0
commonMistakes:
- IMPLEMENTATION_MISC
- INPUT_PARSE
negativeControl:
  mistake: IMPLEMENTATION_MISC
  expectedStatus: WRONG_ANSWER
skillControl:
  approach: 시각을 1 부터 1 씩 늘리며 그 시각까지 만든 개수의 합이 M 이상이 되는 첫 시각을 찾는다.
