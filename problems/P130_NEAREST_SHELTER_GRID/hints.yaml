# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "대피소가 수백 개일 수 있다. 대피소마다 따로 거리를 재면 격자 전체를 대피소 수만큼 다시 훑게 된다. 각 칸이 알고 싶은 것은 어느 대피소인지가 아니라 가장 가까운 것까지의 거리뿐이다."
  - level: 2
    text: "가중치 없는 격자 최단 거리 탐색을 한 번만 수행하되, 모든 대피소를 동시에 출발점으로 삼는다. 거리 0 인 칸들이 한꺼번에 퍼져 나간다고 생각한다."
  - level: 3
    text: "N×M 거리 배열 하나를 -1 로 채워 방문 표시를 겸하게 하고, 선입선출 큐 하나를 쓴다. 탐색을 시작하기 전에 모든 대피소 좌표를 거리 0 으로 기록하고 큐에 넣어 둔다."
  - level: 4
    text: "큐에서 칸을 꺼내면 네 방향 이웃 중 격자 안이고 벽이 아니며 아직 거리가 기록되지 않은 칸에 (꺼낸 칸의 거리 + 1) 을 기록하고 큐에 넣는다. 처음 기록된 값이 곧 가장 가까운 대피소까지의 거리이므로 다시 고치지 않는다."
  - level: 5
    text: "dist 를 전부 -1 로 둔다 → 모든 S 칸을 dist 0 으로 두고 큐에 넣는다 → 큐가 빌 때까지: 칸 하나를 꺼내고, 네 이웃마다 (범위 안, 벽 아님, dist 미기록) 이면 dist 를 기록하고 큐에 넣는다 → dist 를 행 단위로 출력한다(벽과 도달 불가 칸은 -1 그대로)."
