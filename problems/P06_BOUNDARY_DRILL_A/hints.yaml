# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# **H6(전체 풀이)는 여기 없다.** reference.py 가 그것이고, 복사본을 만들지 않는다
# (ADR-0012). 두 곳에 적으면 한쪽만 고쳐진 날 사용자가 틀린 풀이를 본다.
#
# 사다리는 위로 갈수록 더 준다. 아래 단계가 위 단계보다 많이 알려 주면 순서가
# 의미를 잃고, 그때 힌트 의존도(Addendum 74)는 아무것도 재지 못한다.
hints:
  - level: 1
    text: "\"격자 밖으로 나가는 이동은 무시한다\" 가 핵심입니다. 나가면 멈추는 것도, 튕기는 것도 아닙니다."
  - level: 2
    text: "탐색이 아닙니다. 이동을 순서대로 흉내 내면서 매번 경계만 확인하면 됩니다."
  - level: 3
    text: "현재 위치 (r, c) 두 변수와 방향 문자 -> (dr, dc) 매핑 하나면 충분합니다."
  - level: 4
    text: "다음 위치를 먼저 계산하고, 0 <= nr < N 과 0 <= nc < M 을 **둘 다** 만족할 때만 실제로 옮깁니다. 아니면 그 이동은 버립니다."
  - level: 5
    text: "MOVES = {'U':(-1,0), 'D':(1,0), 'L':(0,-1), 'R':(0,1)} / 각 방향에 대해: nr, nc 를 구하고 격자 안이면 r, c 를 갱신한다 / 마지막에 r 과 c 를 공백으로 출력한다"
