# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "최소 비용으로 고른 도로에는 순환이 생기지 않는다. 순환이 있으면 그 안에서 가장 비싼 도로를 빼도 모든 도시는 여전히 이어져 있다."
  - level: 2
    text: "최소 신장 트리 문제다. 싼 도로부터 순서대로 보며 고르거나(크루스칼), 이미 이어진 도시 무리에서 가장 싸게 닿는 도시를 하나씩 붙여 나간다(프림)."
  - level: 3
    text: "도로 하나를 볼 때마다 양 끝 도시가 이미 같은 무리인지 빠르게 알아야 한다. 각 도시가 속한 무리의 대표를 기록하는 서로소 집합(유니온 파인드)을 두고, 대표를 찾을 때 거쳐 간 경로를 줄여 둔다."
  - level: 4
    text: "비용 오름차순으로 도로를 보며 양 끝의 대표가 다르면 두 무리를 하나로 합치고 비용을 더한다. 대표가 같으면(자기 자신으로 가는 도로 포함) 순환이 생기므로 건너뛴다. 끝까지 본 뒤 고른 도로가 N-1 개가 아니면 연결이 불가능하다."
  - level: 5
    text: "후보를 (비용, u, v) 로 모아 비용 순으로 정렬\n모든 도시의 대표를 자기 자신으로 초기화\n합 = 0, 개수 = 0\n각 후보에 대해:\n    u 의 대표와 v 의 대표를 찾는다\n    서로 다르면: 한쪽 대표를 다른 쪽에 붙이고, 합에 비용을 더하고, 개수를 1 늘린다\n개수가 N-1 이면 합, 아니면 -1 출력"
