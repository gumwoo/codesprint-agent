code: P147_FIRE_ESCAPE_DELAY
title: 불길 속 늦은 출발
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 1500
referenceComplexity: O(N·M·log(N·M))
statement: |
  N행 M열 건물 평면도가 주어진다. 행과 열은 0부터 센다. 각 칸은 다음 중 하나다.
  - '.' : 빈 칸
  - '#' : 벽
  - 'S' : 사람이 있는 칸 (정확히 하나)
  - 'E' : 출구 (정확히 하나)
  - 'F' : 0분에 불이 붙어 있는 칸 (하나 이상)

  불: 0분에는 'F' 칸만 타고 있다. 매 분이 지날 때마다, 타고 있는 칸과 상하좌우로 인접한 벽이 아닌 칸에 모두 불이 옮겨 붙는다. 한번 붙은 불은 꺼지지 않는다. 'S' 칸과 'E' 칸에도 불이 붙을 수 있다.

  사람: 0분부터 W분까지 'S' 칸에서 기다린 뒤 출발한다. 출발한 뒤에는 1분마다 상하좌우로 인접한 벽이 아닌 칸 하나로 옮기거나 그 자리에 머문다. 격자 밖으로는 나갈 수 없다. 어떤 시각 t분에 사람이 있는 칸에 t분 시점에 불이 붙어 있으면 안 된다. 기다리는 동안(0분부터 W분까지)도 마찬가지다. 사람이 불이 붙지 않은 'E' 칸에 도착하면 그 즉시 탈출한다.

  예: 1행 5열 평면도 'S..EF' 에서 'E' 칸은 1분에 불이 붙는다. 사람은 W = 0 이어도 3분에야 'E' 에 닿으므로 탈출할 수 없다.

  탈출할 수 있는 가장 큰 정수 W (W >= 0) 를 구하라.

  입력 형식
  첫 줄에 N M 이 공백으로 구분되어 주어진다. 다음 N 줄에 길이 M 인 문자열이 한 줄씩 주어진다.

  출력 형식
  가장 큰 W 를 한 줄에 출력한다. W = 0 으로도 탈출할 수 없으면 -1 을 출력한다. W 를 아무리 크게 잡아도 탈출할 수 있으면 INF 를 출력한다.

  제약
  - 1 <= N, M <= 150
  - N × M >= 3
  - 각 줄은 '.', '#', 'S', 'E', 'F' 로만 이루어진다.
  - 'S' 와 'E' 는 정확히 하나씩, 'F' 는 하나 이상 있다.
