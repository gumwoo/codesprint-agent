# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "불이 각 칸에 처음 붙는 시각은 사람이 언제 출발하든 바뀌지 않는다. 그리고 W 로 탈출할 수 있으면 W 보다 작은 값으로도 반드시 탈출할 수 있다."
  - level: 2
    text: "두 단계로 나눈다. 여러 출발점에서 동시에 퍼지는 너비 우선 탐색으로 불 도착 시각을 구하고, '이 W 로 탈출 가능한가' 라는 예/아니오 판정 위에서 답을 이분 탐색한다."
  - level: 3
    text: "칸마다 불이 처음 붙는 시각을 담는 2차원 배열 하나(닿지 않으면 무한대)와, 판정마다 새로 만드는 방문 배열 및 (행, 열, 도착 시각) 을 담는 큐를 쓴다."
  - level: 4
    text: "W 를 정하면 사람은 W분에 S 에서 출발한다. 시각 t 에 있는 칸에서 이웃 칸으로 옮길 때 t + 1 이 그 칸의 불 도착 시각보다 작아야만 들어갈 수 있다. 머무는 것은 도움이 되지 않으므로 가장 빨리 도착하는 경로만 보면 된다. 불은 N×M 분 안에 퍼질 곳을 모두 태우므로 W = N×M 에서 탈출할 수 있으면 답은 INF 다."
  - level: 5
    text: "불시각 = 모든 F 에서 동시에 BFS\n판정(W): W >= 불시각[S] 이면 거짓. S 에서 시각 W 로 BFS, 이웃의 (현재 시각 + 1) < 불시각[이웃] 일 때만 방문, E 에 닿으면 참\n판정(N×M) 참이면 INF 출력, 판정(0) 거짓이면 -1 출력\n아니면 lo = 0 (참), hi = N×M (거짓) 으로 두고 가운데 값을 판정하며 구간을 줄여 lo 출력"
