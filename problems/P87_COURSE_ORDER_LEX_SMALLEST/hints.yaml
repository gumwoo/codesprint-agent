# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "첫 학기에 들을 수 있는 과목은 먼저 들어야 하는 과목이 하나도 없는 과목뿐이다. 한 과목을 듣고 나면 어떤 과목들의 조건이 풀리는지 생각해 본다."
  - level: 2
    text: "선행 관계를 방향 그래프로 보고, 들어오는 간선이 없는 정점부터 하나씩 꺼내 순서를 정하는 방식으로 푼다. 사전순으로 가장 앞서려면 매번 꺼낼 수 있는 후보 중 가장 작은 번호를 고른다."
  - level: 3
    text: "각 과목의 남은 선수 과목 수와 인접 리스트를 두고, 지금 들을 수 있는 과목들을 가장 작은 번호를 빠르게 꺼낼 수 있는 우선순위 큐에 담는다."
  - level: 4
    text: "과목 하나를 꺼내 순서에 붙이면, 그 과목 뒤에 와야 하는 과목들의 남은 선수 과목 수를 1씩 줄이고 0이 된 과목을 후보에 넣는다. 후보가 바닥났을 때 순서에 N개가 모두 들어가지 않았다면 순환이 있는 것이다."
  - level: 5
    text: "남은수[] 계산 -> 남은수 0인 과목을 최소 힙에 넣음 -> 힙이 빌 때까지: 최소 번호 꺼내 결과에 추가, 뒤따르는 과목의 남은수 감소, 0이 되면 힙에 넣음 -> 결과 길이가 N이면 결과 출력, 아니면 -1 출력"
