# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P134_SANDBAG_MERGE_BALANCE
title: 모래주머니 합치기
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 1500
referenceComplexity: O(N^3) 시간, O(N^2) 공간
statement: |
  모래주머니 N개가 일렬로 놓여 있다. 왼쪽에서 i번째(1부터 센다) 주머니의 무게는 w_i 이다.

  인접한 두 덩어리를 골라 하나로 합치는 작업을 덩어리가 하나 남을 때까지 반복한다. 처음에는 주머니 하나가 덩어리 하나다. 합쳐진 덩어리의 무게는 두 덩어리 무게의 합이고, 합친 뒤에도 덩어리들의 좌우 순서는 유지된다. 무게가 A 인 덩어리와 B 인 덩어리를 합치는 비용은 두 무게의 차이(큰 쪽에서 작은 쪽을 뺀 값)이다.

  예를 들어 무게가 3, 1, 4 이면 (3,1) 을 먼저 합치면 비용 2 가 들고 덩어리는 4, 4 가 되며, 이 둘을 합치는 비용은 0 이라 전체 비용은 2 이다. (1,4) 를 먼저 합치면 비용 3 이 들고 덩어리는 3, 5 가 되며, 이 둘을 합치는 비용 2 까지 전체 비용은 5 이다.

  모든 주머니를 하나로 합칠 때 드는 전체 비용의 최솟값을 구하라.

  입력
  첫 줄에 정수 N 이 주어진다. (1 ≤ N ≤ 120)
  둘째 줄에 정수 w_1, w_2, ..., w_N 이 공백으로 구분되어 주어진다. (1 ≤ w_i ≤ 1000)

  출력
  전체 비용의 최솟값을 한 줄에 출력한다. N = 1 이면 합칠 것이 없으므로 0 을 출력한다.
skills:
- code: INTERVAL_DP
  role: PRIMARY
  weight: 1.0
commonMistakes:
- INDEX_ERROR
- INPUT_PARSE
negativeControl:
  mistake: INDEX_ERROR
  expectedStatus: WRONG_ANSWER
skillControl:
  approach: 현재 덩어리 배열을 상태로 삼아 인접한 두 덩어리를 합치는 모든 순서를 재귀로 탐색하고, 같은 배열 상태는 메모이제이션한다.
