# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "마지막으로 일어나는 합치기를 떠올려 보자. 그 직전에는 왼쪽 덩어리와 오른쪽 덩어리 두 개만 남아 있고, 각각은 원래 주머니들의 연속된 한 구간이다."
  - level: 2
    text: "연속된 구간 하나를 하나로 합치는 최소 비용은 그보다 짧은 두 구간의 최소 비용으로 정해진다. 짧은 구간부터 채워 나가는 동적 계획법 문제다."
  - level: 3
    text: "왼쪽 끝 i 와 오른쪽 끝 j 로 정해지는 구간마다 그 구간을 한 덩어리로 만드는 최소 비용을 2차원 표에 저장한다. 구간 무게 합은 누적합으로 바로 구할 수 있다."
  - level: 4
    text: "구간 [i, j] 를 두 조각 [i, k] 와 [k+1, j] 로 나누는 모든 k 에 대해, 두 조각의 최소 비용과 두 조각 무게 차이를 더한 값 중 가장 작은 것이 [i, j] 의 값이다. 길이 1 구간의 값은 0 이다."
  - level: 5
    text: "누적합 준비 -> 모든 길이 1 구간에 0 기록 -> 길이 2 부터 N 까지 늘리며 각 시작점 i 에 대해 끝점 j 를 정하고, i 이상 j 미만의 모든 분할 위치를 시도해 최솟값 기록 -> 전체 구간의 값 출력."
