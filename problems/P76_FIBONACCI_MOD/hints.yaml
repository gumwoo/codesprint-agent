# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "n 이 10^18 까지다. 0 부터 하나씩 올라가며 더하면 10^18 번을 돌아 끝나지 않는다. n 을 절반으로 줄이는 관계가 필요하다."
  - level: 2
    text: "분할 정복 문제다. F(n) 을 n 의 절반 근처 번호의 피보나치 수로 나타낼 수 있다."
  - level: 3
    text: "한 번에 두 값 (F(k), F(k+1)) 을 함께 구해 돌려주면 절반에서 전체로 올라갈 수 있다. 곱할 때마다 m 으로 나눈 나머지를 취해 수를 작게 유지한다."
  - level: 4
    text: "k 에서 2k 로: F(2k) = F(k) × (2F(k+1) − F(k)), F(2k+1) = F(k)² + F(k+1)². n 이 홀수면 2k+1 쪽에서 한 칸 더 간다."
  - level: 5
    text: "두 값을 돌려주는 함수 g(n): n 이 0 이면 (0, 1 mod m) / 아니면 g(n//2) 로 (a, b) 를 얻고 c 와 d 를 위 두 식으로 계산한다 / n 이 짝수면 (c, d), 홀수면 (d, c+d) 를 돌려준다 / g(n) 의 첫째 값을 출력한다"
