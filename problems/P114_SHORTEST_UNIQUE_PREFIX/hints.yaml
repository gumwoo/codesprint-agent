# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "한 단어의 앞부분을 한 글자씩 늘려 가면, 그 앞부분을 함께 가진 단어의 수는 늘지 않고 줄어들기만 한다. 그 수가 처음으로 1 이 되는 길이를 찾으면 된다."
  - level: 2
    text: "접두사가 같은 단어들을 한데 모아 두는 문자열 저장 구조를 쓰면, 모든 단어를 서로 비교하지 않고 접두사별 단어 수를 알 수 있다."
  - level: 3
    text: "글자 하나를 한 칸으로 하는 나무를 만든다. 각 칸에는 다음 글자로 가는 자식 목록과, 그 칸을 지나간 단어의 수를 둔다."
  - level: 4
    text: "단어를 넣을 때 지나가는 모든 칸의 단어 수를 1 씩 늘린다. 답을 구할 때는 같은 단어의 경로를 다시 내려가며, 단어 수가 1 인 칸을 처음 만난 깊이를 답으로 한다. 끝까지 내려가도 못 만나면 -1 이다."
  - level: 5
    text: "모든 단어 w 에 대해: 뿌리에서 시작해 w 의 글자를 따라 칸을 만들거나 이동하고, 지나는 칸의 수를 1 늘린다.\n모든 단어 w 에 대해: 답 = -1, 뿌리에서 시작해 d 번째 글자를 따라 이동할 때 그 칸의 수가 1 이면 답 = d 로 두고 멈춘다. 답을 출력한다."
