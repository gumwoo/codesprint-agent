# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "질의마다 구간 전체를 훑으면 한 번에 최대 N 번을 보게 된다. 최솟값은 합과 달리 빼서 되돌릴 수 없으므로 누적 배열로는 갱신과 질의를 함께 처리할 수 없다는 점을 확인한다."
  - level: 2
    text: "구간을 미리 여러 조각으로 나누어 각 조각의 최솟값을 저장해 두고, 질의는 몇 개의 조각을 합쳐서 답하는 방식을 생각한다. 조각을 절반씩 나누는 계층 구조를 쓰면 질의와 갱신 모두 로그 시간에 처리할 수 있다."
  - level: 3
    text: "각 노드가 자기 담당 구간의 최솟값을 저장하는 완전 이진 트리를 배열 하나로 표현한다. 잎은 수열의 각 값이고, 잎 개수는 N 이상인 2 의 거듭제곱으로 잡아 남는 잎은 매우 큰 값으로 채운다."
  - level: 4
    text: "값 하나를 바꾸면 그 잎에서 뿌리까지 올라가며 각 부모를 두 자식 중 작은 값으로 다시 계산한다. 구간 질의는 양 끝에서 출발해 한 층씩 올라가며, 구간에 완전히 포함되는 노드만 답에 반영한다."
  - level: 5
    text: "build: 잎에 값을 넣고 안쪽 노드를 아래에서 위로 두 자식의 최솟값으로 채운다 / update(i, v): 잎을 v 로 바꾸고 부모로 올라가며 두 자식의 최솟값으로 갱신 / query(l, r): 반열린 구간 [l, r+1) 의 두 끝을 잎 위치로 옮긴 뒤, 왼쪽 끝이 오른쪽 자식이면 반영하고 한 칸 오른쪽으로, 오른쪽 끝이 오른쪽 자식이면 한 칸 왼쪽으로 옮기고 반영, 두 끝을 부모로 올리기를 두 끝이 만날 때까지 반복"
