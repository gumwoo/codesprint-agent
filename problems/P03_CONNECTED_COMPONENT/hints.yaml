# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# **H6(전체 풀이)는 여기 없다.** reference.py 가 그것이고, 복사본을 만들지 않는다
# (ADR-0012). 두 곳에 적으면 한쪽만 고쳐진 날 사용자가 틀린 풀이를 본다.
#
# 사다리는 위로 갈수록 더 준다. 아래 단계가 위 단계보다 많이 알려 주면 순서가
# 의미를 잃고, 그때 힌트 의존도(Addendum 74)는 아무것도 재지 못한다.
hints:
  - level: 1
    text: "이번에는 시작점이 정해져 있지 않습니다. 어디서부터 퍼져야 하는지 스스로 정해야 합니다."
  - level: 2
    text: "모든 칸을 훑으면서 아직 방문하지 않은 1 을 만날 때마다 탐색을 **새로 시작**합니다. 그 시작 횟수가 답입니다."
  - level: 3
    text: "visited 이차원 배열 하나를 전체 순회 내내 공유하세요. 탐색마다 새로 만들면 같은 영역을 다시 셉니다."
  - level: 4
    text: "바깥 이중 반복문에서 grid[r][c]==1 이고 미방문이면 답을 1 늘리고, 거기서 BFS 로 그 영역 전체를 방문 처리합니다."
  - level: 5
    text: "visited 를 N×M 으로 만든다 / 모든 (r,c) 에 대해: 1 이고 미방문이면 answer += 1 하고 그 칸에서 BFS 로 이어진 1 을 전부 방문 표시한다 / answer 를 출력한다"
