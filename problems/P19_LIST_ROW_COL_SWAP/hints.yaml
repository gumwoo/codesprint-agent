# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "행을 바꾸는 것과 열을 바꾸는 것이 파이썬 리스트에서 왜 서로 다른 작업인지 먼저 관찰해 보라."
  - level: 2
    text: "정렬이나 탐색이 필요한 문제가 아니다. 2차원 리스트를 인덱스로 직접 조작하는 것만으로 해결된다."
  - level: 3
    text: "격자를 list of list 로 저장하면, 하나의 행은 파이썬 리스트 객체 하나에 대응한다는 점을 활용한다."
  - level: 4
    text: "행 두 개를 바꾸는 것은 그 리스트 참조 두 개를 통째로 바꾸는 일이지만, 열 두 개를 바꾸는 것은 모든 행 각각에 대해 같은 위치의 값 두 개를 하나씩 바꿔야 하는 일이다."
  - level: 5
    text: "명령을 순서대로 읽으며: row a b 이면 grid[a]와 grid[b] 전체를 교환하고, col a b 이면 모든 행 r에 대해 r[a]와 r[b]를 교환한 뒤, 끝에서 grid를 그대로 출력한다."
