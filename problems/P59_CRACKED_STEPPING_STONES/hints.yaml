# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "i 번 돌에 서기 직전에 있었던 돌은 i-1, i-2, i-3 번 중 하나뿐이다. 금 간 돌에 도착하는 방법은 없다."
  - level: 2
    text: "작은 위치의 답으로 큰 위치의 답을 만드는 1차원 동적 계획법 문제다. 같은 위치를 반복해서 다시 세지 않도록 답을 저장한다."
  - level: 3
    text: "길이 n+1 인 리스트 하나를 두고, 각 칸에 '0 번 돌에서 그 돌까지 오는 방법의 수'를 저장한다. 0 번 칸의 값은 1 이다."
  - level: 4
    text: "금 가지 않은 돌 i 의 값은 바로 앞 세 돌(범위 안에 있는 것만)의 값을 더한 것이고, 금 간 돌의 값은 0 이다. 더할 때마다 1000000007 로 나눈 나머지를 유지한다."
  - level: 5
    text: "값 리스트를 0 으로 만들고 시작 칸을 1 로 둔다 -> 1 부터 n 까지 차례로: 금 간 돌이면 건너뛴다, 아니면 앞 세 칸 중 0 이상인 칸의 값을 합해 나머지를 저장한다 -> 마지막 칸 값을 출력한다."
