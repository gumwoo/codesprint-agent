# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "명령 2 가 올 때마다 지금 남아 있는 가격 전체에서 최솟값이 필요하다. 매번 전체를 훑으면 N 이 100000 일 때 시간이 부족하다."
  - level: 2
    text: "값이 계속 추가되고 최솟값이 계속 제거되는 상황은 우선순위 큐 문제다."
  - level: 3
    text: "최소 힙 하나에 창고의 가격을 모두 담아 둔다. Python 에서는 heapq 모듈이 리스트를 최소 힙으로 다룬다."
  - level: 4
    text: "명령 1 이면 가격을 힙에 넣는다. 명령 2 이면 힙이 비었는지 먼저 확인하고, 비어 있지 않을 때만 루트(최솟값)를 꺼낸다."
  - level: 5
    text: "heap = 빈 리스트\n각 명령에 대해:\n  명령 1 x 이면 heap 에 x 삽입\n  명령 2 이면:\n    heap 이 비었으면 -1 기록\n    아니면 heap 에서 최솟값을 꺼내 기록\n기록한 값을 한 줄에 하나씩 출력"
