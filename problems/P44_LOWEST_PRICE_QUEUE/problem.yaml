# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P44_LOWEST_PRICE_QUEUE
title: 최저가 주문 처리
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 600
referenceComplexity: O(N log N)
statement: |
  창고에 상품이 들어오고 나간다. 명령은 두 종류다.
  - `1 x`: 가격이 x 인 상품 하나가 들어온다.
  - `2`: 창고에 있는 상품 중 가격이 가장 낮은 상품 하나를 내보내고 그 가격을 출력한다. 창고가 비어 있으면 -1 을 출력한다.
  같은 가격의 상품이 여러 개 있을 수 있다. 명령은 주어진 순서대로 처리한다.

  입력 형식
  첫 줄에 명령의 수 N (1 <= N <= 100000).
  다음 N 줄에 명령이 한 줄에 하나씩 주어진다. `1 x` (1 <= x <= 1000000000) 또는 `2`.
  명령 `2` 는 적어도 한 번 주어진다.

  출력 형식
  명령 `2` 마다 결과를 한 줄에 하나씩, 명령이 주어진 순서대로 출력한다.

  인덱스는 사용하지 않는다.
skills:
- code: HEAP_PRIORITY
  role: PRIMARY
  weight: 1.0
commonMistakes:
- IMPLEMENTATION_MISC
- INPUT_PARSE
negativeControl:
  mistake: IMPLEMENTATION_MISC
  expectedStatus: RUNTIME_ERROR
skillControl:
  approach: 가격을 일반 리스트에 두고 명령 2 마다 min() 으로 최솟값을 찾아 remove() 로 지운다.
