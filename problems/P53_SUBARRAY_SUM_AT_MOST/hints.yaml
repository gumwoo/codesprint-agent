# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "모든 원소가 양수다. 구간 [l, r] 의 합이 S 를 넘으면 l 을 그대로 두고 r 을 늘린 구간도 모두 S 를 넘는다."
  - level: 2
    text: "연속 구간의 양 끝을 가리키는 두 위치를 둘 다 오른쪽으로만 움직이는 투 포인터(슬라이딩 윈도우) 문제다."
  - level: 3
    text: "왼쪽 끝 위치, 오른쪽 끝 위치, 현재 구간의 합, 누적 개수 네 값만 유지하면 된다. 추가 배열은 필요 없다."
  - level: 4
    text: "오른쪽 끝을 하나 늘려 합에 더한 뒤 합이 S 를 넘는 동안 왼쪽 원소를 빼며 왼쪽 끝을 당긴다. 그때 오른쪽 끝이 r 로 고정된 조건을 만족하는 구간은 (r - 왼쪽 끝 + 1) 개다."
  - level: 5
    text: "왼쪽 = 0, 합 = 0, 개수 = 0\n오른쪽을 0 부터 N-1 까지:\n  합에 a[오른쪽] 을 더한다\n  합이 S 보다 큰 동안: 합에서 a[왼쪽] 을 빼고 왼쪽을 1 늘린다\n  개수에 (오른쪽 - 왼쪽 + 1) 을 더한다\n개수를 출력한다"
