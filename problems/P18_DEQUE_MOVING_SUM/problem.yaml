# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P18_DEQUE_MOVING_SUM
title: 이동합 구하기
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 600
referenceComplexity: O(N)
statement: |
  정수 수열이 순서대로 하나씩 들어온다. 매번 새 정수가 들어올 때마다 최근에 들어온 최대 K 개의 값들의 합을 출력한다.

  입력: 첫 줄에 정수의 개수 N 과 윈도우 크기 K (1 ≤ K ≤ N ≤ 100000) 가 공백으로 구분되어 주어진다. 둘째 줄에 N 개의 정수가 공백으로 구분되어 주어진다. 각 정수의 절댓값은 1000 이하다.

  출력: i 번째 정수가 들어온 직후의 윈도우 합을 한 줄에 하나씩, 총 N 줄에 걸쳐 출력한다. 지금까지 들어온 정수의 개수가 K 개 미만이면 그때까지 들어온 모든 정수의 합을 출력한다. 인덱스는 1부터 센다(입력에 등장하는 순서 기준).
skills:
- code: PYTHON_DEQUE_BASIC
  role: PRIMARY
  weight: 0.7
- code: PYTHON_LIST_BASIC
  role: SECONDARY
  weight: 0.3
commonMistakes:
- INPUT_PARSE
- OUTPUT_FORMAT
- INDEX_ERROR
- IMPLEMENTATION_MISC
negativeControl:
  mistake: IMPLEMENTATION_MISC
  expectedStatus: WRONG_ANSWER
