# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "매번 값이 들어올 때, 답에 영향을 주는 것은 전체가 아니라 '최근 K 개'뿐이라는 점에 주목하라 - 그보다 오래된 값은 더 이상 필요 없다."
  - level: 2
    text: "정렬이나 매번 전체를 훑는 방식이 아니라, 값이 들어오고 나가는 순서를 그대로 활용하는 자료구조 문제다."
  - level: 3
    text: "양쪽 끝에서 효율적으로 값을 추가하고 제거할 수 있는 구조가 필요하다 - collections.deque 의 append 와 popleft."
  - level: 4
    text: "새 값이 들어오면 뒤에 추가하고 합에 더한다. 그 결과 보관 중인 개수가 K 를 넘으면 가장 오래된 값을 앞에서 빼내 합에서도 제거한다."
  - level: 5
    text: "큐에 새 값을 넣고 합에 더한다. 큐 길이가 K 보다 크면 맨 앞 값을 빼서 합에서 제거한다. 그 다음 현재 합을 출력한다."
