# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "질의는 최대 10만 개인데 값의 상한은 100만으로 고정돼 있다. 질의마다 처음부터 나누어 보면 큰 소수가 많을 때 같은 작업이 계속 반복된다."
  - level: 2
    text: "질의를 받기 전에 값의 상한까지 한 번 체를 돌려 두고, 질의마다 그 결과를 이용해 소인수분해하는 전처리형 문제다."
  - level: 3
    text: "0부터 최댓값까지의 배열을 하나 두고, 각 칸에 그 수를 나누는 소수 중 가장 작은 것을 적어 둔다. 소수 칸에는 자기 자신이 들어간다."
  - level: 4
    text: "x 가 1이 될 때까지 표에서 x 의 칸이 가리키는 소수를 읽고, 그 소수로 나누어떨어지는 동안 나누며 횟수를 센다. 소인수별 횟수에 1을 더한 값들을 모두 곱하면 약수 개수가 된다."
  - level: 5
    text: "M = 질의 값의 최댓값\ntable[v] = v 로 초기화\n소수 p 마다 p*p 이상인 p 의 배수 v 에 대해, 아직 더 작은 소수가 적히지 않았으면 table[v] = p\n질의 x 마다:\n  answer = 1\n  x > 1 인 동안: p = table[x]; p 로 나눈 횟수 e 를 센다; answer *= (e + 1)\n  answer 출력"
