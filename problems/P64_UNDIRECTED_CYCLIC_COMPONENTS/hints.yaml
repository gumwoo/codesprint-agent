# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "트리인 연결 요소에는 사이클이 없다. 사이클이 있는 연결 요소는 탐색 중에 이미 방문한 정점으로 다시 이어지는 간선을 가진다. 자기 루프와 중복 간선도 이 경우에 들어간다."
  - level: 2
    text: "그래프 탐색(DFS 또는 BFS)으로 연결 요소를 하나씩 돌면서, 각 요소 안에서 사이클 여부를 판정한다."
  - level: 3
    text: "인접 리스트에 이웃 정점과 함께 간선 번호를 저장한다. 정점마다 방문 여부를, 스택 원소마다 그 정점에 들어올 때 쓴 간선 번호를 둔다."
  - level: 4
    text: "정점 x 에서 간선 e 로 이웃 y 를 볼 때, e 가 x 에 들어올 때 쓴 간선이면 건너뛴다. 그 밖에 y 가 이미 방문한 정점이면 이 연결 요소에 사이클이 있다. 방문하지 않았으면 방문 표시 후 (y, e) 를 스택에 넣는다. 부모 정점이 아니라 부모 간선으로 비교해야 중복 간선을 사이클로 잡는다."
  - level: 5
    text: "count = 0\n모든 정점 s (1..N) 에 대해:\n  s 를 방문했으면 넘어감\n  s 방문 표시, 스택에 (s, 없음), cycle = 거짓\n  스택이 빌 때까지: (x, pe) 를 꺼내고 x 의 각 (y, e) 에 대해\n    e 가 pe 이면 넘어감\n    y 방문함 → cycle = 참\n    아니면 y 방문 표시, (y, e) 넣기\n  cycle 이면 count 증가\ncount 출력"
