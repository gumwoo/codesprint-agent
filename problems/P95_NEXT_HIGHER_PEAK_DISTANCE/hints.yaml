# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "어떤 봉우리의 답이 정해지는 순간은 왼쪽에서 오른쪽으로 읽다가 그보다 높은 봉우리를 처음 만났을 때다. 새 봉우리 하나가 여러 봉우리의 답을 한꺼번에 정할 수 있다."
  - level: 2
    text: "각 봉우리마다 오른쪽을 따로 훑으면 N 이 클 때 시간 안에 끝나지 않는다. 한 번의 왼쪽→오른쪽 훑기로 끝내는 단조 스택 문제다."
  - level: 3
    text: "아직 답이 정해지지 않은 봉우리의 번호를 스택에 쌓는다. 이 스택 안의 높이는 아래에서 위로 갈수록 커지지 않는다(같거나 작아진다)."
  - level: 4
    text: "새 봉우리 i 가 오면, 스택 맨 위 봉우리의 높이가 A_i 보다 엄격히 작은 동안 계속 꺼내고 꺼낸 봉우리 j 의 답을 i - j 로 정한다. 높이가 같으면 꺼내지 않는다. 그 뒤 i 를 스택에 넣는다. 끝까지 남은 봉우리의 답은 0 이다."
  - level: 5
    text: "답 배열을 0 으로 채우고 빈 스택을 만든다 / i 를 0 부터 N-1 까지: (스택이 비지 않았고 맨 위 번호의 높이 < A_i 인 동안: 번호 j 를 꺼내 답[j] 에 i-j 기록) 다음 i 를 넣는다 / 답 배열을 공백으로 이어 출력"
