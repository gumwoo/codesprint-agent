- OUTPUT_FORMAT
negativeControl:
  mistake: IMPLEMENTATION_MISC
  expectedStatus: WRONG_ANSWER
skillControl:
  approach: 봉우리마다 오른쪽으로 한 칸씩 훑어 처음으로 더 높은 봉우리를 찾는다.
