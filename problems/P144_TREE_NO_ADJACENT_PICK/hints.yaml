# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "한 정점을 고르면 그 이웃은 고를 수 없다. 어떤 정점 아래 부분 트리에서 얻을 수 있는 최선은 그 정점을 골랐는지 여부에 따라 달라진다."
  - level: 2
    text: "루트를 하나 정하고, 리프에서 루트 방향으로 부분 트리의 답을 합쳐 올라가는 트리 DP 문제다."
  - level: 3
    text: "정점마다 두 값을 둔다: 그 정점을 고른 경우와 고르지 않은 경우의 부분 트리 최대 합. 부모 배열과 방문 순서 목록을 만들어 두면 방문 순서의 역순으로 자식이 부모보다 먼저 처리된다."
  - level: 4
    text: "정점을 고르면 자식은 모두 고르지 않은 상태여야 한다. 정점을 고르지 않으면 자식마다 고르든 말든 더 큰 쪽을 가져온다. 연속한 두 정점을 모두 건너뛰는 경우도 여기에 포함된다."
  - level: 5
    text: "루트 1에서 스택으로 순회하며 parent와 order 기록\norder 역순으로 v 처리:\n  골랐음[v]에 w[v] 추가\n  부모 p가 있으면:\n    골랐음[p]에 안골랐음[v] 추가\n    안골랐음[p]에 max(골랐음[v], 안골랐음[v]) 추가\n답 = max(골랐음[루트], 안골랐음[루트])"
