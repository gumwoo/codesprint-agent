# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "질의마다 모든 단어를 앞부분과 비교하면 N 과 Q 가 모두 클 때 너무 느리다. 같은 앞부분을 가진 단어들은 그 앞부분까지 똑같은 글자를 지나간다는 점을 보자."
  - level: 2
    text: "문자열을 글자 하나씩 따라 내려가는 나무(트라이)를 만들어 두고, 질의도 같은 나무에서 글자를 따라 내려가 답을 찾는 방식이다."
  - level: 3
    text: "노드마다 '다음 글자 → 자식 노드' 대응표와, 그 노드를 지나간 단어 수를 함께 둔다. 루트는 빈 문자열에 해당한다."
  - level: 4
    text: "단어를 넣을 때 루트에서 한 글자씩 내려가며, 자식이 없으면 새로 만들고, 도착한 모든 노드의 '지나간 단어 수'를 1 올린다. 끝 노드에서만 올리면 안 된다. 질의는 P 의 글자를 따라 내려간 노드의 수가 답이고, 도중에 자식이 없으면 답은 0 이다."
  - level: 5
    text: "노드 목록 = [빈 루트]\n각 단어 W: 현재 = 루트; W 의 각 글자 c: 현재에 c 자식이 없으면 새 노드 연결; 현재 = 그 자식; 현재.지나간수 += 1\n각 질의 P: 현재 = 루트; P 의 각 글자 c: c 자식이 없으면 0 출력 후 다음 질의; 현재 = 그 자식\n  끝까지 내려갔으면 현재.지나간수 출력"
