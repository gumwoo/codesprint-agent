# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P113_PREFIX_WORD_COUNT
title: 접두사로 시작하는 단어 세기
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 900
referenceComplexity: O(L_total + P_total) — 단어 글자 수 합과 질의 글자 수 합에 비례
statement: |
  단어 N 개가 주어진다. 이어서 질의 Q 개가 주어지며, 각 질의는 문자열 P 하나다. 각 질의마다 주어진 단어 중 P 로 시작하는 단어의 개수를 출력한다.

  단어 W 가 P 로 시작한다는 것은 W 의 앞에서부터 |P| 글자가 P 와 같다는 뜻이다. P 가 W 보다 길면 W 는 P 로 시작하지 않는다. W 와 P 가 같으면 W 는 P 로 시작한다. 같은 단어가 여러 번 주어지면 주어진 횟수만큼 따로 센다.

  예: 단어가 apple, app, apply, banana, band 이면 질의 app 의 답은 3, ban 의 답은 2, c 의 답은 0, applex 의 답은 0 이다.

  입력 형식
  - 첫 줄: 정수 N, Q (공백으로 구분)
  - 다음 N 줄: 한 줄에 단어 하나
  - 다음 Q 줄: 한 줄에 질의 문자열 P 하나

  출력 형식
  - 질의 순서대로 한 줄에 하나씩, 그 질의의 답을 정수로 출력한다. 총 Q 줄이다.

  제약
  - 1 <= N <= 100000
  - 1 <= Q <= 100000
  - 단어와 질의 문자열은 모두 영어 소문자(a-z)로만 이루어지며 길이는 1 이상 20 이하다.
  - 인덱스를 쓰지 않는 문제다. 단어와 질의는 입력에 나온 순서대로 처리한다.
skills:
- code: TRIE_PREFIX
  role: PRIMARY
  weight: 0.7
- code: STRING_PARSING
  role: SECONDARY
  weight: 0.3
commonMistakes:
- IMPLEMENTATION_MISC
- INPUT_PARSE
- OUTPUT_FORMAT
negativeControl:
  mistake: IMPLEMENTATION_MISC
  expectedStatus: WRONG_ANSWER
skillControl: null
