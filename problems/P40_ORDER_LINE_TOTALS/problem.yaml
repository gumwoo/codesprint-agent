# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P40_ORDER_LINE_TOTALS
title: 주문 줄 합산
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 600
referenceComplexity: O(L) (L 은 입력 전체 길이)
statement: |
  주문 기록 N 줄이 주어진다. 각 줄에는 품목이 쉼표(,)로 구분되어 1개 이상 들어 있다. 품목 하나는 `이름:수량*단가` 형식이다. 쉼표, 콜론(:), 별표(*) 앞뒤와 줄의 맨 앞 · 맨 뒤에는 공백이 0개 이상 있을 수 있다. 이름과 숫자 내부에는 공백이 없다. 수량이 음수이면 반품이며 부호 '-' 는 숫자 바로 앞에 붙는다.

  모든 줄의 모든 품목에 대해 이름별로 수량*단가의 합을 구한다. 이름이 처음 등장한 순서대로 한 줄에 하나씩 `이름 합계` 를 출력한다. 합계가 0 이거나 음수여도 출력한다.

  입력 형식
  - 첫 줄: 정수 N (1 ≤ N ≤ 100)
  - 다음 N 줄: 주문 기록 한 줄. 한 줄의 품목 수는 1 이상 20 이하.
  - 이름: 영어 소문자 1~10자
  - 수량: -100 이상 100 이하 정수
  - 단가: 1 이상 1000 이하 정수

  출력 형식
  - 서로 다른 이름마다 한 줄씩, 이름과 합계를 공백 하나로 구분해 출력한다.
  - 순서는 입력 전체에서 그 이름이 처음 등장한 순서다.

  인덱스: 입력과 출력에 위치 번호를 쓰지 않는다. 순서는 등장 순서로만 정한다.
skills:
- code: STRING_PARSING
  role: PRIMARY
  weight: 1.0
commonMistakes:
- INPUT_PARSE
- OUTPUT_FORMAT
negativeControl:
  mistake: INPUT_PARSE
  expectedStatus: WRONG_ANSWER
skillControl: null
