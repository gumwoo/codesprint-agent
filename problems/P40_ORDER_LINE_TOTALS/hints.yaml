# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "구분자는 세 단계(쉼표, 콜론, 별표)로 겹쳐 있고, 공백은 구분자 주변 어디에나 올 수 있다. 공백이 붙은 이름과 붙지 않은 이름은 같은 품목이다."
  - level: 2
    text: "문자열을 바깥 구분자부터 차례로 나누는 토큰화 문제다. 각 토큰을 이름과 정수로 해석한 뒤 누적한다."
  - level: 3
    text: "이름을 키로 합계를 저장하는 딕셔너리가 필요하다. Python 3.7 이상의 dict 는 삽입 순서를 유지하므로 첫 등장 순서를 따로 기록하지 않아도 된다."
  - level: 4
    text: "품목 문자열을 콜론 기준 두 조각, 뒤 조각을 별표 기준 두 조각으로 나눈다. 이름 조각은 앞뒤 공백을 제거한 뒤 키로 쓰고, 두 숫자 조각은 정수로 바꿔 곱한 값을 그 키에 더한다."
  - level: 5
    text: "N 을 읽는다 / 각 줄을 쉼표로 나눈다 / 각 품목을 이름 · 수량 · 단가로 나누고 이름의 공백을 제거한다 / 합계[이름] += 수량 × 단가 / 합계를 삽입 순서대로 '이름 합계' 로 출력한다"
