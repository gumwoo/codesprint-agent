# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "수직선 위의 한 점을 덮는 구간의 수는 어느 구간의 시작점이나 끝점을 지날 때만 바뀐다. 이웃한 두 끝점 사이에서는 그 수가 일정하다."
  - level: 2
    text: "구간을 서로 비교하지 말고, 모든 끝점을 좌표 순으로 한 번 훑는 스위핑으로 푼다."
  - level: 3
    text: "각 구간을 '시작 좌표에서 +1', '끝 좌표에서 -1' 두 사건으로 바꾼 목록을 좌표 순으로 정렬한다. 훑는 동안 지금 덮고 있는 구간 수와 직전에 본 좌표를 들고 다닌다."
  - level: 4
    text: "사건 좌표에 도착하면, 직전 좌표부터 지금 좌표까지의 조각은 아직 이번 사건이 반영되지 않은 개수로 덮여 있다. 그 개수가 K 이상이면 조각 길이를 더하고, 그다음에 개수를 바꾸고 직전 좌표를 옮긴다."
  - level: 5
    text: "사건 목록 만들기 -> 좌표 순 정렬 -> 개수 = 0, 합 = 0 -> 사건마다: (개수 >= K 이면 합에 현재 좌표 - 직전 좌표 추가) -> 개수에 사건 값 반영 -> 직전 좌표 = 현재 좌표 -> 합 출력"
