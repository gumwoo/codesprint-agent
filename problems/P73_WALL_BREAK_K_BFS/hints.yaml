# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "같은 칸에 같은 거리로 도착해도 그때까지 부순 벽의 개수가 다르면 앞으로 갈 수 있는 곳이 달라진다. 먼저 도착한 경로가 항상 더 좋은 것은 아니다."
  - level: 2
    text: "모든 이동의 비용이 1이므로 BFS로 최단 이동 횟수를 구한다. 단, 정점은 칸이 아니라 '칸과 추가 정보의 묶음'이다."
  - level: 3
    text: "정점을 (행, 열, 지금까지 부순 벽 수)로 둔다. 방문 표시는 N x M x (K+1) 크기의 3차원 배열에 한다. 큐에는 이 세 값과 거리를 함께 넣는다."
  - level: 4
    text: "(r, c, b)에서 인접 칸으로 갈 때 그 칸이 벽이면 b가 1 늘고, 빈 칸이면 그대로다. 늘어난 값이 K 이하이고 (새 행, 새 열, 새 b)를 아직 방문하지 않았을 때만 방문 표시 후 큐에 넣는다."
  - level: 5
    text: "방문[0][0][0] = 참, 큐 = [(0, 0, 0, 거리 0)]\n큐가 빌 때까지: (r, c, b, d) 꺼냄 -> 도착 칸이면 d 출력 후 종료\n  네 방향 (nr, nc)마다: 격자 안이 아니면 건너뜀\n    nb = b + (벽이면 1 아니면 0)\n    nb <= K 이고 방문[nr][nc][nb]가 거짓이면 참으로 바꾸고 (nr, nc, nb, d + 1) 삽입\n큐가 비면 -1 출력"
