# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "이웃한 두 구간은 K-1 개의 원소를 공유한다. 한 칸 옮기면 달라지는 원소는 들어오는 것 하나, 나가는 것 하나뿐이다."
  - level: 2
    text: "길이가 고정된 슬라이딩 윈도우 문제다. 구간마다 처음부터 다시 세면 O(N*K) 가 되어 시간 안에 끝나지 않는다."
  - level: 3
    text: "현재 구간 안의 값별 등장 횟수를 딕셔너리로 유지한다. 서로 다른 값의 수는 등장 횟수가 1 이상인 값의 수다."
  - level: 4
    text: "오른쪽 끝에 A[i] 가 들어오면 그 값의 횟수를 1 늘리고, 왼쪽에서 A[i-K] 가 나가면 1 줄인다. 횟수가 0 이 된 값은 딕셔너리에서 지워야 크기가 곧 답이 된다."
  - level: 5
    text: "처음 K 개를 딕셔너리에 센다 -> 크기를 기록한다 -> i = K..N-1 마다: A[i] 횟수 +1, A[i-K] 횟수 -1 하고 0 이면 삭제 -> 크기를 기록한다 -> 기록을 공백으로 이어 출력한다."
