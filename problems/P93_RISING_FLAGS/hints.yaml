# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "같은 개수의 깃대를 고르는 방법이 여러 가지라면, 마지막으로 고른 깃대가 낮을수록 뒤에서 더 많은 깃대를 이어 붙일 수 있다."
  - level: 2
    text: "고른 개수마다 가장 유리한 상태 하나만 남기는 탐욕적 관찰에, 정렬된 목록에서 자리를 찾는 이분 탐색을 더한다."
  - level: 3
    text: "길이 k 로 고를 수 있을 때 마지막 깃대 높이가 될 수 있는 가장 작은 값을 k 마다 기록한 목록을 둔다. 이 목록은 항상 오름차순이다."
  - level: 4
    text: "새 높이 x 가 오면 목록에서 x 이상인 첫 칸을 찾아 x 로 바꾸고, 그런 칸이 없으면 끝에 붙인다. 같은 높이는 이어 붙일 수 없으므로 x 와 같은 값이 있는 칸도 바꾸는 대상이다."
  - level: 5
    text: "목록 = 빈 목록\n각 높이 x 에 대해:\n    p = 목록에서 x 이상인 첫 위치 (이분 탐색)\n    p 가 목록 끝이면 x 를 붙인다\n    아니면 목록[p] 를 x 로 바꾼다\n목록의 길이를 출력한다"
