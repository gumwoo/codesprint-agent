# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "두 사람이 같은 모임인지는 서로 오갈 수 있는지로 정해진다. 사람마다 따로 누구에게 닿는지 전부 찾으면 N이 클 때 N번의 전체 탐색이 필요하다."
  - level: 2
    text: "방향 그래프를 서로 오갈 수 있는 정점끼리 묶는 강한 연결 요소 분해 문제다. 한 번의 깊이 우선 탐색(Tarjan) 또는 정방향 · 역방향 두 번의 탐색(Kosaraju)으로 모든 묶음을 구할 수 있다."
  - level: 3
    text: "방문 순서 번호, 그 정점에서 도달 가능한 스택 위 정점의 가장 작은 방문 번호(low), 아직 묶음이 정해지지 않은 정점을 담는 스택, 정점별 묶음 번호 배열을 둔다. 재귀 깊이가 N까지 갈 수 있으니 명시적 스택으로 탐색한다."
  - level: 4
    text: "정점의 탐색을 마칠 때 low 가 자신의 방문 번호와 같으면 스택에서 그 정점까지 꺼낸 것이 한 묶음이다. 묶음을 모두 정한 뒤, 간선 u→v 중 묶음 번호가 다른 것만 u 의 묶음에 '밖으로 나감' 표시를 한다."
  - level: 5
    text: "모든 정점 s 에 대해 미방문이면 s 에서 반복형 DFS 시작 → 간선을 하나씩 보며 미방문이면 번호를 매기고 스택 · 호출 스택에 넣음, 스택 위 정점이면 low 갱신 → 자식이 끝나면 부모 low 를 자식 low 로 갱신, low == 번호이면 스택에서 묶음을 꺼냄 → 모든 간선에서 서로 다른 묶음 사이면 출발 묶음 표시 → 묶음 수와 표시 없는 묶음 수 출력."
