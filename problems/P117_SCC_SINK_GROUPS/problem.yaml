# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P117_SCC_SINK_GROUPS
title: 소식이 멈추는 모임
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 1500
referenceComplexity: O(N + M)
statement: |
  사람 N명이 있고 1번부터 N번까지 번호가 붙어 있다(1-based). 전달 관계 M개가 주어지며, 관계 u v 는 u번 사람이 v번 사람에게 소식을 직접 전할 수 있다는 뜻이다. 반대 방향으로는 전할 수 없다(v u 관계가 따로 주어지면 가능하다). 소식은 여러 사람을 거쳐 전해질 수 있다.

  두 사람 a, b 가 서로에게 소식을 전할 수 있으면(a에서 b로, b에서 a로 모두 가능하면) 같은 모임에 속한다. 모든 사람은 자기 자신과 같은 모임이다. 이렇게 사람들을 모임으로 나누면 각 사람은 정확히 한 모임에 속한다.

  어떤 모임에 속한 사람이 모임 밖의 사람에게 직접 전할 수 있는 관계가 하나도 없으면, 그 모임을 '멈춤 모임'이라 한다. 모임 안의 사람끼리 전하는 관계는 상관없다.

  모임의 수와 멈춤 모임의 수를 구하라.

  입력
  첫 줄에 N M 이 주어진다.
  다음 M줄에 각각 u v 가 주어진다.

  제약
  1 <= N <= 100000
  0 <= M <= 100000
  1 <= u, v <= N
  u = v 인 관계와 같은 관계가 여러 번 주어질 수 있다.

  출력
  첫 줄에 모임의 수를 출력한다.
  둘째 줄에 멈춤 모임의 수를 출력한다.

  예시
  5 6 / 1 2 / 2 3 / 3 1 / 3 4 / 4 5 / 5 4 이면 모임은 {1,2,3}, {4,5} 두 개다. {1,2,3} 은 3에서 4로 전할 수 있으므로 멈춤 모임이 아니고, {4,5} 는 멈춤 모임이다. 답은 2 와 1 이다.
skills:
