# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P80_DIRECTED_SHORTEST_DISTANCES
title: 한 정점에서 모든 정점까지의 최단 거리
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 900
referenceComplexity: O((N + M) log M)
statement: |
  정점 N개와 방향 간선 M개로 이루어진 그래프가 있다. 정점 번호는 1부터 N까지다(1-based). 각 간선 u v w 는 정점 u 에서 정점 v 로만 갈 수 있고, 지나는 비용이 w 이다. 경로의 비용은 경로에 포함된 간선 비용의 합이다. 같은 두 정점 사이에 간선이 여러 개 있을 수 있고, u 와 v 가 같은 간선(자기 자신으로 가는 간선)도 있을 수 있다.

  출발 정점 S 에서 각 정점 i 까지 가는 경로 중 비용이 가장 작은 경로의 비용을 구하라. S 에서 S 까지의 비용은 0 이다. i 로 가는 경로가 없으면 -1 을 출력한다.

  입력
  첫 줄에 N, M, S 가 공백으로 구분되어 주어진다.
  다음 M개의 줄에 간선 정보 u v w 가 공백으로 구분되어 주어진다.

  제약
  1 ≤ N ≤ 20000
  0 ≤ M ≤ 50000
  1 ≤ S ≤ N
  1 ≤ u, v ≤ N
  1 ≤ w ≤ 100

  출력
  N개의 줄을 출력한다. i번째 줄(i = 1, 2, ..., N)에는 S 에서 정점 i 까지의 최소 비용을 출력하고, 경로가 없으면 -1 을 출력한다.

  예시 1 설명
  정점 1 에서 정점 2 로 바로 가면 비용이 10 이지만, 1 → 3 → 2 로 가면 비용이 1 + 1 = 2 이다.
skills:
- code: DIJKSTRA
  role: PRIMARY
  weight: 1.0
commonMistakes:
- IMPLEMENTATION_MISC
- INPUT_PARSE
- OUTPUT_FORMAT
negativeControl:
  mistake: IMPLEMENTATION_MISC
  expectedStatus: WRONG_ANSWER
skillControl:
  approach: 우선순위 큐 없이, 매 단계 모든 정점을 선형으로 훑어 확정되지 않은 정점 중 비용이 가장 작은 것을 고른다 (O(N^2)).
