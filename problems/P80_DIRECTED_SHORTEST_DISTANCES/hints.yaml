# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "모든 간선 비용이 양수다. 아직 거리가 확정되지 않은 정점 중 지금까지 알려진 비용이 가장 작은 정점은, 다른 정점을 거쳐 돌아와도 비용이 더 작아질 수 없다."
  - level: 2
    text: "한 출발점에서의 최단 경로 문제다. 가장 가까운 정점부터 차례로 거리를 확정해 나가는 그리디 방식으로 풀 수 있다. 매번 모든 정점을 훑어 가장 가까운 정점을 찾으면 N 이 클 때 시간이 부족하다."
  - level: 3
    text: "간선은 정점별 인접 리스트로 저장한다. 정점별 현재 최소 비용 배열과, (비용, 정점) 쌍을 비용이 작은 순서로 꺼내는 우선순위 큐(heapq)를 둔다."
  - level: 4
    text: "큐에서 (d, u) 를 꺼냈을 때 d 가 u 에 기록된 비용보다 크면 이미 더 짧은 경로로 처리된 항목이므로 버린다. 그렇지 않으면 u 에서 나가는 각 간선 (v, w) 에 대해 d + w 가 v 의 기록보다 작을 때만 기록을 바꾸고 큐에 넣는다. 처음 발견했을 때의 비용으로 고정하면 안 된다."
  - level: 5
    text: "거리 배열을 무한대로 채우고 출발점만 0 으로 둔다 → 큐에 (0, S) 를 넣는다 → 큐가 빌 때까지: 가장 작은 항목을 꺼내고, 기록보다 크면 넘어가고, 이웃마다 더 짧아지면 기록 갱신 후 큐에 추가 → 끝나면 무한대로 남은 정점은 -1, 나머지는 기록값을 한 줄씩 출력한다."
