# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "N 이 10만이고 서로 다른 이름도 수만 개일 수 있다. 이름마다 기록 전체를 다시 훑으면 이름 수 × N 번의 비교가 필요하다."
  - level: 2
    text: "기록을 처음부터 끝까지 한 번만 읽으면서 이름별 값을 누적하는 집계 문제다."
  - level: 3
    text: "이름을 키로 하는 사전을 두고, 값으로 거래 횟수와 금액 합계를 저장한다. Python 3.7 이후 dict 는 키를 넣은 순서를 유지하므로 처음 등장한 순서를 따로 기록하지 않아도 된다."
  - level: 4
    text: "기록 하나를 읽을 때 그 이름이 사전에 없으면 횟수 1, 합계는 그 금액으로 새로 넣고, 있으면 횟수에 1 을, 합계에 금액을 더한다."
  - level: 5
    text: "사전 cnt, tot 를 비운다 / 각 기록 (name, amount) 에 대해: name 이 없으면 cnt[name]=0, tot[name]=0 / cnt[name] 을 1 늘리고 tot[name] 에 amount 를 더한다 / 사전의 키 순서대로 name, cnt, tot 를 한 줄씩 출력한다"
