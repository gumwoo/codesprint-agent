# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "B 로 나눈 나머지는 B 진법 표기의 가장 낮은 자리다. 나머지를 얻는 순서가 이미 표기의 역순이다."
  - level: 2
    text: "나눗셈과 나머지로 자릿수를 하나씩 떼어 내고, 떼어 낸 자릿수로 새 수를 조립하는 진법 변환 문제다."
  - level: 3
    text: "정수 두 개만 있으면 된다. 아직 남은 수 n 과 지금까지 조립한 결과 r."
  - level: 4
    text: "한 단계마다 n 의 가장 낮은 자리를 떼어 r 의 가장 낮은 자리 뒤에 붙인다. 붙이려면 r 을 B 배 한 뒤 그 자릿수를 더한다. n 은 B 로 나눈 몫으로 줄인다."
  - level: 5
    text: "n, B 를 읽는다\nr 을 0 으로 둔다\nn 이 0 보다 큰 동안 반복:\n    d 는 n 을 B 로 나눈 나머지\n    r 을 r 곱하기 B 더하기 d 로 바꾼다\n    n 을 n 을 B 로 나눈 몫으로 바꾼다\nr 을 10 진법으로 출력한다"
