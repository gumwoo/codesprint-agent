# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P63_DIRECTED_CYCLE_CHECK
title: 작업 의존 관계의 순환 검사
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 900
referenceComplexity: O(N + M)
statement: |
  작업 N개와 의존 관계 M개가 있다. 작업 번호는 1부터 N까지다(1-based). 의존 관계 u v 는 작업 u 에서 작업 v 로 가는 방향 간선이다. 이 방향 그래프에 사이클이 하나라도 있으면 YES, 없으면 NO 를 출력한다. 자기 자신으로 가는 간선(u = v)도 사이클이다. 같은 간선이 여러 번 주어질 수 있다.

  입력 형식
  첫 줄에 정수 N, M 이 공백으로 구분되어 주어진다. (1 <= N <= 100000, 0 <= M <= 200000)
  다음 M 줄에 정수 u v 가 주어진다. (1 <= u, v <= N)

  출력 형식
  사이클이 있으면 YES, 없으면 NO 를 한 줄에 출력한다.
skills:
- code: GRAPH_CYCLE_DETECTION
  role: PRIMARY
  weight: 1.0
commonMistakes:
- IMPLEMENTATION_MISC
- NO_VISITED
negativeControl:
  mistake: IMPLEMENTATION_MISC
  expectedStatus: WRONG_ANSWER
skillControl: null
