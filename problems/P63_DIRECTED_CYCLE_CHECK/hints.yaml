# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "방향 그래프에서는 이미 방문한 정점을 다시 만났다고 해서 항상 사이클이 생기지 않는다. 두 경로가 같은 정점에서 합쳐지는 경우를 생각해 본다."
  - level: 2
    text: "깊이 우선 탐색으로 그래프를 훑으면서, 지금 따라가고 있는 경로 위의 정점으로 되돌아가는 간선이 있는지 확인하는 문제다."
  - level: 3
    text: "정점마다 상태를 세 가지로 둔다: 아직 방문하지 않음, 현재 탐색 경로 위에 있음(방문 중), 모든 후손 탐색을 마침(방문 완료). N이 크므로 재귀 대신 명시적 스택을 쓰면 재귀 깊이 제한을 피할 수 있다."
  - level: 4
    text: "간선 u -> v 를 볼 때 v 가 방문 중이면 사이클이다. v 가 방문 완료면 무시한다. v 가 미방문이면 방문 중으로 바꾸고 들어간다. 정점의 모든 간선을 다 보면 그 정점을 방문 완료로 바꾸고 경로에서 뺀다."
  - level: 5
    text: "모든 정점 s 에 대해 미방문이면 탐색 시작: s 를 방문 중으로 표시하고 (s, 다음 간선 위치) 를 스택에 넣는다. 스택 맨 위 정점에 남은 간선이 있으면 하나 꺼내 위 규칙대로 처리하고, 없으면 방문 완료로 표시하고 스택에서 뺀다. 도중에 방문 중인 정점을 만나면 YES, 끝까지 없으면 NO."
