# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "같은 칸에 같은 이동 횟수로 도착해도, 그때까지 부순 벽 수가 다르면 앞으로 갈 수 있는 곳이 달라진다."
  - level: 2
    text: "모든 이동의 비용이 1 이므로 너비 우선 탐색으로 최소 이동 횟수를 구할 수 있다. 다만 칸만으로는 상태가 부족하다."
  - level: 3
    text: "상태를 (행, 열, 지금까지 부순 벽 수) 로 잡고, 거리 배열도 이 세 값으로 인덱싱한다. 상태 수는 N * M * (K + 1) 이다."
  - level: 4
    text: "이웃 칸이 벽이면 부순 수가 1 늘어난 상태로, 빈 칸이면 그대로인 상태로 옮긴다. 부순 수가 K 를 넘으면 버리고, 그 상태를 처음 볼 때만 거리를 적고 큐에 넣는다."
  - level: 5
    text: "큐에 (0,0,0) 을 넣는다 / 꺼낸 상태가 도착 칸이면 거리를 출력하고 끝낸다 / 네 방향 이웃마다 범위 확인, 새 부순 수 계산, K 이하이고 미방문이면 거리 기록 후 넣기 / 큐가 비면 -1 출력"
