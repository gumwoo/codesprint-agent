# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# **H6(전체 풀이)는 여기 없다.** reference.py 가 그것이고, 복사본을 만들지 않는다
# (ADR-0012). 두 곳에 적으면 한쪽만 고쳐진 날 사용자가 틀린 풀이를 본다.
#
# 사다리는 위로 갈수록 더 준다. 아래 단계가 위 단계보다 많이 알려 주면 순서가
# 의미를 잃고, 그때 힌트 의존도(Addendum 74)는 아무것도 재지 못한다.
hints:
  - level: 1
    text: "가장 먼 칸을 찾으려면 결국 도달 가능한 **모든** 칸의 거리를 알아야 합니다. 중간에 멈출 수 없습니다."
  - level: 2
    text: "시작점 하나에서의 BFS 를 끝까지 돌린 뒤, 채워진 거리들의 최댓값을 답으로 씁니다."
  - level: 3
    text: "dist 이차원 배열 하나면 됩니다. 이동 횟수로 세므로 시작 칸의 거리는 0 입니다."
  - level: 4
    text: "BFS 를 끝까지 마친 다음 dist 에서 채워진 값들의 최댓값을 고릅니다. 시작 칸이 0 이면 탐색 전에 -1 을 출력합니다."
  - level: 5
    text: "시작 칸이 0 이면 -1 을 출력하고 끝낸다 / dist 를 -1 로 채우고 dist[0][0]=0 / BFS 로 닿는 칸의 거리를 전부 채운다 / 채워진 값의 최댓값을 출력한다"
