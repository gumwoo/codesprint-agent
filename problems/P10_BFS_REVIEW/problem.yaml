# 정본 형식: contracts/problem.schema.json
# Skill / Mistake 참조는 curriculum/ 에 실재해야 하며 CI 가 검증한다.

code: P10_BFS_REVIEW
title: 가장 멀리 있는 칸까지의 거리
kind: REVIEW
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 900
referenceComplexity: "O(N*M)"

statement: |
  첫 줄에 격자의 크기 N M 이 주어진다.
  이어지는 N 개의 줄에 0 과 1 로 이루어진 격자가 주어진다. 1 은 지나갈 수 있는 칸이다.

  (0, 0) 에서 상하좌우로 이동할 때, 도달 가능한 칸 중 가장 먼 칸까지의 거리를 출력한다.
  거리는 이동 횟수로 세며 시작 칸의 거리는 0 이다.
  시작 칸이 0 이면 -1 을 출력한다.

skills:
  - code: BFS_SHORTEST_PATH
    role: PRIMARY
    weight: 0.45
  - code: BFS_GRID_TRAVERSAL
    role: SECONDARY
    weight: 0.35
  - code: BFS_VISITED_MANAGEMENT
    role: SECONDARY
    weight: 0.2

commonMistakes:
  - VISITED_TIMING
  - BOUNDARY_CHECK
  - OUTPUT_FORMAT
  - IMPLEMENTATION_MISC

# wrong.py 가 무엇을 틀리게 했고 그 결과가 어떤 판정이어야 하는가.
# 도달 여부를 무시하고 맨해튼 거리 최대를 고른다
negativeControl:
  mistake: IMPLEMENTATION_MISC
  expectedStatus: WRONG_ANSWER
