# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "이웃한 두 구간은 K-1 개의 원소를 공유한다. 한 칸 옮길 때 달라지는 원소는 들어오는 값 하나와 나가는 값 하나뿐이다."
  - level: 2
    text: "고정 길이 슬라이딩 윈도우 문제다. 첫 구간의 결과를 만든 뒤 한 칸씩 옮기며 갱신한다."
  - level: 3
    text: "값마다 현재 구간 안에 몇 번 나오는지 세는 사전(값 -> 개수)을 둔다. 개수가 1 이상인 값의 수가 곧 종류 수다."
  - level: 4
    text: "오른쪽 끝 값의 개수를 1 늘리고 왼쪽에서 빠지는 값의 개수를 1 줄인다. 줄인 개수가 0 이 되면 그 값을 사전에서 제거해야 종류 수가 맞다. 최댓값은 더 클 때만 갱신해야 가장 작은 시작 인덱스가 남는다."
  - level: 5
    text: "첫 K 개로 개수 사전을 채운다 / 최댓값 = 사전 크기, 위치 = 0 / i 를 K 부터 N-1 까지: A[i] 개수 증가, A[i-K] 개수 감소 후 0 이면 제거, 사전 크기가 최댓값보다 크면 최댓값과 위치(i-K+1) 갱신 / 최댓값과 위치 출력"
