# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P52_WINDOW_MAX_DISTINCT
title: 길이 K 구간의 최대 종류 수
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 900
referenceComplexity: O(N)
statement: |
  길이 N 인 정수 수열 A 와 정수 K 가 주어진다. 길이가 정확히 K 인 연속 구간 A[s], A[s+1], ..., A[s+K-1] (0 <= s <= N-K) 각각에 대해 서로 다른 값의 개수를 구한다. 그 개수의 최댓값과, 최댓값을 가지는 구간 중 시작 인덱스 s 가 가장 작은 것을 출력한다. 인덱스는 0 부터 센다.

  입력 형식
  첫째 줄에 N 과 K 가 공백으로 구분되어 주어진다. (1 <= K <= N <= 200000)
  둘째 줄에 A[0], A[1], ..., A[N-1] 이 공백으로 구분되어 주어진다. (1 <= A[i] <= 10^9)

  출력 형식
  최대 종류 수와 그 구간의 시작 인덱스 s 를 공백 하나로 구분하여 한 줄에 출력한다.
skills:
- code: SLIDING_WINDOW
  role: PRIMARY
  weight: 1.0
commonMistakes:
- IMPLEMENTATION_MISC
- INPUT_PARSE
- OUTPUT_FORMAT
negativeControl:
  mistake: IMPLEMENTATION_MISC
  expectedStatus: WRONG_ANSWER
skillControl:
  approach: 시작 위치마다 구간을 잘라 set 으로 종류 수를 처음부터 다시 센다.
