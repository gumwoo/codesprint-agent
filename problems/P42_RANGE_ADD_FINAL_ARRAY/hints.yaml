# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "갱신마다 구간의 모든 칸을 고치면 최악에 N * M 번 더한다. 갱신 하나가 배열에 남기는 변화는 구간이 시작하는 곳과 끝난 직후 두 곳에서만 달라진다."
  - level: 2
    text: "차분 배열과 누적 합을 쓰는 문제다. 갱신은 기록만 하고, 배열 값은 마지막에 한 번 계산한다."
  - level: 3
    text: "길이 N+2 의 보조 배열 하나를 둔다. 각 칸은 그 위치에서 값이 얼마나 바뀌는지를 뜻한다."
  - level: 4
    text: "갱신 l r v 는 시작 위치에 v 를 더하고, 구간이 끝난 바로 다음 위치에 v 를 빼는 것으로 기록한다. 최종 A[i] 는 보조 배열의 1..i 합이다."
  - level: 5
    text: "보조 배열 d 를 0 으로 초기화\n각 갱신 (l, r, v) 마다: d 의 l 칸 += v, d 의 r+1 칸 -= v\n누적값 s = 0\ni = 1..N 에 대해: s 에 d 의 i 칸을 더하고 s 를 A[i] 로 기록\nA 를 공백으로 이어 출력"
