# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# **H6(전체 풀이)는 여기 없다.** reference.py 가 그것이고, 복사본을 만들지 않는다
# (ADR-0012). 두 곳에 적으면 한쪽만 고쳐진 날 사용자가 틀린 풀이를 본다.
#
# 사다리는 위로 갈수록 더 준다. 아래 단계가 위 단계보다 많이 알려 주면 순서가
# 의미를 잃고, 그때 힌트 의존도(Addendum 74)는 아무것도 재지 못한다.
hints:
  - level: 1
    text: "영역의 **개수**가 아니라 **크기**를 묻습니다. 탐색 한 번이 끝날 때 무엇을 알고 있어야 할까요."
  - level: 2
    text: "P03 과 같은 구조입니다. 영역마다 탐색을 시작하되, 이번에는 그 탐색이 몇 칸을 방문했는지 셉니다."
  - level: 3
    text: "탐색 함수가 방문한 칸 수를 돌려주게 하세요. 바깥에서는 그 값들의 최댓값만 남깁니다."
  - level: 4
    text: "BFS 안에서 큐를 꺼낼 때마다 지역 카운터를 1 늘리고, 탐색이 끝나면 지금까지의 최댓값과 비교해 더 큰 쪽을 남깁니다."
  - level: 5
    text: "best = 0 / 모든 (r,c) 에 대해: 1 이고 미방문이면 BFS 로 그 영역을 돌며 칸 수를 세고 지금까지의 최댓값과 비교한다 / best 를 출력한다 (1 이 없으면 0 이 그대로 답)"
