# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P29_GRID_TRANSFORM_CHAIN
title: 격자 변환 명령 접기
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 900
referenceComplexity: O(H*W + Q)
statement: |
  H행 W열의 격자와 변환 명령 Q개가 주어진다. 명령을 주어진 순서대로 모두 적용한 뒤의 격자를 출력한다.

  행 번호와 열 번호는 0부터 센다. 현재 격자가 n행 m열이고 각 칸을 A[i][j] (0 <= i < n, 0 <= j < m) 라고 할 때, 각 명령은 다음과 같이 새 격자 B를 만든다.
  - T: B는 m행 n열이고 B[j][i] = A[i][j]
  - R: B는 m행 n열이고 B[j][n-1-i] = A[i][j]
  - L: B는 m행 n열이고 B[m-1-j][i] = A[i][j]
  - V: B는 n행 m열이고 B[n-1-i][j] = A[i][j]
  - M: B는 n행 m열이고 B[i][m-1-j] = A[i][j]

  입력 형식: 첫 줄에 H와 W가 공백으로 구분되어 주어진다 (1 <= H, W <= 50). 이어서 H개의 줄에 각각 길이 W의 문자열이 주어지며, 문자는 소문자 알파벳이다. 그 다음 줄에 Q가 주어진다 (1 <= Q <= 100). 마지막 줄에 길이 Q의 문자열이 주어지며 각 문자는 T, R, L, V, M 중 하나다.

  출력 형식: 모든 명령을 순서대로 적용한 뒤의 격자를 출력한다. 결과가 n행 m열이면 n개의 줄에 각각 길이 m의 문자열을 출력한다. 줄 끝에 공백을 두지 않는다.
