# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "명령은 칸의 값을 바꾸지 않고 위치만 옮긴다. T, R, L 은 행 수와 열 수를 맞바꾸고 V, M 은 크기를 그대로 둔다. Q 가 아무리 커도 최종 배치로 나올 수 있는 모양이 몇 가지나 되는지 먼저 세어 보라."
  - level: 2
    text: "이 다섯 명령을 합성해서 만들 수 있는 변환은 정사각형의 대칭 변환 8 가지와 같다. 즉 명령열을 처음부터 끝까지 격자에 하나씩 적용하는 대신, 명령열 전체를 변환 하나로 합쳐 두고 마지막에 격자에 단 한 번만 적용할 수 있다."
  - level: 3
    text: "상태로 격자를 들고 다닐 필요가 없다. 불 값 세 개면 충분하다: 전치 여부 t, 행 순서 뒤집기 여부 r, 열 순서 뒤집기 여부 c. 적용 순서를 '전치 먼저, 그 다음 행 뒤집기, 마지막에 열 뒤집기'로 고정하면 이 세 값의 조합 8 가지가 가능한 모든 변환과 일대일 대응한다."
  - level: 4
    text: "각 명령도 같은 세쌍으로 적는다. T 는 전치만, V 는 행 뒤집기만, M 은 열 뒤집기만, R 은 전치 후 열 뒤집기, L 은 전치 후 행 뒤집기다. 누적 상태 뒤에 새 명령을 이어 붙일 때, 새 명령에 전치가 없으면 행 플래그와 열 플래그를 각각 XOR 하면 끝이다. 새 명령에 전치가 있으면 전치 플래그를 반전시키고, 누적된 행 뒤집기와 열 뒤집기가 서로 역할을 맞바꾼 채로 XOR 된다."
  - level: 5
    text: "의사코드: (1) H, W, 격자 H 줄, Q, 명령 문자열을 읽는다. (2) 누적 상태 t, r, c 를 모두 0 으로 둔다. (3) 명령 문자마다 그 명령의 세쌍 t2, r2, c2 를 꺼낸다. t2 가 0 이면 r 에 r2 를, c 에 c2 를 XOR 한다. t2 가 1 이면 t 를 반전시키고, 새로운 r 은 r2 XOR (이전 c), 새로운 c 는 c2 XOR (이전 r) 로 동시에 바꾼다. (4) 모든 명령을 처리한 뒤 t 가 1 이면 격자를 전치하고, r 이 1 이면 행들의 순서를 뒤집고, c 가 1 이면 각 행 안의 문자 순서를 뒤집는다. (5) 각 행을 문자열로 이어 한 줄씩 출력한다."
