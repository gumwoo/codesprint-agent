# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "명령은 칸의 값을 바꾸지 않고 자리만 옮긴다. 명령마다 새 격자의 크기가 몇 행 몇 열인지부터 적어 보라."
  - level: 2
    text: "탐색이나 정렬이 필요 없는 구현 문제다. 명령을 하나씩 순서대로 적용하며 매번 새 격자를 만든다."
  - level: 3
    text: "현재 격자와 새로 만들 격자를 따로 둔다. 같은 격자에 덮어쓰면 아직 옮기지 않은 값이 지워진다."
  - level: 4
    text: "원래 칸 (i, j) 가 새 격자의 어느 칸으로 가는지 명령마다 식 하나로 정한다. 작은 예(2행 3열)에서 모서리 칸 하나를 손으로 옮겨 보고 식을 확인한다."
  - level: 5
    text: "격자를 읽는다 / 명령 문자마다: 새 크기로 빈 격자를 만든다 → 모든 (i, j) 에 대해 값을 새 위치에 쓴다 → 현재 격자를 새 격자로 바꾼다 / 끝나면 각 행을 문자열로 출력한다"
