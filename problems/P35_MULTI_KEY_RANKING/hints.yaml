# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "기준이 네 개이고, 앞 기준이 같을 때만 다음 기준을 본다. 기준마다 방향(큰 것 먼저인지 작은 것 먼저인지)이 다르다는 점을 확인한다."
  - level: 2
    text: "정렬 한 번으로 해결한다. 정렬 key 를 여러 값의 튜플로 만들면 튜플은 앞 원소부터 차례로 비교된다."
  - level: 3
    text: "출력이 입력 번호이므로 참가자 자체가 아니라 0부터 N-1까지의 번호 목록을 정렬 대상으로 삼고, 이름 · 점수 · 나이는 번호로 찾아볼 수 있는 리스트에 둔다."
  - level: 4
    text: "오름차순 정렬 하나로 내림차순 기준을 섞으려면 그 기준의 값에 음수를 붙여 key 에 넣는다. 점수는 부호를 뒤집고, 나이 · 이름 · 번호는 그대로 둔다."
  - level: 5
    text: "N 과 참가자 정보를 읽는다\n번호 i 의 key = (점수의 음수, 나이, 이름, i)\n번호 목록을 key 기준 오름차순으로 정렬한다\n정렬된 번호를 공백으로 이어 출력한다"
