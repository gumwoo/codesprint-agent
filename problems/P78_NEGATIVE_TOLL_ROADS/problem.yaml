# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P78_NEGATIVE_TOLL_ROADS
title: 음수 통행료 도로망
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 1500
referenceComplexity: O(N * M)
statement: |
  도시 N 개와 일방통행 도로 M 개가 있다. 도시는 1 부터 N 까지 번호가 붙어 있다(1-based). 도로 (u, v, w) 는 도시 u 에서 도시 v 로만 갈 수 있고, 지날 때 비용 w 를 낸다. w 는 음수일 수 있으며 음수는 돈을 받는다는 뜻이다. 자기 자신으로 가는 도로와 같은 두 도시를 잇는 여러 도로가 있을 수 있다.

  도시 1 에서 출발해 도로를 따라 이동하는 경로를 생각한다. 경로는 같은 도시나 같은 도로를 여러 번 지나도 된다. 경로의 비용은 지난 도로 비용의 합이다. 도시 1 자신까지는 도로를 하나도 지나지 않는 비용 0 의 경로가 있다.

  각 도시 v 에 대해 다음 중 하나를 출력한다.
  - 도시 1 에서 v 로 가는 경로가 없으면 INF
  - 도시 1 에서 v 로 가는 경로의 비용을 원하는 만큼 작게 만들 수 있으면 -INF
  - 그 밖에는 도시 1 에서 v 로 가는 경로 비용의 최솟값

  입력 형식
  첫 줄에 N, M 이 공백으로 주어진다. 다음 M 줄에 u, v, w 가 공백으로 주어진다.

  제약
  1 <= N <= 200
  0 <= M <= 2000
  1 <= u, v <= N
  -1000 <= w <= 1000

  출력 형식
  N 줄을 출력한다. i 번째 줄(1 <= i <= N)에는 도시 i 에 대한 답(정수, INF, -INF 중 하나)을 출력한다.
skills:
