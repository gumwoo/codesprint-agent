# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "경로가 같은 도시를 다시 지나도 되므로, 비용 합이 음수인 순환에 들렀다 갈 수 있는 도시는 비용이 끝없이 내려간다. 그런 순환에 닿지 않는 도시는 같은 도시를 두 번 지나지 않는 경로 중에 최솟값이 있다."
  - level: 2
    text: "음수 비용 간선을 허용하는 단일 출발점 최단 거리 문제다. 우선순위 큐로 한 번 확정한 거리를 다시 바꾸지 않는 방법은 음수 간선에서 틀린다. 모든 간선을 반복해서 훑는 벨만-포드 범주를 쓴다."
  - level: 3
    text: "도시마다 지금까지 찾은 최소 비용 하나를 둔다. 처음에는 도시 1 만 0 이고 나머지는 도달하지 못함을 뜻하는 값이다. 간선은 (출발, 도착, 비용) 목록으로 들고 있으면 된다. 끝없이 작아지는 도시를 표시할 값이 하나 더 필요하다."
  - level: 4
    text: "간선 하나를 볼 때 출발 도시의 비용에 간선 비용을 더한 값이 도착 도시의 비용보다 작으면 도착 도시를 그 값으로 줄인다. 음수 순환이 없으면 간선 전체 훑기를 N-1 번 하면 더 줄지 않는다. 그 뒤에도 줄어드는 도시는 끝없이 작아지고, 그 표시는 간선을 따라 이어지는 도시로 번져야 하므로 훑기를 N 번 더 하며 퍼뜨린다."
  - level: 5
    text: "dist 를 도달 못함 값으로 채우고 dist[1] 을 0 으로 둔다 / N-1 번 반복: 모든 간선 (u, v, w) 에 대해 u 에 도달했고 dist[u]+w 가 dist[v] 보다 작으면 dist[v] 를 갱신한다 / N 번 반복: 모든 간선에 대해 u 에 도달했고 dist[u]+w 가 dist[v] 보다 작으면 dist[v] 를 끝없이 작음으로 표시한다(끝없이 작음에 w 를 더해도 끝없이 작음) / 1 부터 N 까지 INF, -INF, 정수 중 하나를 출력한다."
