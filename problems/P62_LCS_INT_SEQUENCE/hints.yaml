# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "A 의 앞부분 몇 개와 B 의 앞부분 몇 개만 보았을 때의 답을 알면, 원소를 하나씩 더 볼 때의 답을 거기서 얻을 수 있다."
  - level: 2
    text: "두 수열의 앞부분 길이 두 개를 상태로 삼는 2차원 동적 계획법 문제다. 가능한 부분 수열을 모두 만들어 보면 입력이 커질 때 시간 안에 끝나지 않는다."
  - level: 3
    text: "(N+1) x (M+1) 표를 두고, 칸 (i, j) 에 'A 의 앞 i 개와 B 의 앞 j 개의 최장 공통 부분 수열 길이' 를 저장한다. 0 행과 0 열은 빈 접두사이므로 0 이다."
  - level: 4
    text: "A 의 i 번째 원소와 B 의 j 번째 원소가 같으면 왼쪽 위 칸 값에 1 을 더한다. 다르면 위 칸과 왼쪽 칸 중 큰 값을 가져온다."
  - level: 5
    text: "표 전체를 0 으로 만든다 -> i 를 1 부터 N 까지, j 를 1 부터 M 까지 돌며 두 원소가 같은지 비교해 위의 전이로 칸을 채운다 -> 오른쪽 아래 칸 (N, M) 의 값을 출력한다. 바로 앞 행만 쓰므로 행 두 개로 줄일 수 있다."
