# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "N 이 15 이하라서 K개를 고르는 모든 경우를 하나씩 만들어 합을 확인해도 충분히 빠르다."
  - level: 2
    text: "순서를 구분하지 않고 서로 다른 인덱스 K개를 고르는 것은 조합 생성 문제다. 순열처럼 순서를 바꾼 것을 따로 세면 안 된다."
  - level: 3
    text: "재귀 상태로 '다음에 고를 수 있는 가장 작은 인덱스', '지금까지 고른 개수', '지금까지의 합' 세 가지를 들고 다닌다."
  - level: 4
    text: "인덱스 i 를 고른 뒤에는 다음 선택을 i + 1 부터 시작해야 같은 인덱스를 두 번 쓰지 않고, 같은 조합을 다른 순서로 다시 세지 않는다. 고른 개수가 K 가 되면 합이 구간 안인지 확인한다."
  - level: 5
    text: "함수 dfs(시작, 개수, 합): 개수가 K 이면 합이 [L, R] 에 들면 답을 1 늘리고 끝낸다. 아니면 시작부터 N-1 까지 각 i 에 대해 dfs(i 다음, 개수 + 1, 합 + a[i]) 를 부른다. dfs(0, 0, 0) 으로 시작해 답을 출력한다."
