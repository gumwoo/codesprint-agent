# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "질의마다 l부터 r까지 하나씩 더하면 질의 하나에 최대 N번 더하게 된다. 반대로 누적 합 배열을 미리 만들어 두면 값 하나가 바뀔 때마다 그 뒤의 누적 합이 전부 달라진다. 두 연산을 모두 N보다 훨씬 적은 단계로 끝내야 한다."
  - level: 2
    text: "구간 합은 두 접두사 합의 차이로 구할 수 있다. 따라서 '한 위치의 값을 바꾸는 연산'과 '1번부터 k번까지의 합을 구하는 연산'을 둘 다 O(log N)에 하는 방법이 필요하다."
  - level: 3
    text: "길이 N+1 배열 하나에 각 칸이 자기 번호의 최하위 비트 크기만큼의 구간 합을 맡게 한 펜윅 트리(Binary Indexed Tree)를 쓴다. 덮어쓰기를 처리하려면 현재 각 선반의 값을 따로 저장해 둔다."
  - level: 4
    text: "갱신은 위치 i에서 시작해 i에 최하위 비트를 더해 가며 N을 넘기 전까지 각 칸에 변화량을 더한다. 덮어쓰기이므로 변화량은 새 값에서 현재 값을 뺀 것이다. 접두사 합은 k에서 시작해 최하위 비트를 빼 가며 0이 될 때까지 칸의 값을 모은다."
  - level: 5
    text: "값 배열 val과 트리 배열 T(모두 1-based)를 둔다. 초기값마다 update(i, A_i) 를 한다.\nupdate(i, d): i가 N 이하인 동안 T[i]에 d를 더하고 i를 다음 담당 칸으로 옮긴다.\nprefix(k): 합 s=0, k가 0보다 큰 동안 s에 T[k]를 더하고 k를 이전 담당 칸으로 옮긴다.\n작업 1 i x: update(i, x - val[i]) 후 val[i]=x.\n작업 2 l r: prefix(r) - prefix(l-1) 을 출력한다."
