# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "매 칸에서 다음 칸으로 가는 선택은 오른쪽과 아래쪽 두 가지뿐이다. 서로 다른 경로들이 같은 칸을 여러 번 지나므로, 한 칸에서 도착점까지 얻을 수 있는 최대 점수는 그 칸에 어떻게 왔는지와 무관하다."
  - level: 2
    text: "경로를 하나씩 따라가면 경로 수가 격자 크기에 대해 지수적으로 늘어난다. 칸마다 답을 한 번만 구해 재사용하는 2차원 동적 계획법 문제다."
  - level: 3
    text: "N x M 크기의 표를 두고, 표의 (r, c) 칸에 '(r, c) 에서 출발해 도착점까지 갈 때의 최대 점수, 도달할 수 없으면 -1' 을 저장한다."
  - level: 4
    text: "막히지 않은 칸의 값은 자기 칸의 값에 아래쪽 칸과 오른쪽 칸의 표 값 중 큰 것을 더한 것이다. 격자 밖이거나 표 값이 -1 인 이웃은 후보에서 뺀다. 두 이웃 모두 후보가 아니면 -1 로 둔다."
  - level: 5
    text: "표를 -1 로 채운다. 도착 칸의 표 값을 그 칸의 값으로 둔다. 행을 아래에서 위로, 각 행의 열을 오른쪽에서 왼쪽으로 돌며: 막힌 칸이면 넘어간다. 범위 안에 있는 아래 · 오른쪽 이웃의 표 값 중 최댓값을 구하고, 그 값이 0 이상이면 현재 칸 값을 더해 저장한다. 끝나면 (0, 0) 의 표 값을 출력한다."
