# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "구간은 왼쪽으로 가다가 수위가 A_i 보다 엄격히 큰 날을 처음 만나는 곳에서 끊긴다. 그 날의 위치만 알면 길이가 나온다."
  - level: 2
    text: "각 원소마다 '왼쪽에서 가장 가까운 더 큰 원소'를 찾는 문제다. 날마다 왼쪽을 다시 훑지 않고 한 번의 왼쪽→오른쪽 훑기로 모든 날의 답을 구한다."
  - level: 3
    text: "아직 뒤에 올 날의 구간을 끊을 가능성이 있는 날의 인덱스만 스택에 둔다. 스택 아래에서 위로 갈수록 수위가 엄격히 작아지는 상태를 유지한다."
  - level: 4
    text: "새 날이 오면 수위가 새 날 이하인 날은 이후 어떤 날의 구간도 끊지 못하므로 스택 위에서부터 버린다. 버린 뒤 스택 맨 위에 남은 날이 새 날의 구간을 끊는 날이고, 스택이 비었다면 0 번 날까지 이어진다."
  - level: 5
    text: "각 날 i 에 대해: 스택 맨 위 날의 수위가 A_i 이하인 동안 꺼낸다 → 스택이 비었으면 답은 i+1, 아니면 i 에서 맨 위 날의 인덱스를 뺀 값 → i 를 스택에 넣는다. 모든 답을 한 줄에 출력한다."
