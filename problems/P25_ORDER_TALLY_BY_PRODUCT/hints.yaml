# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "같은 상품 번호가 여러 번 나온다. 상품마다 기록 전체를 다시 훑으면 서로 다른 상품 수 × N 번 비교하게 된다."
  - level: 2
    text: "기록을 한 번만 순서대로 훑으면서 상품별 값을 누적하는 집계 문제다."
  - level: 3
    text: "상품 번호를 키로, 주문 횟수와 수량 합계를 값으로 두는 dict 를 쓴다. Python 3.7 이후 dict 는 키를 넣은 순서를 유지한다."
  - level: 4
    text: "기록 (id, q) 를 읽을 때 id 가 처음이면 횟수 1, 합계 q 로 새로 만들고, 이미 있으면 횟수에 1, 합계에 q 를 더한다."
  - level: 5
    text: "for 각 기록 (id, q):\n    if id 가 표에 없으면: 표[id] = (1, q)\n    else: 표[id] 의 횟수 += 1, 합계 += q\nfor 표의 키를 넣은 순서대로:\n    id, 횟수, 합계 출력"
