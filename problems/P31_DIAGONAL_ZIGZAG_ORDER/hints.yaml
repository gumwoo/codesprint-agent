# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "같은 대각선 위의 칸들은 행 번호와 열 번호의 합이 모두 같다. 격자를 행 단위로 보지 말고 이 합의 값으로 묶어서 보면 방문 순서가 드러난다."
  - level: 2
    text: "전체 경우를 탐색할 필요가 없다. 묶음(대각선)을 번호 순서대로 한 번씩 훑으면서 각 묶음 안의 순서만 정하면 되는 단순 순회 문제이며, 전체 비용은 칸 수에 비례한다."
  - level: 3
    text: "대각선 하나를 담을 임시 리스트 하나와 최종 결과를 담을 리스트 하나면 충분하다. 격자 전체를 복사하거나 방문 표시 배열을 따로 둘 필요는 없다."
  - level: 4
    text: "대각선 번호 d 에서 실제로 존재하는 행 번호는 max(0, d-C+1) 이상 min(R-1, d) 이하다. 아래쪽 한계는 열 수가, 위쪽 한계는 행 수가 결정한다. 이 범위 안에서 행 번호를 정하면 열 번호는 d 에서 행 번호를 뺀 값으로 따라온다. d 의 홀짝에 따라 이 범위를 오름차순으로 쓸지 내림차순으로 쓸지만 바꾼다."
  - level: 5
    text: "의사코드:\n결과 <- 빈 리스트\nd 를 0 부터 R+C-2 까지 증가시키며 반복:\n    시작행 <- max(0, d-C+1)\n    끝행 <- min(R-1, d)\n    묶음 <- 시작행부터 끝행까지 행 i 에 대해 격자[i][d-i] 를 모은 리스트\n    만약 d 가 짝수이면 묶음의 순서를 뒤집는다\n    결과 뒤에 묶음을 이어붙인다\n결과를 공백 하나로 이어 한 줄에 출력"
