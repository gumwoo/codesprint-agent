    role: PRIMARY
    weight: 0.55
  - code: BFS_GRID_TRAVERSAL
    role: SECONDARY
    weight: 0.25
  - code: GRID_BOUNDARY_CHECK
    role: SECONDARY
    weight: 0.1
  - code: BFS_VISITED_MANAGEMENT
    role: SECONDARY
    weight: 0.1

commonMistakes:
