code: P05_SHORTEST_PATH
title: 격자 최단거리
kind: NORMAL
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 1200
referenceComplexity: "O(N*M)"

statement: |
  첫 줄에 격자의 크기 N M 이 주어진다.
  이어지는 N 개의 줄에 0 과 1 로 이루어진 격자가 주어진다. 1 은 지나갈 수 있는 칸이다.

  (0, 0) 에서 (N-1, M-1) 까지 상하좌우로만 이동할 때 지나는 칸의 최소 개수를 출력한다.
  시작 칸과 도착 칸을 모두 센다. 도달할 수 없으면 -1 을 출력한다.

skills:
