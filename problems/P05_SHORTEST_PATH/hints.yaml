# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# **H6(전체 풀이)는 여기 없다.** reference.py 가 그것이고, 복사본을 만들지 않는다
# (ADR-0012). 두 곳에 적으면 한쪽만 고쳐진 날 사용자가 틀린 풀이를 본다.
#
# 사다리는 위로 갈수록 더 준다. 아래 단계가 위 단계보다 많이 알려 주면 순서가
# 의미를 잃고, 그때 힌트 의존도(Addendum 74)는 아무것도 재지 못한다.
hints:
  - level: 1
    text: "\"최소 개수\" 이므로 아무 경로나 찾으면 안 됩니다. 그리고 세는 것은 이동 횟수가 아니라 **지나는 칸 수**입니다."
  - level: 2
    text: "가중치가 없는 격자의 최단거리이므로 BFS 입니다. DFS 는 최단을 보장하지 않습니다."
  - level: 3
    text: "거리를 담는 이차원 배열 dist 를 visited 대신 쓰세요. 값이 채워졌는지가 곧 방문 여부입니다."
  - level: 4
    text: "시작 칸의 거리를 1 로 둡니다(시작 칸도 세므로). 이웃으로 갈 때 dist[nr][nc] = dist[r][c] + 1 입니다."
  - level: 5
    text: "dist 를 0 으로 채운다 / dist[0][0]=1, 큐에 (0,0) / 꺼낸 칸이 도착점이면 그 거리를 출력하고 끝낸다 / 네 이웃 중 격자 안이고 1 이고 dist 가 0 이면 dist 를 +1 로 채우고 넣는다 / 큐가 비면 -1 을 출력한다"
