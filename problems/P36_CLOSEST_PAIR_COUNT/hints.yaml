# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "최소 차이를 만드는 두 수는 값의 크기 순서로 늘어놓았을 때 어디에 위치하는지 생각해 보라. 모든 쌍을 비교하면 N = 100000에서 약 50억 번 비교가 필요하다."
  - level: 2
    text: "정렬 후 한 번 훑기로 푼다. 정렬하면 최소 차이는 반드시 이웃한 두 값 사이에서 나온다."
  - level: 3
    text: "정렬된 배열 하나와 현재까지의 최소 차이, 그리고 최소 차이가 0일 때를 위해 같은 값이 연속으로 몇 개 이어지는지 세는 길이 변수가 필요하다."
  - level: 4
    text: "최소 차이 D가 0보다 크면 값이 모두 다르므로 D를 만드는 쌍은 반드시 이웃한 쌍이다. D가 0이면 같은 값 k개로 이루어진 묶음마다 k(k-1)/2 쌍이 생긴다."
  - level: 5
    text: "배열을 정렬한다 → 이웃 차이의 최솟값 D를 구한다 → D > 0이면 이웃 차이가 D인 곳의 수를 센다 → D = 0이면 같은 값이 이어지는 구간 길이 k마다 k(k-1)/2를 더한다 → D와 개수를 출력한다."
