# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "빼낼 책의 수를 최소로 하는 것은 남길 책의 수를 최대로 하는 것과 같다. 남는 책들은 원래 순서를 지킨 채 권 번호가 줄어들지 않는 부분 수열이다."
  - level: 2
    text: "가장 긴 줄어들지 않는 부분 수열의 길이를 구하는 문제다. 앞의 모든 책과 비교하면 N 이 클 때 시간이 부족하므로 이분 탐색을 쓴다."
  - level: 3
    text: "길이 k 인 줄어들지 않는 부분 수열이 끝날 수 있는 가장 작은 마지막 값을 길이마다 하나씩 기록한 배열을 유지한다. 이 배열은 항상 정렬된 상태다."
  - level: 4
    text: "새 권 번호 x 가 오면 기록 배열에서 x 보다 엄격하게 큰 첫 값을 찾아 x 로 바꾼다. 그런 값이 없으면 끝에 붙인다. 같은 값은 이어 붙일 수 있으므로 x 와 같은 값은 건너뛴다."
  - level: 5
    text: "기록 배열을 비운다 / 각 x 에 대해: x 보다 큰 첫 위치를 이분 탐색 / 위치가 배열 끝이면 추가, 아니면 그 자리를 x 로 교체 / 끝나면 N 에서 배열 길이를 뺀 값을 출력"
