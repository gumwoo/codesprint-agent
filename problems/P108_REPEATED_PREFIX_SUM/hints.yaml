# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "접두사가 T 를 여러 번 이어 붙인 것이라면, 그 접두사를 T 의 길이만큼 밀어서 겹쳐 보면 겹친 부분이 모두 같다. 앞부분과 뒷부분이 같은 가장 긴 구간을 생각해 본다."
  - level: 2
    text: "문자열 패턴 매칭에서 쓰는 실패 함수(접두사 함수) 문제다. 접두사마다 처음부터 다시 비교하면 같은 글자가 많은 문자열에서 느리다."
  - level: 3
    text: "각 위치 i 에 대해, 0..i 접두사에서 자기 자신이 아닌 접두사이면서 접미사인 가장 긴 문자열의 길이를 배열에 저장한다."
  - level: 4
    text: "다음 글자가 지금까지 맞춘 길이 다음 글자와 같으면 길이를 1 늘리고, 다르면 그 길이에서 저장해 둔 값으로 물러나 다시 비교한다. 접두사 길이 L 과 그 값 b 에 대해 L - b 가 L 을 나누면 반복 횟수는 L 을 L - b 로 나눈 몫이고, 나누지 않으면 1 이다."
  - level: 5
    text: "배열 fail 을 0 으로 채운다. 합 = 1, 맞춘 길이 = 0. i = 1 부터 끝까지: 맞춘 길이 > 0 이고 글자가 다르면 맞춘 길이를 fail[맞춘 길이 - 1] 로 줄이기를 반복한다. 글자가 같으면 맞춘 길이 += 1. fail[i] = 맞춘 길이. 단위 = (i + 1) - 맞춘 길이. 단위가 (i + 1) 을 나누면 합 += (i + 1) / 단위, 아니면 합 += 1. 합을 출력한다."
