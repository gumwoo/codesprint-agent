# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P108_REPEATED_PREFIX_SUM
title: 반복으로 된 접두사
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 1500
referenceComplexity: O(N)
statement: |
  소문자로 된 문자열 S 가 주어진다. S 의 길이 L 인 접두사(앞에서부터 L 글자, L 은 1 부터 |S| 까지)마다, 그 접두사를 어떤 문자열 T 를 k 번 이어 붙인 것으로 나타낼 수 있는 가장 큰 k 를 구한다. 어떤 접두사든 자기 자신을 1 번 이어 붙인 것이므로 k 는 최소 1 이다. 모든 접두사의 k 를 더한 값을 출력한다.

  예를 들어 S = "abab" 이면 접두사 "a", "ab", "aba" 는 각각 k = 1 이고, "abab" 는 "ab" 를 2 번 이어 붙인 것이므로 k = 2 다. 답은 1 + 1 + 1 + 2 = 5 다. S = "aaa" 이면 "a" 는 1, "aa" 는 2, "aaa" 는 3 이므로 답은 6 이다.

  입력
  첫 줄에 문자열 S 가 주어진다. (1 ≤ |S| ≤ 500,000, S 는 영어 소문자로만 이루어진다)

  출력
  모든 접두사의 k 의 합을 정수 하나로 출력한다.

  접두사의 길이 L 은 1 부터 센다.
skills:
- code: PREFIX_FUNCTION
  role: PRIMARY
  weight: 0.7
- code: STRING_MANIPULATION
  role: SECONDARY
  weight: 0.3
commonMistakes:
- IMPLEMENTATION_MISC
- INDEX_ERROR
negativeControl:
  mistake: IMPLEMENTATION_MISC
  expectedStatus: WRONG_ANSWER
skillControl:
  approach: 접두사마다 길이의 약수를 작은 것부터 반복 단위로 두고 이어 붙인 문자열을 접두사와 직접 비교한다.
