# 의미를 잃고, 그때 힌트 의존도(Addendum 74)는 아무것도 재지 못한다.
hints:
  - level: 1
    text: "격자가 아니라 간선 목록입니다. 그리고 정점 번호가 1 부터 시작합니다."
  - level: 2
    text: "같은 BFS 입니다. 이웃을 방향 배열이 아니라 인접 리스트에서 가져온다는 점만 다릅니다."
  - level: 3
    text: "인접 리스트를 먼저 만드세요. 간선에 방향이 없으므로 U 에 V 를, V 에 U 를 **둘 다** 넣습니다."
  - level: 4
    text: "1 번에서 BFS 를 돌리며 방문한 정점을 셉니다. 시작 정점 자신도 포함하므로 처음부터 1 로 셉니다."
  - level: 5
    text: "adj = [[] for _ in range(N+1)] / 간선마다 adj[u].append(v) 와 adj[v].append(u) / visited[1]=True, 큐에 1 / 꺼낸 정점의 이웃 중 미방문을 표시하며 넣고 count 를 센다 / count 를 출력한다"
