# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P56_CLOSEST_VALUE_QUERY
title: 가장 가까운 값 찾기
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 900
referenceComplexity: O(N + Q log N)
statement: |
  비내림차순으로 정렬된 정수 N개로 이루어진 수열 a와 질의 Q개가 주어진다. 각 질의는 정수 x 하나다. 각 질의마다 수열 a의 원소 중 x와의 차의 절댓값 |a[i] - x| 가 가장 작은 원소의 값을 출력한다. 그런 원소가 여러 개면 그중 가장 작은 값을 출력한다. 출력은 원소의 값이므로 인덱스 기준(0-based / 1-based)은 답에 영향을 주지 않는다.

  질의는 앞 질의의 답을 알아야 풀리도록 주어진다. 입력의 수를 x' 이라 하고 직전 질의의 답을 last 라 하면(첫 질의는 last = 0) 실제 질의는 x = x' xor last 다.

  입력 형식
  첫째 줄에 N, Q가 공백으로 구분되어 주어진다. (1 <= N <= 200000, 1 <= Q <= 60000)
  둘째 줄에 a의 원소 N개가 비내림차순으로 공백으로 구분되어 주어진다. (0 <= a[i] <= 10^9)
  셋째 줄에 질의 x' 이 Q개 공백으로 구분되어 주어진다. (0 <= x' < 2^30, 풀어낸 x 는 0 <= x <= 10^9)

  출력 형식
  질의 순서대로 한 줄에 하나씩 답을 출력한다.
skills:
- code: BINARY_SEARCH_BOUNDS
  role: PRIMARY
  weight: 1.0
commonMistakes:
- IMPLEMENTATION_MISC
- INDEX_ERROR
negativeControl:
  mistake: IMPLEMENTATION_MISC
  expectedStatus: WRONG_ANSWER
skillControl:
  approach: 질의마다 수열을 앞에서부터 훑어 x 이상인 첫 원소를 찾고 그 앞뒤를 비교한다.
