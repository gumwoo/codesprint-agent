# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "x와 가장 가까운 원소는 정렬된 수열에서 x가 끼어들 자리의 바로 왼쪽 원소 아니면 바로 오른쪽 원소다. 나머지 원소는 볼 필요가 없다."
  - level: 2
    text: "정렬된 배열에서 경계 위치를 찾는 이분 탐색(lower bound)을 질의마다 한 번씩 쓴다. 질의마다 앞에서부터 훑으면 N * Q 번 비교하게 된다. 질의가 직전 답에 묶여 있어 미리 모아 정렬해 둘 수도 없다."
  - level: 3
    text: "정렬된 리스트 a와, 질의마다 구한 'x 이상인 값이 처음 나오는 위치' p 하나만 있으면 된다. p는 0부터 N까지의 값을 가질 수 있다."
  - level: 4
    text: "p가 N이면 후보는 마지막 원소뿐이고, p가 0이면 첫 원소뿐이다. 그 외에는 a[p-1]과 a[p]의 거리를 비교하며, 거리가 같으면 작은 쪽인 a[p-1]을 고른다."
  - level: 5
    text: "각 질의 x에 대해: p = (a에서 x 이상이 처음 나오는 위치, 없으면 N). p가 N이면 a의 마지막 값, p가 0이면 a의 첫 값, 아니면 왼쪽 거리 x - a[p-1] 와 오른쪽 거리 a[p] - x 중 작은 쪽의 값(같으면 왼쪽)을 답 목록에 넣는다. 다음 질의의 x 는 입력값과 이 답을 xor 해서 얻는다. 끝나면 답을 줄마다 출력한다."
