# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "n 이 최대 10^18 이라 항을 하나씩 더하면 끝나지 않는다. m 이 소수가 아닐 수 있어 등비수열 공식의 나눗셈도 쓸 수 없다."
  - level: 2
    text: "분할 정복 문제다. 길이 n 인 합을 길이 n/2 인 같은 합으로 나눠 구한 뒤 합친다."
  - level: 3
    text: "재귀 호출 하나가 두 값을 함께 돌려주게 한다: 앞 k 개 항의 합 S(k) 와 a^k. 모든 값은 m 으로 나눈 나머지로 유지한다."
  - level: 4
    text: "k = n/2 (내림) 일 때 앞 2k 개 항의 합은 S(k) * (1 + a^k) 이고 a^(2k) = (a^k)^2 이다. n 이 홀수면 여기에 a^(2k) 항을 하나 더 더하고 거듭제곱에 a 를 한 번 더 곱한다."
  - level: 5
    text: "f(n): n 이 0 이면 (0, 1 mod m) 반환. (s, p) = f(n/2 내림). 합 = s + s*p, 거듭제곱 = p*p. n 이 홀수면 합에 거듭제곱을 더하고 거듭제곱에 a 를 곱한다. 모두 mod m. (합, 거듭제곱) 반환. 답은 f(n) 의 합."
