# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P43_GEOMETRIC_SUM_MOD
title: 거듭제곱 합의 나머지
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 1200
referenceComplexity: O(log n)
statement: |
  정수 a, n, m 이 주어진다. a^0 + a^1 + a^2 + ... + a^(n-1) 을 m 으로 나눈 나머지를 구한다. 지수는 0 부터 센다. 즉 항은 a^0 부터 a^(n-1) 까지 모두 n 개다. m 은 소수가 아닐 수 있다.

  입력: 첫째 줄에 a, n, m 이 공백으로 구분되어 주어진다. 1 <= a <= 10^9, 1 <= n <= 10^18, 1 <= m <= 10^9.

  출력: 합을 m 으로 나눈 나머지를 한 줄에 출력한다.
skills:
- code: DIVIDE_AND_CONQUER
  role: PRIMARY
  weight: 0.7
- code: RECURSION_BASIC
  role: SECONDARY
  weight: 0.3
commonMistakes:
- IMPLEMENTATION_MISC
negativeControl:
  mistake: IMPLEMENTATION_MISC
  expectedStatus: WRONG_ANSWER
skillControl:
  approach: a^0 부터 a^(n-1) 까지 항을 하나씩 곱해 가며 n 번 더한다.
