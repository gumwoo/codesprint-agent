# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "기준이 세 개이고 방향이 섞여 있다. 점수는 큰 쪽이, 나이와 이름은 작은 쪽이 앞이다. 앞 기준이 같을 때만 다음 기준을 본다."
  - level: 2
    text: "정렬 문제다. 한 번의 정렬에 여러 기준을 우선순위대로 넣는 방법을 생각한다."
  - level: 3
    text: "참가자 한 명을 (이름, 점수, 나이) 묶음으로 저장한 리스트를 만든다. 튜플끼리의 비교는 첫 원소부터 차례로 비교한다."
  - level: 4
    text: "정렬 key 를 우선순위 순서의 튜플로 만든다. 내림차순이어야 하는 정수 기준은 부호를 바꿔 넣으면 모든 원소를 오름차순으로 비교할 수 있다. 이름 기준을 빠뜨리지 않는다."
  - level: 5
    text: "입력을 읽어 참가자 리스트를 만든다 → 각 참가자에 대해 key = (점수의 음수, 나이, 이름) 을 정한다 → 그 key 로 오름차순 정렬한다 → 정렬된 순서대로 이름만 한 줄씩 출력한다."
