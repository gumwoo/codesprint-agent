# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P34_RANK_BY_SCORE_AGE_NAME
title: 점수 · 나이 · 이름 순위표
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 600
referenceComplexity: O(N log N)
statement: |
  N명의 참가자가 있다. 각 참가자는 이름, 점수, 나이를 가진다. 다음 기준으로 참가자를 정렬해 이름을 한 줄에 하나씩 출력한다.
  1. 점수가 높은 사람이 앞에 온다.
  2. 점수가 같으면 나이가 적은 사람이 앞에 온다.
  3. 점수와 나이가 모두 같으면 이름이 사전순으로 앞선 사람이 앞에 온다. 사전순은 소문자 문자열의 일반적인 비교와 같다(예: "a" < "ab" < "b").
  세 기준이 모두 같은 참가자(이름까지 같은 경우)는 어느 쪽이 먼저 와도 출력이 같다.

  입력 형식
  첫 줄에 정수 N (1 ≤ N ≤ 200000).
  다음 N줄에 name score age 가 공백으로 구분되어 주어진다. name 은 길이 1 이상 10 이하의 영어 소문자 문자열, score 는 0 이상 100 이하의 정수, age 는 1 이상 100 이하의 정수다.

  출력 형식
  정렬된 순서대로 이름을 N줄에 하나씩 출력한다.

  인덱스
  입력의 참가자 순서나 번호는 출력에 쓰이지 않는다. 순위 번호를 출력하지 않는다.
skills:
- code: SORT_CUSTOM_KEY
  role: PRIMARY
  weight: 1.0
