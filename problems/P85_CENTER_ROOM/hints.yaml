# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "방마다 '먼 거리'를 구하려면 그 방에서 다른 모든 방까지의 최단 거리가 필요하다. 결국 모든 방 쌍의 최단 거리를 알아야 한다."
  - level: 2
    text: "N이 100 이하로 작으므로 모든 쌍 최단 거리를 한 번에 구하는 동적 계획법 범주의 방법을 쓸 수 있다."
  - level: 3
    text: "N×N 거리 표를 둔다. 자기 자신은 0, 복도로 직접 이어진 쌍은 그 복도들 중 가장 짧은 시간, 나머지는 무한대로 시작한다. 복도는 양방향이므로 두 칸을 함께 채운다."
  - level: 4
    text: "중간에 거쳐도 되는 방의 집합을 한 방씩 늘려 간다. 새로 허용한 방 k에 대해 모든 쌍 (i, j)에서 'i에서 k까지 + k에서 j까지'가 현재 값보다 짧으면 바꾼다. k에 대한 반복이 가장 바깥에 있어야 한다."
  - level: 5
    text: "거리 표 초기화 → 각 복도로 양방향 칸을 더 작은 값으로 갱신 → for k: for i: for j: 표[i][j] = min(표[i][j], 표[i][k] + 표[k][j]) → 각 행의 최댓값을 구하고, 그 값이 가장 작은 행 중 번호가 가장 작은 것을 1-based로 출력한다."
