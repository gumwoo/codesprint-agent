# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P85_CENTER_ROOM
title: 가장 먼 방까지가 가장 가까운 방
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 900
referenceComplexity: O(N^3 + M)
statement: |
  건물에 방 N개가 있고 1번부터 N번까지 번호가 매겨져 있다. 복도 M개가 있으며, 각 복도는 두 방 u와 v를 양방향으로 잇고 한 번 지나는 데 w초가 걸린다. 같은 두 방 사이에 복도가 여러 개 있을 수 있다. 어떤 방에서 출발해도 복도를 따라 다른 모든 방에 갈 수 있음이 보장된다.

  두 방 사이의 거리는 한 방에서 다른 방까지 복도를 따라 이동하는 데 걸리는 가장 짧은 시간이다. 방 하나를 골랐을 때, 그 방에서 다른 모든 방까지의 거리 중 가장 큰 값을 그 방의 '먼 거리'라고 한다. 방이 하나뿐이면 먼 거리는 0이다.

  먼 거리가 가장 작은 방을 찾는다. 그런 방이 여러 개면 번호가 가장 작은 방을 고른다.

  예를 들어 방 1-2 사이에 3초, 2-3 사이에 4초 복도만 있으면 방 1의 먼 거리는 7, 방 2는 4, 방 3은 7이므로 답은 방 2와 4다.

  입력
  첫 줄에 N과 M이 공백으로 주어진다.
  다음 M줄에 각 복도의 u v w가 공백으로 주어진다. 방 번호는 1부터 센다.

  출력
  고른 방의 번호(1부터 센다)와 그 방의 먼 거리를 공백 하나로 구분해 한 줄에 출력한다.

  제약
  1 ≤ N ≤ 100
  N - 1 ≤ M ≤ 2000
  1 ≤ u, v ≤ N, u ≠ v
  1 ≤ w ≤ 1000
  모든 방은 서로 연결되어 있다.
skills:
