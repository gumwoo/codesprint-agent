# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "발전기마다 켜거나 끄거나 두 가지뿐이고, 출력 합이 K 를 넘는 경우는 모두 K 에 도달한 것과 같게 취급할 수 있다."
  - level: 2
    text: "켜고 끄는 조합을 모두 시도하면 N=100 에서 끝나지 않는다. 발전기를 하나씩 고려해 가며 부분 결과를 갱신하는 동적 계획법(0-1 배낭 계열)을 쓴다."
  - level: 3
    text: "길이 K+1 의 1차원 배열을 두고, 칸 j 에 '지금까지 고려한 발전기로 출력 합 j 이상을 만드는 최소 비용'을 저장한다. 처음에는 0 칸만 0 이고 나머지는 도달 불가다."
  - level: 4
    text: "새 발전기(출력 s, 비용 c)를 켜서 목표 j 를 채우려면, 켜기 전 상태는 목표 j-s 이며 음수가 되면 0 으로 본다. 같은 발전기가 두 번 쓰이지 않도록 j 를 큰 값에서 작은 값 순서로 갱신한다."
  - level: 5
    text: "배열 best 를 도달 불가로 채우고 best[0] 을 0 으로 둔다 / 각 발전기 (s, c) 에 대해 j 를 K 부터 1 까지 내려가며 이전 상태 칸(0 아래로 내려가지 않게 자른 j-s)의 값에 c 를 더한 값과 best[j] 중 작은 쪽을 남긴다 / 끝나면 best[K] 가 도달 불가이면 -1, 아니면 그 값을 출력한다."
