# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "정점 하나를 지웠을 때 그래프가 끊어진다는 것은, 그 정점 아래쪽 어떤 부분이 그 정점을 거치지 않고는 위쪽으로 돌아갈 길이 없다는 뜻이다. 정점마다 지워 보고 다시 탐색하면 N 번의 탐색이 필요해 너무 느리다."
  - level: 2
    text: "깊이 우선 탐색 한 번으로 모든 정점을 판정할 수 있다. 탐색 트리와, 트리에 쓰이지 않은 간선(조상으로 되돌아가는 간선)을 구분해서 본다."
  - level: 3
    text: "정점마다 탐색에서 처음 방문한 순서 번호와, 그 정점의 서브트리에서 트리 간선이 아닌 간선 하나로 닿을 수 있는 가장 이른 방문 순서 번호를 기록한다. 깊은 그래프에서 재귀 한도를 넘지 않도록 명시적 스택을 쓴다."
  - level: 4
    text: "자식 c 의 서브트리가 도달할 수 있는 가장 이른 방문 순서가 부모 p 의 방문 순서보다 앞서지 못하면 p 는 급소다. 단, 탐색을 시작한 정점은 부모가 없으므로 탐색 트리에서 자식이 둘 이상일 때만 급소다."
  - level: 5
    text: "for 각 미방문 정점 s: s 에서 DFS 시작\n  정점 v 에 들어가면 order[v] = earliest[v] = 다음 번호\n  이웃 u 가 미방문이면 자식으로 내려가고, 방문했고 부모가 아니면 earliest[v] = min(earliest[v], order[u])\n  자식 c 를 끝내고 v 로 돌아오면 earliest[v] = min(earliest[v], earliest[c])\n    v 가 시작 정점이 아니고 earliest[c] >= order[v] 이면 v 표시\n    v 가 시작 정점이면 자식 수 += 1\n  시작 정점은 자식 수 >= 2 이면 표시\n표시된 정점을 오름차순으로 출력"
