# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P122_CUT_VERTICES
title: 통신망의 급소
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 1500
referenceComplexity: O(N + M)
statement: |
  무방향 그래프가 주어진다. 정점은 1부터 N까지 번호가 붙어 있다(1-based). 정점 v 하나와 v 에 붙은 간선을 모두 지웠을 때, 남은 그래프의 연결 요소 개수가 지우기 전보다 늘어나면 v 를 급소라고 한다. 그래프는 처음부터 여러 연결 요소로 나뉘어 있을 수 있다.

  예: 1-2-3 으로 이어진 경로에서 2 를 지우면 연결 요소가 1개에서 2개가 되므로 2 는 급소다. 1 을 지우면 연결 요소는 1개 그대로이므로 급소가 아니다. 간선이 없는 정점을 지우면 연결 요소가 줄어들므로 급소가 아니다.

  입력
  첫 줄에 N M 이 주어진다.
  다음 M 줄에 간선의 두 끝점 a b 가 주어진다.

  제약
  1 <= N <= 50000
  0 <= M <= 100000
  1 <= a, b <= N, a != b
  같은 두 정점을 잇는 간선은 두 번 이상 주어지지 않는다.

  출력
  첫 줄에 급소의 개수 K 를 출력한다.
  K 가 1 이상이면 둘째 줄에 급소의 번호를 오름차순으로 공백 하나씩 띄워 출력한다. K 가 0 이면 첫 줄만 출력한다.
skills:
- code: ARTICULATION_POINT
  role: PRIMARY
  weight: 0.7
- code: DFS_TRAVERSAL
  role: SECONDARY
  weight: 0.3
commonMistakes:
- IMPLEMENTATION_MISC
- OUTPUT_FORMAT
negativeControl:
  mistake: IMPLEMENTATION_MISC
  expectedStatus: WRONG_ANSWER
skillControl:
  approach: 정점마다 그 정점을 빼고 유니온 파인드로 연결 요소 개수를 다시 세어 원래 개수와 비교한다.
