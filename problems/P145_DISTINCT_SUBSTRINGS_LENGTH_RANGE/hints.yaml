# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "서로 다른 부분 문자열은 모두 어떤 접미사의 접두사다. 같은 접두사를 가진 접미사들끼리는 한 번만 세면 된다."
  - level: 2
    text: "모든 접미사를 사전순으로 정렬하고, 이웃한 접미사끼리 공통 접두사 길이를 구하는 문자열 기법을 쓴다. 부분 문자열을 직접 모으면 |S| 가 50000 일 때 끝나지 않는다."
  - level: 3
    text: "접미사 시작 위치를 사전순으로 담은 배열, 각 시작 위치의 순위 배열, 사전순으로 바로 앞 접미사와의 공통 접두사 길이 배열 세 개를 둔다. 순위는 비교 길이를 두 배씩 늘리며 다시 매기고, 공통 접두사 길이는 원래 문자열 순서로 돌며 이전 값에서 1 만 줄여 이어 간다."
  - level: 4
    text: "사전순으로 앞 접미사와 공통 접두사 길이가 h 인 접미사(길이 m)는 길이 h+1 부터 m 까지의 새 부분 문자열을 처음 만든다. 이 구간을 [L, R] 과 겹친 길이만큼 더한다."
  - level: 5
    text: "접미사 배열 sa 와 순위 rank 를 만든다\n원래 순서로 돌며 앞 접미사와의 공통 접두사 길이 lcp 를 채운다\n답 = 0\n사전순 각 접미사에 대해:\n    시작 = max(그 lcp + 1, L), 끝 = min(접미사 길이, R)\n    끝 >= 시작 이면 답에 끝 - 시작 + 1 을 더한다\n답을 출력한다"
