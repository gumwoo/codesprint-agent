# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P145_DISTINCT_SUBSTRINGS_LENGTH_RANGE
title: 길이 범위 안의 서로 다른 부분 문자열
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 1800
referenceComplexity: O(N log^2 N)
statement: |
  영소문자로 이루어진 문자열 S 와 정수 L, R 이 주어진다. S 의 연속한 부분 문자열 가운데 길이가 L 이상 R 이하인 것을 모두 모았을 때, 서로 다른 문자열이 몇 개인지 출력한다. 같은 내용의 부분 문자열은 S 의 여러 위치에서 나타나도 한 번만 센다. 예를 들어 S = abcab, L = 2, R = 3 이면 길이 2 인 것은 ab, bc, ca 이고(ab 는 두 번 나타나지만 한 번만 센다) 길이 3 인 것은 abc, bca, cab 이므로 답은 6 이다.

  입력
  첫째 줄에 문자열 S 가 주어진다. (1 ≤ |S| ≤ 50000, S 는 a~z 로만 이루어진다)
  둘째 줄에 정수 L, R 이 공백으로 구분되어 주어진다. (1 ≤ L ≤ R ≤ |S|)

  출력
  길이가 L 이상 R 이하인 서로 다른 부분 문자열의 개수를 한 줄에 출력한다.

  문자 위치는 문제 풀이에 필요하지 않으며, 설명에서 위치를 말할 때는 0 부터 센다.
skills:
- code: SUFFIX_ARRAY
  role: PRIMARY
  weight: 1.0
commonMistakes:
- IMPLEMENTATION_MISC
- INDEX_ERROR
negativeControl:
  mistake: IMPLEMENTATION_MISC
  expectedStatus: WRONG_ANSWER
skillControl:
  approach: 길이 L 부터 R 까지 각 길이마다 그 길이의 부분 문자열을 모두 잘라 집합에 넣어 개수를 더한다.
