# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P132_TOLL_HALF_COUPON
title: 반값 통행권
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 1200
referenceComplexity: O(K * M * log(K * N))
statement: |
  도시 N개(1번부터 N번까지, 1-based)와 양방향 도로 M개가 있다. i번째 도로는 도시 u_i와 v_i를 잇고 통행료는 w_i다. 같은 두 도시를 잇는 도로가 여러 개 있을 수 있다.

  반값 통행권이 K장 있다. 도로 하나를 지날 때 통행권 한 장을 쓰면 그 도로의 통행료가 w를 2로 나눈 몫(내림)이 된다. 한 번 지날 때 통행권은 최대 한 장만 쓸 수 있고, 쓴 통행권은 사라진다. 통행권을 모두 쓰지 않아도 된다.

  1번 도시에서 N번 도시로 갈 때 내는 통행료 합의 최솟값을 구한다. 갈 수 없으면 -1을 출력한다.

  예: 통행료 7인 도로에 통행권을 쓰면 3, 통행료 1인 도로에 쓰면 0을 낸다.

  입력
  첫 줄에 N M K가 공백으로 주어진다.
  다음 M줄에 u_i v_i w_i가 공백으로 주어진다.

  제약
  2 <= N <= 2000
  0 <= M <= 5000
  0 <= K <= 10
  1 <= u_i, v_i <= N, u_i != v_i
  1 <= w_i <= 1000000

  출력
  통행료 합의 최솟값을 한 줄에 출력한다. 1번 도시에서 N번 도시로 갈 수 없으면 -1을 출력한다.
skills:
- code: STATE_GRAPH_DIJKSTRA
  role: PRIMARY
  weight: 1.0
commonMistakes:
- IMPLEMENTATION_MISC
- INPUT_PARSE
- OUTPUT_FORMAT
negativeControl:
  mistake: IMPLEMENTATION_MISC
  expectedStatus: WRONG_ANSWER
skillControl:
  approach: 통행권을 쓸 도로 min(K, M)개를 모든 조합으로 고르고, 조합마다 그 도로를 반값으로 바꾼 그래프에서 일반 다익스트라를
    돌린다.
