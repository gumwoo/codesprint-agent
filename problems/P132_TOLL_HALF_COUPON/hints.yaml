# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "같은 도시에 같은 비용으로 도착해도 통행권이 몇 장 남았는지에 따라 이후에 낼 수 있는 최소 비용이 달라진다."
  - level: 2
    text: "모든 통행료가 음수가 아니므로 가중치 최단 경로 알고리즘을 쓴다. 다만 탐색하는 대상은 도시가 아니라 (도시, 쓴 통행권 수) 쌍이다."
  - level: 3
    text: "최소 비용을 (N+1) x (K+1) 표에 기록하고, (비용, 도시, 쓴 통행권 수)를 비용이 작은 것부터 꺼내는 우선순위 큐를 쓴다."
  - level: 4
    text: "(도시 u, 통행권 c장 사용)에서 도로 (u, v, w)를 지날 때 두 갈래로 간다: 그대로 내고 (v, c)로 가거나, c < K이면 절반(내림)을 내고 (v, c+1)로 간다. 기록보다 작을 때만 갱신한다."
  - level: 5
    text: "표를 무한대로 채우고 (1, 0)을 0으로 둔다\n큐에 (0, 1, 0)을 넣는다\n큐가 빌 때까지: 가장 작은 비용 상태를 꺼내고, 기록보다 크면 건너뛴다\n  인접 도로마다 정가 전이와 통행권 전이를 시도해 더 작으면 기록하고 큐에 넣는다\nN번 도시의 K+1개 기록 중 최솟값을 출력하고, 무한대면 -1을 출력한다"
