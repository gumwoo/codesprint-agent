# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P28_ENTRY_LIST_CHECK
title: 출입 명단 확인
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 300
referenceComplexity: O(N + Q)
statement: |
  건물 출입 명단에 사원 번호 N개가 등록되어 있다. 같은 번호가 여러 번 등록되어 있을 수 있다. 출입을 요청한 사원 번호 Q개가 순서대로 주어질 때, 각 요청 번호가 명단에 있으면 YES, 없으면 NO를 출력한다.

  입력 형식
  - 첫째 줄: 정수 N (1 <= N <= 100000)
  - 둘째 줄: 명단의 사원 번호 N개 a_0 ... a_{N-1}, 공백으로 구분 (1 <= a_i <= 10^9)
  - 셋째 줄: 정수 Q (1 <= Q <= 100000)
  - 넷째 줄: 요청 번호 Q개 q_0 ... q_{Q-1}, 공백으로 구분 (1 <= q_j <= 10^9)

  출력 형식
  - Q줄을 출력한다. j번째 줄(0부터 센다)에는 q_j가 명단에 있으면 YES, 없으면 NO를 대문자로 출력한다.

  인덱스는 0부터 센다. 출력 순서는 요청 순서와 같다.
skills:
- code: HASH_SET_MEMBERSHIP
  role: PRIMARY
  weight: 0.7
- code: PYTHON_LIST_BASIC
  role: SECONDARY
  weight: 0.3
commonMistakes:
- OUTPUT_FORMAT
- INPUT_PARSE
negativeControl:
  mistake: OUTPUT_FORMAT
  expectedStatus: WRONG_ANSWER
skillControl:
  approach: 명단을 리스트로 두고 질의마다 리스트를 처음부터 훑어 존재를 확인한다.
