# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "질의가 최대 100000개이고 명단도 최대 100000개다. 질의마다 명단 전체를 확인하면 비교 횟수가 얼마나 되는지 계산해 본다."
  - level: 2
    text: "각 질의는 '이 값이 있는가'만 묻는다. 순서나 개수는 필요 없으므로 조회 비용이 평균 O(1)인 방법을 찾는다."
  - level: 3
    text: "명단을 해시 기반 집합에 한 번 담아 둔다. 중복 등록은 집합에 넣으면 저절로 하나로 합쳐진다."
  - level: 4
    text: "명단 구성은 입력을 읽을 때 한 번만 한다. 이후 각 질의는 집합에 대한 포함 검사 한 번으로 답이 정해진다."
  - level: 5
    text: "명단 N개를 읽어 집합 S를 만든다 → Q개의 요청 번호를 차례로 본다 → 번호가 S에 속하면 YES, 아니면 NO를 결과 목록에 추가한다 → 결과를 줄 단위로 한 번에 출력한다."
