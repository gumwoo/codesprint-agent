# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# **H6(전체 풀이)는 여기 없다.** reference.py 가 그것이고, 복사본을 만들지 않는다
# (ADR-0012). 두 곳에 적으면 한쪽만 고쳐진 날 사용자가 틀린 풀이를 본다.
#
# 사다리는 위로 갈수록 더 준다. 아래 단계가 위 단계보다 많이 알려 주면 순서가
# 의미를 잃고, 그때 힌트 의존도(Addendum 74)는 아무것도 재지 못한다.
hints:
  - level: 1
    text: "문제 마지막 줄이 답을 반쯤 알려 줍니다. **언제** 방문 표시를 하느냐로 결과가 달라집니다."
  - level: 2
    text: "거리 합을 구하는 BFS 입니다. 거리 자체는 P05 와 같은 방법으로 채웁니다."
  - level: 3
    text: "dist 이차원 배열에 거리를 담고, 방문 여부도 그 배열로 판정합니다."
  - level: 4
    text: "**큐에 넣는 시점에** 거리를 채우고 표시하세요. 꺼낼 때 표시하면 같은 칸이 큐에 여러 번 들어가 거리 합이 부풀거나 느려집니다."
  - level: 5
    text: "dist 를 -1 로 채운다 / 시작 칸이 0 이면 0 을 출력하고 끝낸다 / dist[0][0]=0, 큐에 (0,0) / 꺼낸 칸의 네 이웃 중 격자 안이고 1 이고 dist 가 -1 이면 dist 를 +1 로 채우고 **바로** 넣는다 / dist 중 -1 이 아닌 값을 모두 더해 출력한다"
