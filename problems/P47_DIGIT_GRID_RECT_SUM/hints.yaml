# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "질의는 최대 40000개이고 직사각형 하나가 격자 거의 전체를 덮을 수 있다. 질의마다 칸을 하나씩 더하면 수억 번의 덧셈이 필요하다."
  - level: 2
    text: "격자는 질의 동안 바뀌지 않는다. 한 번 전처리해 두고 각 질의를 상수 시간에 답하는 누적 합 계열의 방법이다."
  - level: 3
    text: "(N+1) x (M+1) 크기의 2차원 표를 둔다. 표의 (i, j) 값은 (1, 1)부터 (i, j)까지 직사각형의 합이다. 0행과 0열은 모두 0으로 두어 경계 처리를 없앤다."
  - level: 4
    text: "표를 채울 때는 위 칸 값과 왼쪽 칸 값을 더하고, 두 번 더해진 왼쪽 위 대각선 칸 값을 빼고, 현재 칸 값을 더한다. 질의 답은 (r2, c2) 값에서 (r1-1, c2) 값과 (r2, c1-1) 값을 빼고, 두 번 빠진 (r1-1, c1-1) 값을 다시 더한 것이다."
  - level: 5
    text: "표 S 를 0으로 초기화\nfor i = 1..N, j = 1..M:\n    S[i][j] = 격자(i,j) + S[i-1][j] + S[i][j-1] - S[i-1][j-1]\nfor 각 질의 (r1, c1, r2, c2):\n    출력 S[r2][c2] - S[r1-1][c2] - S[r2][c1-1] + S[r1-1][c1-1]"
