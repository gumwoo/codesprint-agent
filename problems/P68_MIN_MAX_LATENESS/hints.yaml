# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "모든 순서를 시도하면 N!가지라 N이 커지면 끝나지 않는다. 바로 이웃한 두 작업의 순서를 바꿀 때 두 작업의 지연이 어떻게 달라지는지 살펴본다."
  - level: 2
    text: "교환 논증으로 정당성을 보이는 그리디 알고리즘이다. 기준 하나로 작업을 정렬하면 전체 처리 순서가 정해진다."
  - level: 3
    text: "작업을 (기준 값, 처리 시간) 쌍의 리스트로 두고 정렬한다. 상태는 현재까지 흐른 시각 하나와 지금까지의 최대 지연 하나면 된다."
  - level: 4
    text: "마감이 이른 작업을 먼저 처리한다. 마감이 늦은 작업이 이른 작업 바로 앞에 있으면 둘을 바꿔도 최대 지연이 커지지 않는다. 처리 시간이 짧은 순서는 반례가 있다."
  - level: 5
    text: "작업들을 마감 오름차순으로 정렬 -> 시각 = 0, 답 = 0 -> 각 작업마다 시각에 처리 시간을 더하고, (시각 - 마감)이 답보다 크면 답을 그 값으로 바꾼다 -> 답 출력"
