# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P65_BUSIER_NEIGHBOR_COUNT
title: 더 바쁜 이웃 세기
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 900
referenceComplexity: O(N + M)
statement: |
  정점 N개와 간선 M개로 이루어진 무방향 그래프가 주어진다. 정점 번호는 1부터 N까지다(1-based). 정점의 차수는 그 정점에 연결된 간선의 수다. 각 정점 v에 대해, v와 간선으로 직접 연결된 이웃 중에서 차수가 v의 차수보다 엄격히 큰 이웃의 수를 구한다.

  입력 형식
  - 첫 줄에 N과 M이 공백으로 구분되어 주어진다.
  - 다음 M개의 줄에 간선의 두 끝점 a, b가 공백으로 구분되어 주어진다.

  제약
  - 1 <= N <= 200000
  - 0 <= M <= 200000
  - 1 <= a, b <= N, a != b
  - 같은 정점 쌍을 잇는 간선은 두 번 이상 주어지지 않는다.

  출력 형식
  - 한 줄에 정점 1부터 N까지의 답을 순서대로 공백 하나로 구분하여 출력한다.
skills:
- code: GRAPH_REPRESENTATION
  role: PRIMARY
  weight: 0.7
- code: PYTHON_LIST_BASIC
  role: SECONDARY
  weight: 0.3
commonMistakes:
- INDEX_ERROR
- INPUT_PARSE
negativeControl:
  mistake: INDEX_ERROR
  expectedStatus: RUNTIME_ERROR
skillControl:
  approach: 인접 리스트 없이 간선 목록만 저장하고, 정점마다 간선 전체를 훑어 이웃을 찾는다.
