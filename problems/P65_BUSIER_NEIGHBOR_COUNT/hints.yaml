# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "각 정점의 답은 그 정점의 이웃들과 그 이웃들의 차수만으로 정해진다."
  - level: 2
    text: "그래프 표현 문제다. 간선 목록을 정점 기준으로 다시 정리해 두면 이웃과 차수를 바로 얻을 수 있다."
  - level: 3
    text: "정점마다 이웃 번호를 모아 두는 인접 리스트를 쓴다. 무방향이므로 간선 하나를 양쪽 끝점 모두에 기록하고, 정점 번호가 1부터이므로 크기를 N+1로 잡는다. 차수는 각 이웃 목록의 길이다."
  - level: 4
    text: "모든 간선을 한 번씩 넣어 인접 리스트와 차수를 완성한 뒤, 각 정점 v의 이웃 목록만 훑으며 차수가 v보다 큰 이웃을 센다. 이웃 목록 길이의 총합이 2M이므로 전체가 O(N + M)이다."
  - level: 5
    text: "인접 리스트 adj를 N+1칸으로 만든다 -> 간선 (a, b)마다 adj[a]에 b, adj[b]에 a를 추가 -> deg[v] = adj[v]의 길이 -> v = 1..N마다 adj[v]의 w 중 deg[w] > deg[v]인 개수를 센다 -> 결과를 공백으로 이어 한 줄에 출력."
