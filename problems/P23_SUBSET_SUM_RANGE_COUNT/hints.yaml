# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "N 이 최대 15 이므로 가능한 부분집합은 2^15 - 1 개 이하다. 전부 만들어 봐도 시간 안에 끝난다."
  - level: 2
    text: "부분집합 생성 문제다. 크기별 조합을 모두 만들거나, 각 원소를 넣을지 말지 두 갈래로 나누어 모든 경우를 만든다."
  - level: 3
    text: "원소 선택 상태는 길이 N 의 선택 표시나 N 비트 정수 하나로 나타낼 수 있다. 같은 값이 여러 개여도 위치로 구분해야 하므로 값이 아니라 인덱스를 기준으로 고른다."
  - level: 4
    text: "크기 1 부터 N 까지 빠짐없이 만들어야 한다. N 개를 모두 고르는 경우도 포함된다. 각 부분집합의 합이 L 이상 R 이하일 때만 개수를 1 늘린다."
  - level: 5
    text: "count = 0\n크기 k = 1..N 에 대해\n  N 개 위치에서 k 개를 고르는 모든 조합에 대해\n    합을 구한다\n    L <= 합 <= R 이면 count 증가\ncount 출력"
