# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "N 이 최대 100 이다. 상자 3개를 고르는 방법의 수가 얼마인지 먼저 어림해 본다."
  - level: 2
    text: "고르는 방법이 약 16만 가지뿐이므로 모든 경우를 만들어 조건을 검사하는 완전 탐색으로 충분하다."
  - level: 3
    text: "상자 무게 리스트와, 지금까지 찾은 M 이하 합의 최댓값 하나만 기억하면 된다. 초기값은 -1 이다."
  - level: 4
    text: "세 인덱스를 i < j < k 가 되도록 만들면 같은 상자를 중복해 고르지 않고, 같은 조합을 두 번 세지도 않는다. 합이 M 이하이면서 기억한 값보다 크면 갱신한다."
  - level: 5
    text: "best 를 -1 로 둔다 / 첫 인덱스를 0..N-1, 둘째를 첫째 다음부터, 셋째를 둘째 다음부터 돈다 / 세 무게 합 s 를 구해 s <= M 이고 s > best 이면 best = s / 끝나면 best 를 출력한다"
