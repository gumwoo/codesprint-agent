# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P81_NEAREST_SHELTER_DISTANCE
title: 가장 가까운 대피소까지의 거리
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 1200
referenceComplexity: O((N + M) log (N + M))
statement: |
  도시에 교차로 N개와 도로 M개가 있다. 교차로 번호는 1부터 N까지다(1-based). 도로 u v w 는 교차로 u 와 v 를 양방향으로 잇고, 어느 방향으로 지나든 비용이 w 이다. 같은 두 교차로를 잇는 도로가 여러 개 있을 수 있고, u 와 v 는 서로 다르다. 경로의 비용은 경로에 포함된 도로 비용의 합이다.

  교차로 K곳에 대피소가 있다. 각 교차로에서 대피소 중 어느 한 곳까지 가는 경로 비용의 최솟값을 구하라. 대피소가 있는 교차로의 값은 0이다. 어떤 대피소에도 갈 수 없는 교차로의 값은 -1이다.

  입력
  첫 줄에 N M K 가 공백으로 주어진다.
  둘째 줄에 대피소가 있는 교차로 번호 K개가 공백으로 주어진다. 번호는 서로 다르다.
  다음 M줄에 도로 u v w 가 한 줄에 하나씩 주어진다.

  출력
  교차로 1번부터 N번까지의 값을 순서대로 한 줄에 공백으로 구분해 출력한다.

  제약
  1 <= N <= 40000
  0 <= M <= 50000
  1 <= K <= N
  1 <= u, v <= N, u != v
  1 <= w <= 1000
skills:
- code: DIJKSTRA
  role: PRIMARY
  weight: 1.0
commonMistakes:
- OUTPUT_FORMAT
- INDEX_ERROR
negativeControl:
  mistake: OUTPUT_FORMAT
  expectedStatus: WRONG_ANSWER
skillControl:
  approach: 우선순위 큐 없이 매 단계 모든 교차로를 훑어 아직 확정되지 않은 것 중 거리가 가장 작은 교차로를 고르는 O(N^2) 방식.
