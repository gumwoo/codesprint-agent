# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "대피소가 여러 곳이어도 각 교차로에 필요한 것은 가장 가까운 한 곳까지의 비용뿐이다. 모든 대피소를 비용 0인 출발점으로 한꺼번에 놓고 생각해 보라."
  - level: 2
    text: "도로 비용이 모두 양수인 그래프의 최단 거리 문제다. 출발점에서 가까운 교차로부터 거리를 확정해 나가는 다익스트라를 여러 출발점으로 시작하면 된다."
  - level: 3
    text: "교차로마다 지금까지 알려진 최소 비용을 담는 배열, (비용, 교차로) 쌍을 담는 최소 힙, 양방향으로 넣은 인접 리스트가 필요하다. 매번 전체 교차로를 훑어 최솟값을 찾으면 N이 클 때 시간이 부족하다."
  - level: 4
    text: "힙에서 꺼낸 비용이 배열에 기록된 값보다 크면 이미 더 짧은 경로로 확정된 것이니 버린다. 그렇지 않으면 이웃마다 꺼낸 비용에 도로 비용을 더한 값이 이웃의 기록보다 작을 때만 기록을 고치고 힙에 넣는다."
  - level: 5
    text: "거리 배열을 무한대로 채운다 / 각 대피소의 거리를 0으로 두고 힙에 넣는다 / 힙이 빌 때까지: 가장 작은 (d, u)를 꺼낸다, d가 u의 기록보다 크면 넘어간다, u의 각 이웃 v와 비용 w에 대해 d+w가 v의 기록보다 작으면 기록을 바꾸고 (d+w, v)를 넣는다 / 무한대로 남은 교차로는 -1로 바꿔 한 줄에 출력한다."
