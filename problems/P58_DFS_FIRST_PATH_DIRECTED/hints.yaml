# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "답은 최단 경로가 아니다. 작은 번호 쪽으로 먼저 끝까지 들어갔다가 막히면 돌아오는 과정에서 T 를 처음 만났을 때의 경로다."
  - level: 2
    text: "깊이 우선 탐색을 규칙 그대로 시뮬레이션하면 된다. 방향 간선이므로 u 에서 v 로 가는 쪽만 인접 목록에 넣는다."
  - level: 3
    text: "정점별로 나가는 이웃을 오름차순으로 정렬한 인접 리스트, 방문 여부 배열, 그리고 S 에서 현재 정점까지의 정점을 담은 스택(또는 재귀 호출 경로)을 둔다."
  - level: 4
    text: "스택 맨 위 정점에서 아직 방문하지 않은 다음 이웃이 있으면 방문 표시 후 스택에 넣고, 없으면 스택에서 꺼낸다. 맨 위가 T 가 되는 순간의 스택 전체가 답이다."
  - level: 5
    text: "인접 리스트 정렬 -> visited[S] = 참, 스택 = [S] -> 스택이 빌 때까지: 맨 위 u 가 T 이면 스택을 앞에서부터 출력하고 끝 / u 의 다음 이웃 v 를 하나 확인해 미방문이면 표시하고 push / 남은 이웃이 없으면 pop -> 반복이 끝나면 -1 출력"
