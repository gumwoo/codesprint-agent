# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# **H6(전체 풀이)는 여기 없다.** reference.py 가 그것이고, 복사본을 만들지 않는다
# (ADR-0012). 두 곳에 적으면 한쪽만 고쳐진 날 사용자가 틀린 풀이를 본다.
#
# 사다리는 위로 갈수록 더 준다. 아래 단계가 위 단계보다 많이 알려 주면 순서가
# 의미를 잃고, 그때 힌트 의존도(Addendum 74)는 아무것도 재지 못한다.
hints:
  - level: 1
    text: "칸의 값은 상관이 없습니다. 오직 그 이웃이 격자 안인지만 묻습니다."
  - level: 2
    text: "질의마다 네 방향을 확인하는 단순 반복입니다. 미리 계산해 둘 필요도 없습니다."
  - level: 3
    text: "네 방향을 dr, dc 쌍의 리스트로 묶어 두면 조건을 한 번만 적게 됩니다."
  - level: 4
    text: "각 방향에 대해 nr = r + dr, nc = c + dc 를 만들고 0 <= nr < N and 0 <= nc < M 이면 셉니다."
  - level: 5
    text: "DIRS = ((-1,0),(1,0),(0,-1),(0,1)) / 각 질의 (r,c) 에 대해: count = 네 방향 중 격자 안인 것의 수 / count 를 한 줄에 하나씩 출력한다"
