# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# **H6(전체 풀이)는 여기 없다.** reference.py 가 그것이고, 복사본을 만들지 않는다
# (ADR-0012). 두 곳에 적으면 한쪽만 고쳐진 날 사용자가 틀린 풀이를 본다.
#
# 사다리는 위로 갈수록 더 준다. 아래 단계가 위 단계보다 많이 알려 주면 순서가
# 의미를 잃고, 그때 힌트 의존도(Addendum 74)는 아무것도 재지 못한다.
hints:
  - level: 1
    text: "\"정사각형이 아닐 수 있다\" 는 문장을 보세요. 행 개수와 열 개수를 섞어 쓰면 안 됩니다."
  - level: 2
    text: "탐색이 없습니다. 좌표를 받아 그 칸을 읽어 오기만 하면 됩니다."
  - level: 3
    text: "격자를 리스트의 리스트로 담습니다. 첫 번째 인덱스가 행(R), 두 번째가 열(C) 입니다."
  - level: 4
    text: "grid[r][c] 순서를 지키세요. grid[c][r] 로 쓰면 정사각형 입력에서는 통과하고 직사각형에서 틀립니다."
  - level: 5
    text: "N 줄을 읽어 grid 에 담는다 / 질의 (r, c) 마다 grid[r][c] 를 결과에 담는다 / 결과를 한 줄에 하나씩 출력한다"
