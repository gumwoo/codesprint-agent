# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "각 행에는 퀸이 정확히 하나 들어간다. 위쪽 행부터 한 행씩 채워 나가면 된다."
  - level: 2
    text: "행 단위로 칸을 고르고, 이미 공격받는 칸이 생기면 그 아래 행은 보지 않고 돌아가는 백트래킹이다. 배치를 모두 만든 뒤 검사하면 N=10에서 시간 안에 끝나지 않는다."
  - level: 3
    text: "열, 오른쪽 아래 대각선(행+열), 왼쪽 아래 대각선(행-열)마다 사용 여부를 기록하는 배열 세 개를 둔다. 행-열은 음수가 되므로 N을 더해 인덱스로 쓴다."
  - level: 4
    text: "r행 c열이 빈 칸이고 세 표시가 모두 비어 있을 때만 표시를 켜고 r+1행으로 내려간다. 돌아오면 켰던 세 표시를 반드시 끈다. r이 N에 닿으면 배치 하나를 센다."
  - level: 5
    text: "함수 place(r): r == N 이면 개수 += 1 후 반환. 각 열 c 에 대해: 막혔거나 열/두 대각선 중 하나라도 사용 중이면 건너뜀. 아니면 세 표시 켜기 → place(r+1) → 세 표시 끄기. place(0) 호출 후 개수 출력."
