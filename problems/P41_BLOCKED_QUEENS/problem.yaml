# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P41_BLOCKED_QUEENS
title: 막힌 칸이 있는 퀸 배치
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 900
referenceComplexity: O(N!) 상한, 가지치기로 실제 탐색 노드는 훨씬 적음 (N=10에서 수만 개)
statement: |
  N×N 판의 각 칸은 빈 칸('.') 또는 막힌 칸('#')이다. 빈 칸에만 퀸 N개를 놓아 어떤 두 퀸도 서로 공격하지 않게 하는 방법의 수를 구한다. 두 퀸은 같은 행, 같은 열, 같은 대각선(두 방향 모두)에 있으면 공격한다. 막힌 칸은 퀸을 놓을 수 없을 뿐이고 공격을 가로막지 않는다. 퀸끼리는 구별하지 않으며, 퀸이 놓인 칸의 집합이 다르면 다른 방법이다.

  입력 형식: 첫 줄에 정수 N (1 ≤ N ≤ 10). 다음 N줄에 길이 N의 문자열이 주어진다. i번째 문자열(0부터 셈)의 j번째 문자(0부터 셈)가 i행 j열 칸이다. 문자는 '.' 또는 '#' 뿐이다.

  출력 형식: 가능한 배치의 수를 정수 하나로 출력한다. 배치가 없으면 0을 출력한다.
skills:
- code: BACKTRACKING
  role: PRIMARY
  weight: 0.7
- code: RECURSION_BASIC
  role: SECONDARY
  weight: 0.3
commonMistakes:
- IMPLEMENTATION_MISC
- INDEX_ERROR
negativeControl:
  mistake: IMPLEMENTATION_MISC
  expectedStatus: WRONG_ANSWER
skillControl:
  approach: 열의 모든 순열(N!개)을 먼저 만든 뒤 막힌 칸과 대각선 충돌을 검사해 거른다.
