# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "길이 L 인 접두사가 어떤 위치에서 끝나며 나타난다면, 그 접두사의 앞부분이면서 뒷부분이기도 한 더 짧은 접두사도 같은 위치에서 끝나며 나타난다."
  - level: 2
    text: "각 위치에서 끝나는 부분 중 S 의 접두사와 같은 가장 긴 진짜 접미사의 길이를, 앞 위치의 값을 이어 받아 한 번의 훑기로 구하는 실패 함수(KMP 전처리) 문제다."
  - level: 3
    text: "실패 함수 배열 하나와, 길이 0 부터 |S| 까지 '그 길이의 접두사로 끝나는 위치 수'를 담는 개수 배열 하나를 둔다."
  - level: 4
    text: "각 위치의 실패 함수 값이 가리키는 길이에 1 을 더한다. 그다음 긴 길이부터 짧은 길이 순으로, 길이 L 의 개수를 길이 L 접두사의 실패 함수 값이 가리키는 더 짧은 길이에 더해 준다. 위치 0 에서 시작하는 접두사 자신은 마지막에 1 씩 더한다."
  - level: 5
    text: "실패 함수 f 계산 -> 모든 위치 i 에 대해 개수[f(i)] 증가 -> L 을 |S| 에서 1 까지 줄이며 개수[f(L-1)] 에 개수[L] 누적 -> L 을 1 부터 |S| 까지 개수[L] + 1 출력"
