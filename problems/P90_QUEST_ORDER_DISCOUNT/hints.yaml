# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "퀘스트 i 의 소요 시간은 앞서 완료한 퀘스트들이 어떤 순서였는지와 무관하고, 어떤 퀘스트들을 완료했는지에만 달려 있다."
  - level: 2
    text: "완료한 퀘스트의 집합을 상태로 두는 동적 계획법이다. N 이 15 이하라 가능한 집합의 수가 충분히 작다."
  - level: 3
    text: "집합을 N 비트 정수 하나로 나타내고, 그 정수마다 '이 집합을 완료하는 데 드는 최소 시간'을 저장하는 배열을 둔다. 집합마다 각 퀘스트가 받는 할인 합도 미리 구해 두면 전이가 빨라진다."
  - level: 4
    text: "집합 S 의 최솟값에서 S 에 없는 퀘스트 i 하나를 더해 S 에 i 를 추가한 집합으로 간다. 이때 드는 시간은 t[i] 에서 S 안의 모든 j 에 대한 d[j][i] 합을 뺀 값이며 1 미만이면 1 이다."
  - level: 5
    text: "best[빈 집합] = 0, 나머지는 무한대\n집합 S 를 작은 정수부터 차례로:\n  S 에 없는 i 마다:\n    비용 = max(1, t[i] - S 가 i 에게 주는 할인 합)\n    best[S + i] = min(best[S + i], best[S] + 비용)\n답은 best[모든 퀘스트]"
