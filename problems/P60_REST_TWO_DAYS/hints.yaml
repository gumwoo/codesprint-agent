# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "가장 큰 금액의 날부터 고르는 방법은 틀릴 수 있다. 3 4 1 3 에서 확인해 보라. i 번 날까지의 최선은 그보다 앞선 날들까지의 최선만 알면 정해진다."
  - level: 2
    text: "1차원 동적 계획법이다. 모든 선택 조합을 재귀로 다시 계산하면 같은 부분 문제가 반복되어 n 이 커지면 끝나지 않는다."
  - level: 3
    text: "길이 n 정도의 리스트 하나를 둔다. 한 칸은 '앞에서부터 i 번 날까지만 보았을 때 벌 수 있는 최댓값'이다. 날이 없는 경우는 0 이다."
  - level: 4
    text: "i 번 날의 값은 두 경우 중 큰 쪽이다. i 번 날에 일하지 않으면 i-1 번 날까지의 최선, 일하면 a_i 에 i-3 번 날까지의 최선을 더한 값. 인덱스가 음수가 되는 경우는 0 으로 둔다."
  - level: 5
    text: "best 를 길이 n+3 의 0 리스트로 만든다(앞 3 칸은 빈 구간). i 를 0 부터 n-1 까지 돌며 칸 i+3 에 (칸 i+2 의 값, a_i + 칸 i 의 값) 중 큰 값을 넣는다. 마지막 칸을 출력한다."
