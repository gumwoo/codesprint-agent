# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "먼저 발견한 정점의 이웃부터 확장해야 방문 순서가 유지된다. 나중에 발견한 정점을 먼저 처리하면 순서가 어긋난다."
  - level: 2
    text: "너비 우선 탐색(BFS)을 사용해 시작 정점에서부터 인접한 정점들을 순서대로 확장한다."
  - level: 3
    text: "선입선출 구조인 큐와, 각 정점을 이미 방문했는지 기록하는 배열이 필요하다."
  - level: 4
    text: "정점을 큐에 넣는 시점에 즉시 방문 표시를 해야 같은 정점이 큐에 중복으로 들어가지 않는다. 각 정점의 이웃은 오름차순으로 정렬한 뒤 아직 방문하지 않은 것만 큐에 넣는다."
  - level: 5
    text: "visited[s]를 True로 두고 큐에 s를 넣은 뒤, 큐가 빌 때까지 앞에서 하나씩 꺼내 그 정점의 이웃을 오름차순으로 순회하며, 방문하지 않은 이웃만 visited 표시 후 방문 순서 목록에 추가하고 큐에 넣는 과정을 반복한다."
