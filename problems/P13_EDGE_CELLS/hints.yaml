# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# **H6(전체 풀이)는 여기 없다.** reference.py 가 그것이고, 복사본을 만들지 않는다
# (ADR-0012). 두 곳에 적으면 한쪽만 고쳐진 날 사용자가 틀린 풀이를 본다.
#
# 사다리는 위로 갈수록 더 준다. 아래 단계가 위 단계보다 많이 알려 주면 순서가
# 의미를 잃고, 그때 힌트 의존도(Addendum 74)는 아무것도 재지 못한다.
hints:
  - level: 1
    text: "조건이 둘입니다. 네 이웃이 **전부 격자 안**이어야 하고, 그 이웃이 **전부 1** 이어야 합니다."
  - level: 2
    text: "모든 칸을 한 번씩 훑는 문제입니다. 탐색이나 방문 배열이 필요하지 않습니다."
  - level: 3
    text: "격자 하나면 됩니다. 네 방향은 dr, dc 쌍으로 묶어 두세요."
  - level: 4
    text: "격자 밖 이웃을 만나면 그 칸은 **즉시 탈락**입니다. 없는 이웃을 1 로 쳐서도, 건너뛰어서도 안 됩니다."
  - level: 5
    text: "answer = 0 / 값이 1 인 칸마다: 네 방향을 보며 하나라도 격자 밖이거나 값이 0 이면 탈락 / 넷 다 통과하면 answer += 1 / answer 를 출력한다"
