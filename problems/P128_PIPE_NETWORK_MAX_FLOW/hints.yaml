# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "1번에서 N번으로 가는 경로 하나에 물을 보내면 그 경로에서 가장 좁은 배수관만큼만 보낼 수 있다. 그런데 어떤 경로를 먼저 고르느냐에 따라 나중에 쓸 수 있는 배수관이 막힐 수 있다."
  - level: 2
    text: "네트워크 흐름 문제다. 남은 용량으로 보낼 수 있는 경로가 없어질 때까지 경로를 찾아 흘려 보내는 증가 경로 방식(Ford-Fulkerson 계열, Edmonds-Karp 나 Dinic)으로 푼다."
  - level: 3
    text: "간선마다 남은 용량을 두고, 간선 u->v 를 추가할 때 용량 0 인 v->u 역방향 간선을 짝으로 함께 저장한다. 짝 간선을 바로 찾을 수 있게 두 간선을 연속된 인덱스로 배열에 넣어 관리한다."
  - level: 4
    text: "경로에 f 만큼 흘리면 그 경로의 각 간선 남은 용량을 f 줄이고 짝 역방향 간선 용량을 f 늘린다. 역방향 간선을 따라가는 것은 앞서 보낸 물을 되돌려 다른 길로 돌리는 것과 같다."
  - level: 5
    text: "total = 0\n반복:\n  1번에서 BFS 로 남은 용량 > 0 인 간선만 따라 각 정점의 거리(level)를 구한다\n  N번에 닿지 못하면 멈춘다\n  level 이 1씩 늘어나는 간선만 따라 DFS 로 경로를 찾을 때마다\n    경로의 최소 남은 용량 f 를 구해 정방향 -f, 역방향 +f, total 에 f 를 더한다\ntotal 출력"
