# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "수열이 정렬되어 있으므로 L 이상 R 이하인 원소들은 수열 안에서 한 덩어리로 붙어 있다. 그 덩어리의 시작 위치와 끝 다음 위치만 알면 개수가 나온다."
  - level: 2
    text: "질의마다 수열 전체를 훑으면 N * Q 번 비교가 필요하다. 정렬된 배열에서 위치를 찾는 이분 탐색을 질의마다 두 번 쓴다."
  - level: 3
    text: "탐색 범위를 반열린 구간 [lo, hi)로 두고, 답이 될 수 있는 위치가 항상 이 구간 안에 남도록 유지한다. 처음 구간은 [0, N)이 아니라 [0, N]까지 답이 될 수 있다는 점에 주의한다."
  - level: 4
    text: "시작 위치는 'L 이상이 처음 나오는 곳'(lower bound), 끝 다음 위치는 'R 초과가 처음 나오는 곳'(upper bound)이다. 두 탐색은 가운데 원소와 비교할 때 등호를 어느 쪽에 두느냐만 다르다. 개수는 두 위치의 차이다."
  - level: 5
    text: "각 질의에 대해: s = (a[i] >= L 인 가장 작은 i, 없으면 N), e = (a[i] > R 인 가장 작은 i, 없으면 N)을 각각 이분 탐색으로 구한다. 탐색은 lo < hi 동안 mid 를 잡아 조건을 만족하지 않으면 lo 를 mid 다음으로, 만족하면 hi 를 mid 로 옮긴다. e - s 를 출력한다."
