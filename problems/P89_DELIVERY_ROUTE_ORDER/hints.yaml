# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "방문 순서를 모두 시도하면 N = 13 일 때 12! 가지가 넘는다. 그런데 앞으로의 최소 비용은 지금까지 지나온 순서와 상관없이 '이미 방문한 장소들'과 '지금 서 있는 장소'만으로 정해진다."
  - level: 2
    text: "같은 부분 문제가 여러 순서에서 반복해서 나온다. 각 부분 문제의 최솟값을 한 번만 계산해 저장하는 동적 계획법을 쓴다."
  - level: 3
    text: "방문한 장소 집합을 N 비트 정수 하나로 나타낸다. k 번 비트가 1 이면 k 번 장소를 방문한 것이다. 상태는 (집합, 마지막 장소) 이고, 값은 그 상태에 이르는 최소 이동 시간이다. 크기 2^N x N 의 표를 쓴다."
  - level: 4
    text: "상태 (S, u) 에서 S 에 없는 장소 v 로 이동하면 상태 (S 에 v 를 더한 집합, v) 로 가고 비용은 u 에서 v 로 가는 시간만큼 늘어난다. 시작 상태는 0 번만 담긴 집합과 마지막 장소 0, 값 0 이다. 집합은 원소를 추가하면 정수값이 커지므로 작은 정수부터 처리하면 된다."
  - level: 5
    text: "표 전체를 무한대로 채운다\n시작 상태 값을 0 으로 둔다\n집합을 나타내는 정수를 작은 것부터 차례로 보며\n  그 집합의 각 마지막 장소 u 에 대해 값이 무한대가 아니면\n    집합에 없는 각 장소 v 에 대해\n      다음 상태의 값을 (현재 값 + u 에서 v 로 가는 시간) 과 비교해 작은 쪽으로 갱신한다\n모든 장소가 담긴 집합에서 마지막 장소별 값 중 최솟값을 출력한다"
