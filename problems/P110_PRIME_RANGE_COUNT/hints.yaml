# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "질의가 최대 5만 개이고 R 은 200만까지다. 질의마다 구간의 수를 하나씩 나누어 보며 소수인지 확인하면 시간이 모자란다. 모든 질의는 1 부터 가장 큰 R 까지라는 같은 범위 안에 있다는 점을 본다."
  - level: 2
    text: "가장 큰 R 까지의 소수를 한 번에 모두 표시해 두는 방법(에라토스테네스의 체)을 쓴다. 구간 안의 개수는 'x 이하 소수 개수' 두 값의 차로 구한다."
  - level: 3
    text: "크기가 (가장 큰 R)+1 인 소수 여부 배열 하나와, 각 x 에 대해 x 이하 소수의 개수를 담는 누적 개수 배열 하나를 둔다. 0 과 1 은 처음부터 소수가 아닌 것으로 둔다."
  - level: 4
    text: "작은 수부터 보며 아직 지워지지 않은 수 p 를 만나면 p 는 소수다. p 의 제곱부터 p 간격으로 이후 수들을 지운다. p 의 제곱이 최댓값을 넘으면 더 지울 것이 없다. 질의 답은 (R 이하 소수 개수) − (L−1 이하 소수 개수)다."
  - level: 5
    text: "M ← 모든 R 중 최댓값\n소수표 ← 0..M 모두 참, 0 과 1 은 거짓\np 를 2 부터 p×p ≤ M 인 동안 늘리며:\n    소수표[p] 가 참이면 p×p, p×p+p, ... ≤ M 을 거짓으로\n누적[x] ← 0..x 중 소수표가 참인 개수\n각 질의 (L, R) 마다 누적[R] − 누적[L−1] 출력"
