# 정본 형식: contracts/problem.schema.json
# Skill / Mistake 참조는 curriculum/ 에 실재해야 하며 CI 가 검증한다.

code: P01_QUEUE_BASIC
title: 명령을 순서대로 처리하기
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 300
referenceComplexity: "O(M + N)"

statement: |
  처음에 줄에는 1 부터 M 까지의 번호가 순서대로 서 있다. 맨 앞이 1 이다.

  첫 줄에 M 과 명령의 개수 N 이 공백으로 주어진다. (0 ≤ M ≤ 400000, 1 ≤ N ≤ 600000)
  이어지는 N 개의 줄에는 다음 중 하나가 주어진다.

    push X   정수 X 를 뒤에 넣는다
    pop      맨 앞의 값을 꺼내 출력한다. 비어 있으면 -1 을 출력한다

  pop 이 실행될 때마다 결과를 한 줄에 하나씩 출력한다. pop 은 한 번 이상 주어진다.

skills:
  - code: PYTHON_DEQUE_BASIC
    role: PRIMARY
    weight: 0.7
  - code: PYTHON_LIST_BASIC
    role: SECONDARY
    weight: 0.3

commonMistakes:
  - INPUT_PARSE
  - OUTPUT_FORMAT

# wrong.py 가 무엇을 틀리게 했고 그 결과가 어떤 판정이어야 하는가.
# 큐가 비었을 때 -1 을 내지 않고 건너뛴다
negativeControl:
  mistake: OUTPUT_FORMAT
  expectedStatus: WRONG_ANSWER

# 정답 여부만으로는 이 Skill 을 썼는지 가를 수 없다(ADR-0033). skill_control.py 가 같은
# 답을 내지만 앞에서 꺼낼 때 원소를 옮기는 풀이이고, 큰 case 에서 TIME_LIMIT 이어야 한다.
skillControl:
  approach: list 의 pop(0) 으로 앞에서 꺼낸다
