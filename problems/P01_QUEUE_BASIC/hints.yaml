# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# **H6(전체 풀이)는 여기 없다.** reference.py 가 그것이고, 복사본을 만들지 않는다
# (ADR-0012). 두 곳에 적으면 한쪽만 고쳐진 날 사용자가 틀린 풀이를 본다.
#
# 사다리는 위로 갈수록 더 준다. 아래 단계가 위 단계보다 많이 알려 주면 순서가
# 의미를 잃고, 그때 힌트 의존도(Addendum 74)는 아무것도 재지 못한다.
hints:
  - level: 1
    text: "명령이 주어진 순서대로 처리된다는 점을 보세요. 먼저 들어온 값이 먼저 나갑니다."
  - level: 2
    text: "큐(FIFO) 자료구조를 그대로 쓰는 문제입니다. 정렬이나 탐색이 필요하지 않습니다."
  - level: 3
    text: "collections.deque 를 쓰세요. 뒤에 넣을 때 append, 앞에서 꺼낼 때 popleft 입니다."
  - level: 4
    text: "pop 을 만나면 큐가 비었는지 **먼저** 확인합니다. 비었으면 -1, 아니면 popleft 한 값을 출력합니다."
  - level: 5
    text: "명령을 N 번 읽는다 / push X 면 queue.append(X) / pop 이면 비었으면 -1 을, 아니면 queue.popleft() 를 결과에 담는다 / 모은 결과를 줄바꿈으로 출력한다"
