  expectedStatus: RUNTIME_ERROR
skillControl:
  approach: 행 우선 순서로 첫 빈 칸을 골라 오른쪽 타일 · 아래쪽 타일 · 비워 두기 세 경우를 모두 되추적으로 시도한다.
