# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "타일 하나는 서로 맞닿은 빈 칸 두 개를 짝지어 준다. 체스판처럼 칸을 두 색으로 칠하면 맞닿은 두 칸의 색은 항상 서로 다르다."
  - level: 2
    text: "한쪽 색 칸들과 다른 쪽 색 칸들 사이에 허용된 짝 중에서, 한 칸이 두 번 쓰이지 않게 고를 수 있는 짝의 최대 수를 묻는 문제다. 이분 그래프 최대 매칭으로 풀 수 있다."
  - level: 3
    text: "(행+열)이 짝수인 빈 칸을 왼쪽 정점, 홀수인 빈 칸을 오른쪽 정점으로 번호를 매긴다. 왼쪽 정점마다 맞닿은 빈 칸 목록을 만들고, 오른쪽 정점마다 현재 짝지어진 왼쪽 정점을 배열로 기록한다."
  - level: 4
    text: "짝이 없는 왼쪽 정점에서 이웃 칸을 본다. 그 칸이 비어 있으면 바로 짝짓고, 이미 짝이 있으면 그 짝이 다른 칸으로 옮겨 갈 수 있는지 재귀로 확인한 뒤 성공하면 짝을 바꾼다. 한 번의 탐색 안에서 이미 본 오른쪽 칸은 다시 보지 않는다."
  - level: 5
    text: "왼쪽 정점 u 에 대해 augment(u): 인접한 v 마다, v 를 이번 탐색에서 아직 안 봤으면 표시하고, v 가 비어 있거나 augment(v의 현재 짝) 이 성공하면 u 와 v 를 짝짓고 참을 반환. 모두 실패하면 거짓. 짝이 없는 왼쪽 정점 전부에 augment 를 시도해 성공 횟수를 더하고, 한 바퀴 동안 아무도 성공하지 못할 때까지 반복한다."
