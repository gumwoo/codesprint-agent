# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P83_CLUB_MERGE_SIZE
title: 동아리 합병과 인원 조회
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 900
referenceComplexity: O((N + Q) α(N))
statement: |
  학생 N 명이 있고 1 번부터 N 번까지 번호가 붙어 있다(번호는 1 부터 센다). 처음에는 모든 학생이 각자 혼자 동아리를 하나씩 이루고 있다. 명령 Q 개를 주어지는 순서대로 처리한다.

  - `1 a b` : a 번 학생이 속한 동아리와 b 번 학생이 속한 동아리를 하나로 합친다. 두 학생이 이미 같은 동아리에 있거나 a 와 b 가 같으면 아무 일도 일어나지 않는다.
  - `2 a` : 지금 a 번 학생이 속한 동아리의 인원 수를 출력한다. 인원 수에는 a 자신도 포함한다.

  예를 들어 1 번과 2 번을 합친 뒤 2 번과 3 번을 합치면 1, 2, 3 번은 한 동아리가 되고, 이때 `2 1` 의 답은 3 이다. 그 뒤에 `1 3 1` 이 와도 인원 수는 3 그대로다.

  입력
  첫 줄에 N 과 Q 가 공백으로 구분되어 주어진다. 다음 Q 줄에 명령이 한 줄에 하나씩 위 형식으로 주어진다.

  출력
  `2 a` 명령마다 그 답을 한 줄에 하나씩, 명령이 주어진 순서대로 출력한다.

  제약
  - 1 ≤ N ≤ 50000
  - 1 ≤ Q ≤ 60000
  - 1 ≤ a, b ≤ N
  - `2 a` 명령은 적어도 하나 주어진다.
skills:
- code: DISJOINT_SET
  role: PRIMARY
  weight: 1.0
commonMistakes:
- IMPLEMENTATION_MISC
- INPUT_PARSE
negativeControl:
  mistake: IMPLEMENTATION_MISC
  expectedStatus: WRONG_ANSWER
skillControl:
  approach: 합칠 때 두 학생 사이에 간선만 추가하고, 조회할 때마다 그 학생에서 BFS 로 연결된 학생 수를 센다.
