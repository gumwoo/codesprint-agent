# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "합치기 명령과 인원 조회 명령이 번갈아 들어온다. 조회할 때마다 연결된 학생을 처음부터 다시 세면 학생과 명령이 많을 때 시간이 모자란다."
  - level: 2
    text: "집합을 합치고 '어느 집합에 속하는가'를 빠르게 답하는 서로소 집합(Union-Find) 범주의 문제다."
  - level: 3
    text: "학생마다 자기 위의 학생을 가리키는 배열 하나와, 각 동아리의 대표 학생 자리에만 의미가 있는 인원 수 배열 하나를 둔다."
  - level: 4
    text: "합칠 때는 두 학생의 대표를 먼저 찾고, 대표가 같으면 아무것도 하지 않는다. 다르면 한 대표가 다른 대표를 가리키게 하고 인원 수를 새 대표 쪽에 더한다. 대표를 찾으며 지나온 학생들을 대표에 바로 연결해 두면 다음 탐색이 짧아진다."
  - level: 5
    text: "부모 배열을 자기 자신으로, 인원 배열을 1 로 초기화한다. 대표 찾기: 부모가 자신인 학생까지 올라간 뒤, 지나온 학생들의 부모를 그 대표로 바꾼다. 명령 1: 두 대표를 구해 다르면 작은 쪽 대표를 큰 쪽 대표 밑에 붙이고 인원을 더한다. 명령 2: 대표를 구해 그 대표의 인원을 출력 목록에 넣는다. 끝에 한 번에 출력한다."
