# 정본 형식: contracts/problem.schema.json
# 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# 기대 출력은 reference.py 를 실행해 만들었고, bruteForce 와 무작위 입력 30개에서 교차 검증했다.

code: P46_RANGE_SUM_QUERIES
title: 구간 합 질의
kind: NORMAL
source: DEV_FIXTURE
timeLimitMs: 2000
memoryLimitMb: 256
expectedSolveSeconds: 600
referenceComplexity: O(N + Q)
statement: |
  길이 N 인 정수 수열 A_1, A_2, ..., A_N 과 질의 Q 개가 주어진다. 각 질의는 두 정수 l, r 로 이루어지며, A_l + A_{l+1} + ... + A_r 의 값을 구해야 한다. 인덱스는 1 부터 센다.

  입력 형식
  - 첫 줄에 N 과 Q 가 공백으로 구분되어 주어진다. (1 ≤ N ≤ 100000, 1 ≤ Q ≤ 100000)
  - 둘째 줄에 A_1 부터 A_N 까지 N 개의 정수가 공백으로 구분되어 주어진다. (-10^9 ≤ A_i ≤ 10^9)
  - 다음 Q 개의 줄에 각 질의의 l 과 r 이 공백으로 구분되어 주어진다. (1 ≤ l ≤ r ≤ N)

  출력 형식
  - 질의마다 구간 합을 한 줄에 하나씩, 질의가 주어진 순서대로 출력한다.
skills:
- code: PREFIX_SUM
  role: PRIMARY
  weight: 0.7
- code: PYTHON_LIST_BASIC
  role: SECONDARY
  weight: 0.3
commonMistakes:
- INDEX_ERROR
- INPUT_PARSE
negativeControl:
  mistake: INDEX_ERROR
  expectedStatus: WRONG_ANSWER
skillControl:
  approach: 질의마다 리스트 슬라이스 a[l-1:r] 를 만들어 sum 으로 더한다.
