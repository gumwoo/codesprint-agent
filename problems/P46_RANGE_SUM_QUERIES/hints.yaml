# 단계별 힌트. 정본 형식: contracts/hint-ladder.schema.json
#
# H1 문제 관찰 포인트 / H2 알고리즘 범주 / H3 자료구조·상태 / H4 핵심 전이 / H5 의사코드
#
# 이 사다리는 문제 초안 생성기가 만들고 채택 검사가 받아 들였다(ADR-0032).
# H6(전체 풀이)는 여기 없다. reference.py 가 그것이다(ADR-0026).
hints:
  - level: 1
    text: "질의가 최대 100000 개이고 구간 길이도 최대 100000 이다. 질의마다 구간 원소를 하나씩 더하면 같은 원소를 수없이 다시 더하게 된다."
  - level: 2
    text: "수열을 한 번만 훑어 전처리해 두고, 각 질의는 상수 시간에 답하는 누적 합 기법을 쓴다."
  - level: 3
    text: "길이 N+1 인 배열 S 를 두고 S[0] = 0, S[i] 는 앞에서부터 i 개 원소의 합으로 정의한다."
  - level: 4
    text: "S[i] 는 S[i-1] 에 A_i 를 더해 얻는다. l 부터 r 까지의 합은 앞 r 개의 합에서 앞 l-1 개의 합을 뺀 값, 즉 S[r] - S[l-1] 이다."
  - level: 5
    text: "S[0] 을 0 으로 둔다 -> i 를 1 부터 N 까지 돌며 S[i] 를 S[i-1] + A_i 로 채운다 -> 각 질의 (l, r) 마다 S[r] - S[l-1] 을 결과 목록에 넣는다 -> 결과를 줄 단위로 한 번에 출력한다."
