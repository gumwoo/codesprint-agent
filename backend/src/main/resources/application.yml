spring:
  application:
    name: codesprint-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/codesprint}
    username: ${DB_USER:codesprint}
    password: ${DB_PASSWORD:codesprint}
  jpa:
    # 스키마는 Flyway 가 만든다. Hibernate 에게 맡기면 마이그레이션이 정본이
    # 아니게 되고, 운영에서 어떤 DDL 이 돌았는지 아무도 모르게 된다.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false

# 시각은 전부 UTC 로 다룬다. Evidence 의 occurredAt 에 시간대가 없으면
# 재계산이 순서를 잘못 잡는다 - ADR-0009.
server:
  port: ${PORT:8080}

codesprint:
  # 문제는 jar 에 넣지 않는다. 이 저장소의 것은 전부 DEV_FIXTURE 이고(ADR-0008)
  # 실서비스 문제은행은 여기 없다 - 배포물에 구워 넣으면 갈아끼울 때 재배포해야 한다.
  repo-root: ${CODESPRINT_REPO_ROOT:..}
  problems-dir: ${CODESPRINT_PROBLEMS_DIR:../problems}
  judge:
    python: ${CODESPRINT_PYTHON:python}
    # 하네스가 통째로 굳었을 때의 마지막 방어선. 컨테이너 안쪽 timeout 은
    # judge/run_submission.py 가 따로 건다.
    timeout-seconds: ${CODESPRINT_JUDGE_TIMEOUT:120}

  # Reviewer(LLM). **키가 없으면 붙지 않는다** - 분석 없이 나머지가 그대로 돈다.
  #
  # 키를 이 파일에 적지 않는다. 공개 저장소이고, 한 번 커밋되면 히스토리에서
  # 지우기 어렵다. 환경변수로만 받는다.
  reviewer:
    api-key: ${CODESPRINT_LLM_API_KEY:}
    model: ${CODESPRINT_LLM_MODEL:claude-sonnet-5}
    max-tokens: ${CODESPRINT_LLM_MAX_TOKENS:2048}
    timeout-seconds: ${CODESPRINT_LLM_TIMEOUT:60}
    # 프롬프트 파일 이름. 이 값이 그대로 promptVersion 으로 기록에 남는다.
    # 내용을 고칠 때는 새 파일을 만들고 이 값을 바꾼다 - 같은 이름으로 내용을
    # 바꾸면 이전 라벨과 이후 라벨이 섞여 정확도를 잴 수 없다.
    prompt-version: ${CODESPRINT_PROMPT_VERSION:reviewer-v1}
