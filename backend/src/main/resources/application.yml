spring:
  application:
    name: codesprint-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/codesprint}
    username: ${DB_USER:codesprint}
    password: ${DB_PASSWORD:codesprint}
  jpa:
    # 스키마는 Flyway 가 만든다. Hibernate 에게 맡기면 마이그레이션이 정본이
    # 아니게 되고, 운영에서 어떤 DDL 이 돌았는지 아무도 모르게 된다.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false

# 시각은 전부 UTC 로 다룬다. Evidence 의 occurredAt 에 시간대가 없으면
# 재계산이 순서를 잘못 잡는다 - ADR-0009.
server:
  port: ${PORT:8080}
