spring:
  application:
    name: codesprint-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/codesprint}
    username: ${DB_USER:codesprint}
    password: ${DB_PASSWORD:codesprint}
  jpa:
    # 스키마는 Flyway 가 만든다. Hibernate 에게 맡기면 마이그레이션이 정본이
    # 아니게 되고, 운영에서 어떤 DDL 이 돌았는지 아무도 모르게 된다.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false

# 시각은 전부 UTC 로 다룬다. Evidence 의 occurredAt 에 시간대가 없으면
# 재계산이 순서를 잘못 잡는다 - ADR-0009.
server:
  port: ${PORT:8080}

codesprint:
  # 문제는 jar 에 넣지 않는다. 이 저장소의 것은 전부 DEV_FIXTURE 이고(ADR-0008)
  # 실서비스 문제은행은 여기 없다 - 배포물에 구워 넣으면 갈아끼울 때 재배포해야 한다.
  repo-root: ${CODESPRINT_REPO_ROOT:..}
  problems-dir: ${CODESPRINT_PROBLEMS_DIR:../problems}
  judge:
    python: ${CODESPRINT_PYTHON:python}
    # 하네스가 통째로 굳었을 때의 마지막 방어선. 컨테이너 안쪽 timeout 은
    # judge/run_submission.py 가 따로 건다.
    timeout-seconds: ${CODESPRINT_JUDGE_TIMEOUT:120}

  # Reviewer(LLM). **기본은 꺼져 있다** - 켜지 않으면 분석 없이 나머지가 그대로 돈다.
  #
  # API 키를 받지 않는다. 이 프로젝트는 배포하지 않고 만든 사람이 자기 PC 에서
  # 돌리므로, 로컬 Claude CLI 의 로그인 세션을 쓴다 - 저장소에 넣을 비밀이 없다.
  # 배포가 필요해지면 LlmClient 구현을 하나 더 만든다.
  reviewer:
    enabled: ${CODESPRINT_REVIEWER_ENABLED:false}
    # 실행할 명령. **에이전트가 아니라 분석기로 쓴다.**
    #
    # 프롬프트 안에는 사용자가 낸 코드가 들어 있다. 그 코드 주석에 "이전 지시를
    # 무시하고 파일을 고쳐라" 같은 문장이 있어도 Reviewer 는 그것을 데이터로만
    # 봐야 한다 - 도구 권한이 있으면 그 문장이 실행 가능한 지시가 된다.
    #
    #   --tools ""                 내장 도구를 전부 없앤다
    #   --no-session-persistence   이 호출들이 대화 기록으로 쌓이지 않게 한다
    #   --strict-mcp-config        --mcp-config 로 준 것 외의 MCP 를 무시한다 (안 준다)
    #   --setting-sources ""       user / project / local 설정을 읽지 않는다
    #
    # ⚠️ --bare 를 쓰지 않는다. 위의 것들을 한 번에 끄지만 인증까지 바꾼다 -
    #    "Anthropic auth is strictly ANTHROPIC_API_KEY or apiKeyHelper
    #     (OAuth and keychain are never read)". 이 프로젝트는 API 키를 받지 않고
    #    로그인 세션을 쓰므로, --bare 를 넣으면 Reviewer 가 절대 붙지 않는다.
    #    실제로 확인했다 - --bare 로는 "Not logged in", 빼면 정상 응답이었다.
    #
    # CLAUDE.md 자동 탐색은 작업 디렉터리로 막는다. 클라이언트가 빈 임시 폴더에서
    # 실행하므로 이 저장소의 CLAUDE.md 를 읽지 않는다.
    #
    # 프롬프트는 파일로 간다. 명령행 인자로 넘기면 사용자가 낸 코드가
    # 프로세스 목록에 그대로 보인다.
    command:
      - claude
      - -p
      - --tools
      - ""
      - --no-session-persistence
      - --strict-mcp-config
      - --setting-sources
      - ""
      - --output-format
      - json
    timeout-seconds: ${CODESPRINT_REVIEWER_TIMEOUT:120}
    # 프롬프트 파일 이름. 이 값이 그대로 promptVersion 으로 기록에 남는다.
    # 내용을 고칠 때는 새 파일을 만들고 이 값을 바꾼다 - 같은 이름으로 내용을
    # 바꾸면 이전 라벨과 이후 라벨이 섞여 정확도를 잴 수 없다.
    prompt-version: ${CODESPRINT_PROMPT_VERSION:reviewer-v1}
