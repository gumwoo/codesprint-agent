name: Judge & Sandbox

# 사용자 코드를 실행하는 경계를 검증한다.
#
# 경로 필터를 건다. curriculum.yml 과 달리 이 잡은 Docker 이미지를 굽고 컨테이너를
# 수십 번 띄우므로 몇 분이 든다. 문서만 고친 PR 에 그 시간을 태우지 않는다.
# 대신 계약(contracts/)은 판정 결과의 형태를 정하므로 넓게 잡는다.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'judge/**'
      - 'problems/**'
      # 평가 케이스가 실제 채점과 같은지 여기서 본다(ADR-0016). 그 파일만 바뀌어도
      # 돌아야 한다.
      - 'tests/**'
      - 'contracts/**'
      - 'requirements-dev.txt'
      # Worker 는 백엔드의 마이그레이션으로 스키마를 만든다. 큐 테이블이 바뀌면
      # 여기가 먼저 깨져야 한다.
      - 'backend/src/main/resources/db/migration/**'
      - '.github/workflows/judge.yml'

concurrency:
  group: judge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  judge:
    name: 판정 + 격리 (Addendum 87)
    runs-on: ubuntu-latest

    # Worker 의 큐 동작은 실물 PostgreSQL 로만 검증할 수 있다.
    # FOR UPDATE SKIP LOCKED 를 흉내 낸 것으로 검증하면 아무것도 검증하지 않는 것과 같다.
    #
    # DB 이름을 codesprint_test 로 둔다. 그 테스트는 스키마를 통째로 지우므로,
    # 실서비스와 같은 이름을 쓰면 접속 설정 하나만 잘못돼도 그쪽이 날아간다.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: codesprint_test
          POSTGRES_USER: codesprint
          POSTGRES_PASSWORD: codesprint
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install deps
        run: pip install -r requirements-dev.txt

      - name: build judge image
        run: docker build -t codesprint-judge:py312 -f judge/Dockerfile .

      # 판정 8종과 격리 8종. 격리 쪽은 제한을 걷어낸 대조군까지 함께 돌려
      # "테스트가 아무것도 검증하지 못하는 상태"를 실패로 처리한다.
      #
      # ⚠️ 러너가 Docker-in-Docker 가 아니라 호스트 Docker 를 쓰므로, 여기서 도는
      #    컨테이너는 로컬과 같은 격리 옵션을 받는다. 러너 자체의 네트워크 정책에
      #    기대지 않는다 - 기대면 로컬에서만 뚫려 있어도 CI 는 초록불이 된다.
      - name: judge & sandbox tests
        run: python judge/tests/test_judge.py

      # 큐가 언어 경계다(ADR-0013). 여기서 확인하는 것은 판정 정확도가 아니라
      # 배정 · 리스 · 재시도 상한, 그리고 Worker 가 학습 상태를 건드리지 않는다는 것이다.
      - name: Judge Worker 큐 테스트
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: '5432'
          TEST_DB_NAME: codesprint_test
        run: python judge/tests/test_worker.py

      # 문제 데이터를 실제로 채점해 본다.
      # reference 가 AC 를 받는지보다 **wrong 이 걸리는지**가 중요하다 -
      # 아무것도 거르지 못하는 Test Case 집합도 reference 만으로는 통과한다.
      - name: 문제 데이터 채점 검증
        run: python tools/verify_problems.py

      # Reviewer 평가 케이스가 **실제 채점 결과와 같은가**(ADR-0016).
      #
      # 평가 자체는 여기서 돌리지 않는다 - 모델 호출은 느리고 비결정적이라 CI 에
      # 넣으면 모델이 그날 다르게 답했다는 이유로 관계없는 PR 이 빨개진다. 그리고
      # 이 저장소는 API 키를 받지 않아 CI 에는 부를 방법 자체가 없다.
      # 대신 모델에게 무엇을 보여주는지는 결정론적이므로 그쪽을 고정한다.
      - name: Reviewer 평가 케이스 검증
        run: python tools/gen_reviewer_eval_cases.py
