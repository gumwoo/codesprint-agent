    self_check: 계단을 한 칸 또는 두 칸씩 오르는 방법의 수를 dp로 정의해 보세요.

  - skill_code: DP_2D
    title: 두 상태를 표로 채우기
    summary: 상태가 (행, 열)이나 (i, j) 두 개면 2차원 표를 만들고, 이미 채운 칸만 보고 새 칸을 채우는 순서로 돈다.
    key_points:
      - 첫 행과 첫 열처럼 다른 칸을 볼 수 없는 칸의 값을 먼저 정한다.
      - 점화식이 참조하는 칸이 이미 채워진 순서(위에서 아래, 왼쪽에서 오른쪽)로 반복한다.
      - 경로를 전부 따라가면 경로 수만큼 걸려 입력이 조금만 커져도 끝나지 않는다.
    example: |
      for r in range(n):
          for c in range(m):
              if r == 0 and c == 0: continue
              up = dp[r - 1][c] if r else INF
              left = dp[r][c - 1] if c else INF
              dp[r][c] = grid[r][c] + min(up, left)
    self_check: 오른쪽과 아래로만 가는 격자에서 경로의 수가 얼마나 빨리 늘어나는지 어림해 보세요.

  - skill_code: STATE_SPACE_BFS
    title: 위치에 상태를 더한 BFS
