# Skill별 개념 복습 자료. 모든 검증된 Skill은 정확히 하나의 자료를 가진다.
concepts:
  - skill_code: PYTHON_LIST_BASIC
    title: Python 리스트 순회와 인덱스
    summary: 리스트는 0부터 시작하며 길이가 n이면 마지막 인덱스는 n-1이다.
    key_points:
      - 값과 인덱스 중 무엇이 필요한지 먼저 구분한다.
      - 인덱스가 필요하면 enumerate를 사용한다.
      - 빈 리스트와 마지막 원소의 경계를 확인한다.
    example: |
      values = [4, 7, 9]
      for index, value in enumerate(values):
          print(index, value)
    self_check: 길이가 n인 리스트의 유효한 인덱스 범위를 말해 보세요.

  - skill_code: PYTHON_DEQUE_BASIC
    title: 큐와 collections.deque
    summary: 먼저 들어온 값을 먼저 꺼내는 큐는 deque의 append와 popleft로 구현한다.
    key_points:
      - 뒤에 넣을 때 append, 앞에서 꺼낼 때 popleft를 사용한다.
      - list.pop(0)은 원소 이동 때문에 입력이 커지면 느려진다.
      - 큐가 빌 때까지 처리하는 종료 조건을 분명히 둔다.
    example: |
      from collections import deque
      queue = deque([start])
      while queue:
          current = queue.popleft()
    self_check: list.pop(0) 대신 deque.popleft를 쓰는 이유를 설명해 보세요.

  - skill_code: GRID_COORDINATE
    title: 2차원 격자의 좌표 모델
    summary: 격자는 보통 grid[row][column]으로 접근하며 row는 세로, column은 가로 위치다.
    key_points:
      - 행의 개수와 열의 개수를 각각 n과 m으로 구분한다.
      - 방향 벡터의 첫 값은 행, 둘째 값은 열 변화량으로 일관되게 쓴다.
      - 정사각형이라고 가정하지 말고 n과 m을 따로 검사한다.
    example: |
      for dr, dc in [(-1, 0), (1, 0), (0, -1), (0, 1)]:
          next_row, next_col = row + dr, col + dc
    self_check: 2행 5열 격자에서 grid[1][4]가 어느 칸인지 설명해 보세요.

  - skill_code: GRID_BOUNDARY_CHECK
    title: 격자 경계 검사
    summary: 다음 좌표를 배열에 사용하기 전에 행과 열이 각각 유효 범위에 있는지 확인한다.
    key_points:
      - 올바른 조건은 0 <= row < n 그리고 0 <= column < m이다.
      - Python의 음수 인덱스도 원소를 가리키므로 하한 검사가 필수다.
      - 경계 검사는 배열 접근보다 먼저 수행한다.
    example: |
      if not (0 <= next_row < n and 0 <= next_col < m):
          continue
      value = grid[next_row][next_col]
    self_check: 0 <= row <= n이 잘못된 이유를 설명해 보세요.

  - skill_code: BFS_BASIC
    title: 너비 우선 탐색의 기본
    summary: BFS는 큐를 사용해 시작점에서 가까운 정점부터 차례로 방문한다.
    key_points:
      - 시작점을 방문 처리한 뒤 큐에 넣는다.
      - 큐에서 하나를 꺼내 방문하지 않은 이웃을 추가한다.
      - 각 정점을 한 번만 넣으면 전체 탐색은 O(V+E)다.
    example: |
      visited[start] = True
      queue = deque([start])
      while queue:
          current = queue.popleft()
    self_check: 한 층의 정점들이 어떤 거리 순서를 보장하는지 설명해 보세요.

  - skill_code: BFS_VISITED_MANAGEMENT
    title: BFS 방문 상태의 기록 시점
    summary: 정점을 큐에 넣는 순간 방문 처리해야 같은 정점이 여러 번 들어가는 것을 막는다.
    key_points:
      - 방문 확인과 기록을 이웃을 발견하는 분기 안에서 함께 수행한다.
      - 큐에서 꺼낼 때 기록하면 여러 부모가 같은 정점을 중복 삽입할 수 있다.
      - 다중 시작점 BFS에서는 모든 시작점을 먼저 방문 처리한다.
    example: |
      if not visited[next_node]:
          visited[next_node] = True
          queue.append(next_node)
    self_check: 다이아몬드 모양 그래프에서 늦은 방문 처리가 만드는 중복을 추적해 보세요.

  - skill_code: BFS_GRID_TRAVERSAL
    title: 격자 BFS의 탐색 순서
    summary: 격자 BFS는 좌표를 정점으로, 상하좌우 이동 가능 관계를 간선으로 본다.
    key_points:
      - 시작 칸이 실제로 이동 가능한지 먼저 확인한다.
      - 다음 좌표마다 경계, 이동 가능 여부, 방문 여부를 검사한다.
      - 방문 배열에 개수나 거리를 저장해야 하는지 문제 요구를 구분한다.
    example: |
      queue = deque([(start_row, start_col)])
      visited[start_row][start_col] = True
      while queue:
          row, col = queue.popleft()
    self_check: 격자 문제의 정점과 간선이 각각 무엇인지 설명해 보세요.

  - skill_code: BFS_SHORTEST_PATH
    title: 가중치 없는 그래프의 최단 거리
    summary: 모든 간선 비용이 같으면 BFS가 처음 발견한 거리가 시작점에서의 최단 거리다.
    key_points:
      - 시작점 거리를 0으로 두고 이웃 거리를 현재 거리에 1을 더해 기록한다.
      - 방문과 거리 기록은 큐에 넣는 순간 함께 수행한다.
      - 도달하지 못한 정점의 표현값을 출력 요구와 구분한다.
    example: |
      distance = [-1] * node_count
      distance[start] = 0
      queue = deque([start])
    self_check: 간선 가중치가 서로 다르면 같은 BFS를 쓸 수 없는 이유를 설명해 보세요.

  # ── W2 · CORE-1 (ADR-0034) ──────────────────────────────────────────
  - skill_code: SIMULATION_STATE
    title: 상태를 정하고 규칙대로 바꾸기
    summary: 시뮬레이션은 "지금 상태"를 변수로 정해 두고, 명령 하나마다 그 상태를 규칙대로 바꾸는 일이다.
    key_points:
      - 상태를 이루는 값(위치, 방향, 점수 등)을 먼저 모두 적는다.
      - 명령 하나를 처리하는 규칙을 함수 하나로 분리하면 빠뜨린 경우가 드러난다.
      - 규칙을 적용하기 전에 범위를 벗어나는지, 무시해야 하는 명령인지 확인한다.
    example: |
      row, col, direction = 0, 0, 0
      for command in commands:
          if command == "R":
              direction = (direction + 1) % 4
    self_check: 방향을 0~3 정수로 두었을 때 왼쪽으로 한 번 도는 식을 써 보세요.

  - skill_code: MATRIX_TRANSFORM
    title: 칸의 새 위치 계산하기
    summary: 회전이나 전치는 원래 칸 (r, c)가 새 배열의 어느 칸으로 가는지 식 하나로 정하면 된다.
    key_points:
      - N×M 배열을 시계 방향으로 90도 돌리면 결과는 M×N이다.
      - 새 배열을 따로 만들고 원래 배열에서 읽기만 하면 덮어쓰기 실수가 없다.
      - 작은 예(2×3)로 칸 하나의 이동을 손으로 확인한 뒤 식을 일반화한다.
    example: |
      rotated = [[0] * n for _ in range(m)]
      for r in range(n):
          for c in range(m):
              rotated[c][n - 1 - r] = grid[r][c]
    self_check: 2×3 배열을 시계 방향으로 돌렸을 때 (0, 2)가 어디로 가는지 계산해 보세요.

  - skill_code: MATRIX_TRAVERSAL
    title: 정해진 순서로 모든 칸 방문하기
    summary: 대각선 · 지그재그 · 나선 순회는 방문 순서를 만드는 규칙과 멈추는 조건을 분리해서 생각한다.
    key_points:
      - 같은 대각선 위의 칸은 r + c(또는 r - c)가 같다.
      - 나선 순회는 위 · 아래 · 왼쪽 · 오른쪽 경계를 하나씩 좁혀 가며 돈다.
      - 방문한 칸 수가 N×M이 되면 끝난다는 조건으로 중복과 누락을 확인한다.
    example: |
      for s in range(n + m - 1):
          for r in range(n):
              c = s - r
              if 0 <= c < m:
                  visit(r, c)
    self_check: 3×4 배열에서 r + c = 3 인 칸을 모두 적어 보세요.

  - skill_code: STRING_MANIPULATION
    title: 문자 단위로 문자열 다루기
    summary: 파이썬 문자열은 바꿀 수 없으므로 새 문자열을 만들거나 리스트로 모아 join 한다.
    key_points:
      - s[::-1]은 뒤집은 새 문자열이고, 원래 s는 바뀌지 않는다.
      - 반복문에서 문자열을 += 로 이어 붙이기보다 리스트에 모아 한 번에 join 한다.
      - 대소문자를 무시하라는 조건이 있으면 비교 전에 한쪽으로 맞춘다.
    example: |
      parts = []
      for ch in text:
          parts.append(ch.upper() if ch.islower() else ch.lower())
      print("".join(parts))
    self_check: '"aaabcc"를 연속 문자 압축하면 무엇이 되는지, 그 과정을 설명해 보세요.'

  - skill_code: STRING_PARSING
    title: 형식이 있는 문자열 해석하기
    summary: 먼저 구분자로 토큰을 나누고, 토큰마다 무엇(숫자 · 이름 · 기호)인지 판단한 뒤 계산한다.
    key_points:
      - split()은 공백 여러 개를 하나로 보지만 split(" ")은 빈 토큰을 만든다.
      - 숫자 토큰은 int()로 바꾸기 전에 부호나 앞의 0 같은 형식 조건을 확인한다.
      - 해석 단계와 계산 단계를 나누면 어느 쪽이 틀렸는지 찾기 쉽다.
    example: |
      name, score = line.split(":")
      total[name.strip()] += int(score)
    self_check: '"a,,b".split(",")의 결과가 무엇인지 말해 보세요.'

  - skill_code: HASH_SET_MEMBERSHIP
    title: set으로 존재 여부 답하기
    summary: 리스트의 in은 처음부터 끝까지 찾지만 set의 in은 평균적으로 한 번에 찾는다.
    key_points:
      - 질의가 많으면 찾을 대상을 먼저 set으로 만들어 둔다.
      - 리스트 in 을 Q번 하면 N×Q 번 비교한다. N과 Q가 10만이면 100억 번이다.
      - set에는 순서와 중복이 없다. 개수가 필요하면 dict나 Counter를 쓴다.
    example: |
      seen = set(values)
      for query in queries:
          print(1 if query in seen else 0)
    self_check: N=100000, Q=100000일 때 리스트 in과 set in의 비교 횟수를 어림해 보세요.

  - skill_code: HASH_MAP_COUNTING
    title: 한 번 훑으며 키별로 모으기
    summary: dict나 Counter에 키별 개수 · 합계를 쌓으면 입력을 한 번만 훑고도 모든 키의 값을 얻는다.
    key_points:
      - 키마다 list.count()를 부르면 키 수 × 전체 길이만큼 센다.
      - dict.get(key, 0) + 1 이나 Counter로 한 번에 센다.
      - 가장 많은 키를 고를 때 동점 규칙(사전순 등)을 문제에서 확인한다.
    example: |
      from collections import Counter
      counts = Counter(words)
      best = min(counts, key=lambda w: (-counts[w], w))
    self_check: 동점일 때 사전순으로 가장 앞선 단어를 고르는 key를 설명해 보세요.

  - skill_code: SORT_CUSTOM_KEY
    title: 여러 기준으로 정렬 key 만들기
    summary: sorted의 key가 튜플을 돌려주면 앞의 원소부터 차례로 비교한다. 내림차순 숫자는 부호를 바꿔 넣는다.
    key_points:
      - 기준을 우선순위대로 적고 그 순서대로 튜플을 만든다.
      - 숫자 내림차순은 -value, 문자열 내림차순은 reverse나 두 번 정렬로 처리한다.
      - 파이썬 정렬은 안정 정렬이라 같은 key의 원래 순서가 유지된다.
    example: |
      people.sort(key=lambda p: (-p.score, p.age, p.name))
    self_check: 점수 내림차순, 같으면 이름 오름차순으로 정렬하는 key를 써 보세요.

  - skill_code: SORT_THEN_SCAN
    title: 정렬해서 이웃끼리만 보기
    summary: 정렬하면 비교해야 할 후보가 바로 옆에 모이므로, 모든 쌍 대신 이웃끼리만 확인하면 된다.
    key_points:
      - 모든 쌍 비교는 N²이고, 정렬 후 한 번 훑기는 N log N이다.
      - 최소 차이는 정렬했을 때 이웃한 쌍 중에서 반드시 나온다. 같은 값이 여럿이면 이웃하지 않은 쌍도 같은 차이일 수 있다.
      - 구간 문제는 시작점으로 정렬하면 겹침 여부를 직전 구간과만 비교해도 된다.
    example: |
      values.sort()
      best = min(b - a for a, b in zip(values, values[1:]))
    self_check: 정렬 후 최소 차이가 왜 이웃한 쌍에서 나오는지, [5, 5, 5]에서는 차이 0인 쌍이 몇 개인지 설명해 보세요.

  - skill_code: STACK_BASIC
    title: 나중에 넣은 것부터 꺼내는 스택
    summary: 괄호 짝이나 되돌리기처럼 "가장 최근에 연 것"을 먼저 닫아야 하는 구조는 스택으로 처리한다.
    key_points:
      - 리스트의 append와 pop()이 스택의 넣기와 꺼내기다.
      - 닫는 기호가 나오면 스택이 비었는지 먼저 확인한다.
      - 끝났을 때 스택에 남은 것이 있으면 짝이 맞지 않은 것이다.
    example: |
      pairs = {")": "(", "]": "["}
      stack = []
      for ch in text:
          if ch in "([":
              stack.append(ch)
          elif not stack or stack.pop() != pairs[ch]:
              return False
      return not stack
    self_check: '"([)]"가 올바르지 않은 이유를 스택 상태로 설명해 보세요.'

  - skill_code: BRUTE_FORCE_ENUMERATION
    title: 경우의 수를 어림하고 전부 확인하기
    summary: 가능한 후보를 전부 만들어도 시간 안에 끝나는지 먼저 계산하고, 끝나면 빠짐없이 검사한다.
    key_points:
      - 파이썬은 1초에 대략 천만 번 안팎의 단순 연산을 한다고 어림한다.
      - 반복문이 몇 겹인지와 각 범위를 곱해 전체 횟수를 계산한다.
      - 후보를 만드는 부분과 조건을 검사하는 부분을 나눠 둔다.
    example: |
      count = 0
      for a in range(1, n + 1):
          for b in range(a, n + 1):
              if a * b == target:
                  count += 1
    self_check: N=1000일 때 위 이중 반복이 몇 번 도는지 어림해 보세요.

  - skill_code: COMBINATORIAL_ENUMERATION
    title: 순열 · 조합 · 부분집합 만들기
    summary: 순서가 중요하면 순열, 중요하지 않으면 조합, 고를지 말지를 전부 보면 부분집합이다.
    key_points:
      - itertools.permutations / combinations / product를 쓰면 빠짐없이 만든다.
      - 부분집합은 2^N개, 순열은 N!개라 N이 작을 때만 전부 만들 수 있다.
      - 같은 값이 여러 번 있으면 결과에 중복이 생기므로 set으로 걸러야 하는지 확인한다.
    example: |
      from itertools import combinations
      for pick in combinations(cards, 3):
          check(pick)
    self_check: 원소 10개에서 3개를 고르는 조합과 순열의 개수를 각각 계산해 보세요.

  # ── W3 · CORE-2 (ADR-0034) ──────────────────────────────────────────
  - skill_code: HEAP_PRIORITY
    title: 힙으로 가장 작은 값 꺼내기
    summary: heapq는 넣고 꺼낼 때마다 전체를 정렬하지 않고도 가장 작은 값을 맨 앞에 유지한다.
    key_points:
      - heappush와 heappop은 원소 수가 N일 때 log N 번 정도만 비교한다.
      - 꺼낼 때마다 min()을 부르거나 sort()를 다시 하면 매번 N번을 본다.
      - 가장 큰 값이 필요하면 부호를 바꿔 넣고, 여러 기준이면 튜플로 넣는다.
    example: |
      import heapq
      heap = []
      heapq.heappush(heap, (cost, name))
      smallest_cost, name = heapq.heappop(heap)
    self_check: 최댓값을 꺼내는 힙을 heapq로 만드는 방법을 설명해 보세요.

