  - skill_code: MATH_GCD_LCM
    title: 유클리드 호제법
    summary: gcd(a, b) = gcd(b, a % b)를 b가 0이 될 때까지 반복하면 큰 수도 몇십 번 만에 끝난다.
    key_points:
      - math.gcd가 같은 일을 한다.
      - lcm(a, b) = a // gcd(a, b) * b 로 구한다. 곱을 먼저 하면 수가 커진다(파이썬은 넘치지 않지만 느려진다).
      - 작은 수부터 하나씩 나눠 보면 수가 10^12일 때 너무 오래 걸린다.
    example: |
      def gcd(a, b):
          while b:
              a, b = b, a % b
          return a
    self_check: gcd(48, 18)을 호제법으로 단계별로 계산해 보세요.

  - skill_code: NUMBER_BASE_CONVERSION
    title: 자릿수와 진법 바꾸기
    summary: 10진수를 b진법으로 바꾸려면 b로 나눈 나머지를 모으고 몫으로 계속 나눈다. 모은 나머지를 거꾸로 읽는다.
    key_points:
      - 0은 따로 처리한다. 반복문이 한 번도 돌지 않는다.
      - b진법 문자열을 10진수로 바꿀 때는 앞에서부터 value = value * b + digit 으로 쌓는다.
      - 10보다 큰 자릿값은 A, B, ... 처럼 약속한 문자로 쓴다.
    example: |
      DIGITS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ"
      digits = []
      while n > 0:
          digits.append(n % base)
          n //= base
      print("".join(DIGITS[d] for d in reversed(digits)) or "0")
    self_check: 13을 2진법으로 바꾸는 과정을 나머지로 적어 보세요.

