  - skill_code: GRAPH_CYCLE_DETECTION
    title: 사이클 찾기
    summary: 방향 그래프에서는 "지금 탐색 중인 경로 위의 정점"을 다시 만나면 사이클이다. 이미 끝난 정점을 만나는 것은 사이클이 아니다.
    key_points:
      - 상태를 셋으로 둔다. 방문 전, 탐색 중, 탐색 완료.
      - 무방향 그래프에서는 바로 온 부모 정점으로 돌아가는 간선을 사이클로 세지 않는다.
      - 연결되지 않은 부분이 있으면 모든 시작점에서 한 번씩 확인한다.
      - 진입 차수를 줄여 가는 방법(방향)이나 union-find(무방향)로도 같은 판정을 낼 수 있다.
    example: |
      def has_cycle(node):
          state[node] = 1
          for nxt in graph[node]:
              if state[nxt] == 1 or (state[nxt] == 0 and has_cycle(nxt)):
                  return True
          state[node] = 2
          return False
    self_check: 방향 그래프에서 "탐색 완료" 정점을 다시 만나도 사이클이 아닌 이유를 설명해 보세요.

  - skill_code: TREE_TRAVERSAL
    title: 루트에서 내려가며 트리 정보 모으기
    summary: 루트에서 DFS나 BFS로 내려가면 부모와 깊이가 정해지고, 돌아오면서 서브트리 크기를 모은다.
    key_points:
      - 간선이 방향 없이 주어지면 부모로 돌아가는 간선을 건너뛴다.
      - 서브트리 크기는 자식들의 크기를 모두 더한 뒤 자기 자신 1을 더한다.
      - 리프는 부모를 뺀 이웃이 없는 정점이다.
    example: |
      def walk(node, parent):
          size[node] = 1
          for child in graph[node]:
              if child != parent:
                  depth[child] = depth[node] + 1
                  walk(child, node)
                  size[node] += size[child]
    self_check: 루트를 바꾸면 깊이와 서브트리 크기 중 무엇이 달라지는지 설명해 보세요.

  - skill_code: DP_1D
    title: 작은 답을 저장해 다시 쓰기
    summary: dp[i]가 무엇을 뜻하는지 한 문장으로 정하고, dp[i]를 더 작은 i의 값으로 나타내는 점화식을 세운다.
    key_points:
      - 상태 정의, 점화식, 시작값, 계산 순서를 차례로 적는다.
      - 메모 없이 재귀하면 같은 dp[i]를 여러 번 다시 계산해 지수 시간이 된다.
      - 답이 dp[n]인지, dp 전체의 최댓값인지 문제에 맞게 고른다.
    example: |
      dp = [0] * (n + 1)
      dp[0] = dp[1] = 1
      for i in range(2, n + 1):
