    self_check: 칸 단위로만 방문을 표시하면 벽 부수기 문제에서 무엇이 틀리는지 설명해 보세요.

  # ── W6a · INTERMEDIATE 그래프 (ADR-0040) ────────────────────────────
  - skill_code: DIJKSTRA
    title: 가장 가까운 정점부터 확정하기
    summary: 가중치가 음이 아니면, 아직 확정하지 않은 정점 중 거리가 가장 짧은 정점의 거리는 더 줄어들 수 없다. 힙으로 그 정점을 꺼내 확정하고 이웃을 갱신한다.
    key_points:
      - 힙에서 꺼낸 거리가 이미 기록된 거리보다 크면 오래된 항목이라 건너뛴다.
      - 음수 간선이 있으면 이 성질이 깨진다. 그때는 벨만-포드를 쓴다.
      - 매번 모든 정점을 훑어 가장 가까운 것을 찾으면 정점 수의 제곱만큼 걸린다.
    example: |
      dist[start] = 0
      heap = [(0, start)]
      while heap:
          d, node = heapq.heappop(heap)
          if d > dist[node]:
              continue
          for nxt, w in graph[node]:
              if d + w < dist[nxt]:
                  dist[nxt] = d + w
                  heapq.heappush(heap, (dist[nxt], nxt))
    self_check: 힙에서 꺼낸 거리가 기록보다 클 때 건너뛰어도 되는 이유를 설명해 보세요.

  - skill_code: FLOYD_WARSHALL
    title: 거쳐 가는 정점을 하나씩 늘리기
    summary: dist[i][j]를 "정점 0..k 만 거쳐 가는 최단 거리"로 보고 k를 하나씩 늘리면 모든 쌍의 최단 거리가 나온다.
    key_points:
      - 가장 바깥 반복이 거쳐 가는 정점 k다. 순서를 바꾸면 틀린다.
      - 정점 수가 N이면 N³ 번 계산하므로 N이 수백 이하일 때만 쓴다.
      - 갈 수 없는 쌍은 무한대로 두고 더할 때 넘치지 않게 한다.
      - 정점마다 다익스트라를 돌려도 같은 답이 나온다. 음수 간선이 있으면 그 방법은 쓸 수 없고 이 방법은 쓸 수 있다.
    example: |
      for k in range(n):
          for i in range(n):
              for j in range(n):
                  if dist[i][k] + dist[k][j] < dist[i][j]:
                      dist[i][j] = dist[i][k] + dist[k][j]
    self_check: 반복의 가장 바깥이 k가 아니면 어떤 경로를 놓치는지 설명해 보세요.

  - skill_code: BELLMAN_FORD
    title: 음수 간선과 음수 사이클
    summary: 모든 간선을 N-1번 완화하면 음수 간선이 있어도 최단 거리가 정해진다. N번째에도 줄어드는 거리가 있으면 음수 사이클이다.
    key_points:
      - 시작점에서 갈 수 없는 정점은 완화하지 않는다(무한대에 음수를 더하지 않는다).
      - 음수 사이클이 시작점에서 도달 가능한지를 문제 조건과 맞춰 본다.
      - 간선 목록 전체를 한 번 도는 것을 한 라운드로 센다.
    example: |
      for _ in range(n - 1):
          for u, v, w in edges:
              if dist[u] != INF and dist[u] + w < dist[v]:
                  dist[v] = dist[u] + w
    self_check: N-1번이면 충분한 이유를 경로의 간선 수로 설명해 보세요.

  - skill_code: DISJOINT_SET
    title: 대표를 따라가는 서로소 집합
    summary: 각 원소가 부모를 가리키고, 부모를 끝까지 따라간 원소를 집합의 대표로 삼는다. 두 원소의 대표가 같으면 같은 집합이다.
    key_points:
      - 대표를 찾으며 지나간 원소가 대표를 바로 가리키게 하면(경로 압축) 다음 찾기가 빨라진다.
      - 합칠 때는 두 대표 중 하나가 다른 하나를 가리키게 한다.
      - 파이썬에서는 재귀 대신 반복으로 대표를 찾으면 깊이 제한에 걸리지 않는다.
    example: |
      def find(x):
          root = x
          while parent[root] != root:
              root = parent[root]
          while parent[x] != root:
              parent[x], x = root, parent[x]
          return root
    self_check: 경로 압축이 없으면 어떤 입력에서 찾기가 느려지는지 예를 들어 보세요.

  - skill_code: MINIMUM_SPANNING_TREE
    title: 사이클을 만들지 않는 가장 싼 간선
    summary: 간선을 가중치 순으로 보며, 두 끝이 아직 다른 집합일 때만 고르면 최소 신장 트리가 된다(크루스칼).
    key_points:
      - 두 끝이 같은 집합이면 그 간선은 사이클을 만든다. 서로소 집합으로 바로 확인한다.
      - 정점이 N개면 간선 N-1개를 고른 순간 끝난다.
      - 그래프가 연결돼 있지 않으면 신장 트리가 없다. 고른 간선 수로 확인한다.
    example: |
      edges.sort()
      total = picked = 0
      for w, u, v in edges:
          if find(u) != find(v):
              union(u, v)
              total += w
              picked += 1
    self_check: 가장 싼 간선부터 고르는 것이 왜 최소가 되는지 사이클 성질로 설명해 보세요.

  - skill_code: TOPOLOGICAL_ORDER
    title: 들어오는 간선이 없는 것부터
    summary: 선행 작업이 모두 끝난(들어오는 간선이 0인) 작업을 꺼내고, 그 작업에서 나가는 간선을 지워 가며 순서를 만든다.
    key_points:
      - 들어오는 간선 수(indegree)를 먼저 센다.
      - 여럿 중 번호가 작은 것부터 꺼내라는 조건이 있으면 큐 대신 힙을 쓴다.
      - 꺼낸 작업 수가 전체보다 적으면 사이클이 있어 순서를 정할 수 없다.
      - DFS 로 탐색을 마친 순서를 거꾸로 읽어도 위상 순서가 된다. 탐색 중인 정점을 다시 만나면 사이클이다.
    example: |
      ready = [v for v in range(1, n + 1) if indegree[v] == 0]
      order = []
      while ready:
          v = ready.pop()
          order.append(v)
          for nxt in graph[v]:
              indegree[nxt] -= 1
              if indegree[nxt] == 0:
                  ready.append(nxt)
    self_check: 꺼낸 작업 수가 전체보다 적을 때 무엇이 남아 있는지 설명해 보세요.

  # ── W6b · INTERMEDIATE DP · 수열 · 단조 스택 (ADR-0041) ─────────────────
  - skill_code: BITMASK_DP
    title: 고른 것들의 집합을 정수 하나로
    summary: 원소가 n 개면 고른 원소의 집합은 0 부터 2^n - 1 까지의 정수 하나로 쓸 수 있다. i 번째 비트가 1 이면 i 를 골랐다는 뜻이다. 집합과 마지막 원소를 상태로 두면 같은 상태를 한 번만 계산한다.
    key_points:
      - i 번 원소가 집합에 있는지는 mask >> i & 1, 넣은 집합은 mask | 1 << i 로 쓴다.
      - 상태 수는 2^n × n, 전이까지 세면 2^n × n² 이다. 파이썬에서는 n 이 13~15 정도까지다. 순서를 전부 시도하면 n! 이다.
      - 작은 집합에서 큰 집합으로 채우면 mask 를 0 부터 차례로 돌기만 하면 된다. 넣은 집합은 늘 더 큰 수다.
    example: |
      INF = float("inf")
      dp = [[INF] * n for _ in range(1 << n)]
      dp[1][0] = 0
      for mask in range(1 << n):
          for last in range(n):
              if dp[mask][last] == INF:
                  continue
              for nxt in range(n):
                  if not mask >> nxt & 1:
                      new = mask | 1 << nxt
                      dp[new][nxt] = min(dp[new][nxt], dp[mask][last] + cost[last][nxt])
    self_check: 원소가 3 개일 때 mask 5 가 어떤 원소들의 집합인지, 거기에 1 번을 넣으면 mask 가 얼마인지 말해 보세요.

  - skill_code: LIS_NLOGN
    title: 길이마다 가장 작은 끝값
    summary: tails[k] 를 길이 k+1 인 증가 부분 수열이 끝날 수 있는 가장 작은 값으로 둔다. tails 는 늘 증가하므로, 새 원소 x 가 들어갈 자리를 이분 탐색으로 찾아 그 자리를 x 로 바꾸거나 끝에 붙인다.
    key_points:
      - 답은 tails 의 길이다. tails 자체는 실제 부분 수열이 아닐 수 있다.
      - 엄격히 증가하면 x 이상이 처음 나오는 자리(bisect_left), 같아도 되면 x 초과가 처음 나오는 자리(bisect_right)다.
      - 원소마다 앞의 원소를 전부 보는 DP 는 N² 이다. N 이 수십만이면 끝나지 않는다.
      - 값을 압축해 펜윅 트리에 "그 값으로 끝나는 가장 긴 길이" 의 최댓값을 두어도 N log N 이다.
    example: |
      from bisect import bisect_left
      tails = []
      for x in a:
          i = bisect_left(tails, x)
          if i == len(tails):
              tails.append(x)
          else:
              tails[i] = x
      print(len(tails))
    self_check: 수열 3 1 4 1 5 9 2 6 에서 원소를 하나씩 넣을 때 tails 가 어떻게 바뀌는지 적어 보세요.

  - skill_code: EDIT_DISTANCE
    title: 앞부분끼리의 최소 연산 수
    summary: dp[i][j] 를 a 의 앞 i 글자를 b 의 앞 j 글자로 바꾸는 최소 연산 수로 둔다. 마지막 글자가 같으면 그대로 두고, 다르면 삭제 · 삽입 · 교체 중 가장 싼 것에 1 을 더한다.
    key_points:
      - 빈 문자열로 바꾸려면 글자 수만큼 지운다. dp[i][0] = i, dp[0][j] = j 다.
      - 교체는 dp[i-1][j-1] + 1, 삭제는 dp[i-1][j] + 1, 삽입은 dp[i][j-1] + 1 이다.
      - 같은 (i, j) 를 다시 계산하는 재귀는 길이가 스물만 넘어도 끝나지 않는다. 표를 한 번씩만 채운다.
    example: |
      n, m = len(a), len(b)
      dp = [[0] * (m + 1) for _ in range(n + 1)]
      for i in range(n + 1):
          dp[i][0] = i
      for j in range(m + 1):
          dp[0][j] = j
      for i in range(1, n + 1):
          for j in range(1, m + 1):
              if a[i - 1] == b[j - 1]:
                  dp[i][j] = dp[i - 1][j - 1]
              else:
                  dp[i][j] = 1 + min(dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1])
      print(dp[n][m])
    self_check: kitten 을 sitting 으로 바꾸는 최소 연산 수와 그 연산들을 적어 보세요.

  - skill_code: ZERO_ONE_KNAPSACK
    title: 넣거나 넣지 않거나
    summary: best[c] 를 용량 c 이하로 담을 수 있는 최대 가치로 두고, 물건을 하나씩 보며 갱신한다. 물건마다 한 번만 쓸 수 있으므로 용량을 큰 쪽에서 작은 쪽으로 돈다.
    key_points:
      - 작은 용량부터 돌면 방금 넣은 물건을 같은 차례에 다시 넣게 된다. 그러면 개수 제한 없는 배낭이 된다.
      - 표의 크기는 물건 수 × 용량이다. 용량이 수십억이면 이 방법을 쓸 수 없다.
      - 조합을 전부 시도하면 2^N 이다. 물건이 40 개면 1 조가 넘는다.
    example: |
      best = [0] * (cap + 1)
      for w, v in items:
          for c in range(cap, w - 1, -1):
              best[c] = max(best[c], best[c - w] + v)
      print(best[cap])
    self_check: 용량을 작은 쪽부터 돌면 무게 2 가치 3 인 물건 하나로 용량 4 에서 얼마가 나오는지 계산해 보세요.

  - skill_code: UNBOUNDED_KNAPSACK
    title: 같은 것을 몇 번이든
    summary: 같은 동전 · 물건을 몇 번이든 쓸 수 있으면 금액을 작은 쪽부터 채운다. 금액 c 의 값은 c 에서 동전 하나를 뺀 금액의 값으로 정해진다.
    key_points:
      - 최소 개수는 dp[c] = min(dp[c - coin] + 1), 경우의 수는 dp[c] += dp[c - coin] 이다.
      - 경우의 수에서 동전을 바깥 반복에 두면 조합(순서 무시), 금액을 바깥에 두면 순열(순서 구분)을 센다.
      - 만들 수 없는 금액은 무한대로 두고 마지막에 따로 확인한다.
    example: |
      INF = float("inf")
      dp = [0] + [INF] * amount
      for c in range(1, amount + 1):
          for coin in coins:
              if coin <= c and dp[c - coin] + 1 < dp[c]:
                  dp[c] = dp[c - coin] + 1
      print(dp[amount] if dp[amount] != INF else -1)
    self_check: 동전 1, 2 로 금액 3 을 만드는 경우의 수를 조합으로 세면 몇이고 순열로 세면 몇인지 말해 보세요.

  - skill_code: COORDINATE_COMPRESSION
    title: 값을 순위로 바꾸기
    summary: 값이 10^9 까지 커도 서로 다른 값이 N 개뿐이면, 정렬한 뒤 각 값을 그 순위로 바꿔 크기 N 인 배열의 인덱스로 쓴다. 크기 비교는 그대로 남는다.
    key_points:
      - 중복을 빼고 정렬한 목록을 만든다. sorted(set(values)).
      - 값에서 순위는 사전으로 찾거나, 정렬한 목록에서 이분 탐색으로 찾는다.
      - 값 사이의 거리는 사라진다. 거리가 필요한 문제면 압축한 좌표로 원래 값을 다시 찾아 쓴다.
    example: |
      order = sorted(set(values))
      rank = {v: i for i, v in enumerate(order)}
      compressed = [rank[v] for v in values]
    self_check: 값 1000000000, -5, 7, 7 을 압축한 결과를 적어 보세요.

  - skill_code: MONOTONIC_STACK
    title: 아직 답을 못 찾은 원소들
    summary: 다음 큰 원소를 찾을 때, 아직 자기보다 큰 원소를 만나지 못한 원소들을 스택에 둔다. 스택의 값은 위로 갈수록 작다. 새 원소가 스택 위의 원소보다 크면 그것이 그 원소의 답이므로 꺼낸다.
    key_points:
      - 원소마다 스택에 한 번 들어가고 한 번 나오므로 전체가 N 번이다.
      - 값이 아니라 인덱스를 넣으면 답의 위치와 거리까지 알 수 있다.
      - 같은 값을 답으로 볼지는 꺼내는 비교가 < 인지 <= 인지로 정해진다.
      - 스택 없이 "오른쪽 이웃의 답" 으로 건너뛰며 찾아도 같다. 건너뛰는 사슬이 곧 스택의 내용이다.
      - 구간 최댓값 표(sparse table)로 N log N 에 찾을 수도 있지만, 스택은 같은 일을 N 번에 한다.
    example: |
      answer = [-1] * n
      stack = []
      for i, x in enumerate(a):
          while stack and a[stack[-1]] < x:
              answer[stack.pop()] = x
          stack.append(i)
    self_check: 수열 2 1 5 3 4 에서 스택이 어떻게 바뀌고 각 원소의 답이 언제 정해지는지 적어 보세요.

  # ── W6c · INTERMEDIATE 수학 · 문자열 · 스위핑 · 기하 (ADR-0042) ─────────────
  - skill_code: PRIME_SIEVE
    title: 배수를 지워 남는 수
    summary: 2 부터 N 까지를 모두 소수 후보로 두고, 아직 남아 있는 가장 작은 수 p 의 배수를 p*p 부터 지운다. p*p 가 N 을 넘으면 남은 수가 전부 소수다.
    key_points:
      - p 의 배수 중 p*p 보다 작은 것은 더 작은 소수가 이미 지웠다.
      - 전체 작업량은 N log log N 이다. 수마다 제곱근까지 나누어 보면 N √N 이다.
      - 0 과 1 은 소수가 아니다. 처음부터 지워 둔다.
    example: |
      is_prime = [True] * (n + 1)
      is_prime[0] = is_prime[1] = False
      p = 2
      while p * p <= n:
          if is_prime[p]:
              for k in range(p * p, n + 1, p):
                  is_prime[k] = False
          p += 1
    self_check: N = 30 일 때 p = 2, 3, 5 가 각각 지우는 수를 적고, 7 은 왜 지울 필요가 없는지 말해 보세요.

  - skill_code: SMALLEST_PRIME_FACTOR
    title: 가장 작은 소인수를 적어 두기
    summary: 체를 돌면서 수마다 처음 자기를 지운 소수(가장 작은 소인수)를 적어 둔다. 그러면 어떤 수든 그 소인수로 나누고, 몫의 가장 작은 소인수로 또 나누기를 되풀이해 소인수분해가 끝난다.
    key_points:
      - 표를 한 번 만들면 질의마다 소인수 개수만큼(최대 log N 번)만 나눈다.
      - 표를 만들 때 아직 적힌 값이 없는 칸에만 적어야 가장 작은 소인수가 남는다.
      - 표의 크기가 상한만큼 필요하므로 상한이 수천만을 넘으면 메모리를 따져 본다.
    example: |
      spf = list(range(n + 1))
      p = 2
      while p * p <= n:
          if spf[p] == p:
              for k in range(p * p, n + 1, p):
                  if spf[k] == k:
                      spf[k] = p
          p += 1
      factors = []
      while x > 1:
          factors.append(spf[x])
          x //= spf[x]
    self_check: 표를 따라 360 을 소인수분해하는 과정을 나누는 순서대로 적어 보세요.

  - skill_code: BINOMIAL_MOD
    title: 팩토리얼과 역원을 미리
    summary: 소수 p 로 나눈 나머지에서 nCr = n! / (r! (n-r)!) 은 나눗셈 대신 역원을 곱한다. 팩토리얼을 상한까지 한 번 구하고, 가장 큰 팩토리얼의 역원을 페르마의 소정리로 구한 뒤 거꾸로 내려오며 나머지 역원을 채운다.
    key_points:
      - p 가 소수이고 a 가 p 의 배수가 아니면 a 의 역원은 a^(p-2) mod p 다. pow(a, p - 2, p).
      - inv_fact[k-1] = inv_fact[k] * k 로 내려오면 역원을 한 번만 거듭제곱으로 구한다.
      - r < 0 이거나 r > n 이면 0 이다.
    example: |
      MOD = 10**9 + 7
      fact = [1] * (n + 1)
      for i in range(1, n + 1):
          fact[i] = fact[i - 1] * i % MOD
      inv_fact = [1] * (n + 1)
      inv_fact[n] = pow(fact[n], MOD - 2, MOD)
      for i in range(n, 0, -1):
          inv_fact[i - 1] = inv_fact[i] * i % MOD
      def comb(a, b):
          if b < 0 or b > a:
              return 0
          return fact[a] * inv_fact[b] % MOD * inv_fact[a - b] % MOD
    self_check: 5C2 를 이 방법으로 계산할 때 곱하는 세 값이 무엇인지 적어 보세요.

  - skill_code: TRIE_PREFIX
    title: 글자마다 한 칸씩 내려가는 나무
    summary: 뿌리에서 시작해 문자열의 글자마다 자식으로 내려가며 넣는다. 접두사가 같은 문자열은 같은 경로를 공유하므로, 노드마다 그 아래를 지나간 문자열 수를 적어 두면 접두사 질의를 접두사 길이만큼만 내려가서 답한다.
    key_points:
      - 노드는 사전 하나(글자 → 자식 번호)와 개수 몇 개면 된다. 목록에 노드를 쌓고 번호로 가리킨다.
      - 문자열이 끝나는 노드에 표시를 해야 "그 문자열이 있다" 와 "그것으로 시작하는 문자열이 있다" 를 가를 수 있다.
      - 노드 수는 넣은 글자 수의 합을 넘지 않는다.
      - 모든 접두사를 사전에 세거나, 문자열을 정렬해 접두사 구간을 이분 탐색으로 찾아도 같은 질의에 답한다.
    example: |
      children = [{}]
      passing = [0]
      for word in words:
          node = 0
          for ch in word:
              if ch not in children[node]:
                  children[node][ch] = len(children)
                  children.append({})
                  passing.append(0)
              node = children[node][ch]
              passing[node] += 1
      def count_prefix(prefix):
          node = 0
          for ch in prefix:
              if ch not in children[node]:
                  return 0
              node = children[node][ch]
          return passing[node]
    self_check: apple, app, apply 를 넣은 뒤 노드가 몇 개인지, "ap" 로 시작하는 문자열 수가 어느 노드에 있는지 말해 보세요.

  - skill_code: PREFIX_FUNCTION
    title: 앞과 뒤가 같은 가장 긴 길이
    summary: pi[i] 는 s[0..i] 의 진짜 접두사이면서 접미사인 것 가운데 가장 긴 길이다. i 에서는 pi[i-1] 부터 시작해, 다음 글자가 맞지 않으면 pi[k-1] 로 줄여 가며 맞는 길이를 찾는다.
    key_points:
      - 줄여 가는 횟수의 합은 늘어난 횟수의 합을 넘지 않으므로 전체가 N 번이다.
      - 패턴을 찾을 때는 pattern + 구분 문자 + text 의 pi 에서 값이 패턴 길이인 곳이 일치 위치다.
      - 위치마다 처음부터 다시 비교하면 aaaa...ab 같은 입력에서 N × M 번 비교한다.
      - Z 배열(각 위치에서 시작해 전체 접두사와 몇 글자가 같은가)도 선형 시간에 같은 정보를 준다.
      - 접두사 해시와 이분 탐색으로도 같은 값을 N log N 에 구할 수 있다. 해시는 충돌 가능성을 따로 따져야 한다.
    example: |
      pi = [0] * len(s)
      for i in range(1, len(s)):
          k = pi[i - 1]
          while k > 0 and s[i] != s[k]:
              k = pi[k - 1]
          if s[i] == s[k]:
              k += 1
          pi[i] = k
    self_check: 문자열 abacaba 의 pi 값을 순서대로 구해 보세요.

  - skill_code: INTERVAL_SWEEP
    title: 시작과 끝을 사건으로
    summary: 구간 [s, e) 를 (s, +1) 과 (e, -1) 두 사건으로 바꾸고 좌표 순으로 정렬해 훑는다. 지금 켜진 구간 수를 더해 가면 어느 지점에서든 겹침 수가 나온다.
    key_points:
      - 같은 좌표에 끝과 시작이 함께 있으면 어느 것을 먼저 처리할지가 "맞닿은 구간이 겹치는가" 를 정한다. 끝(-1)을 먼저 두면 맞닿은 구간은 겹치지 않는다.
      - 합집합 길이는 켜진 수가 1 이상인 동안 지나간 거리를 더한다.
      - 정렬이 N log N 이고 훑기는 N 이다. 구간 쌍을 모두 비교하면 N² 이다.
    example: |
      events = []
      for s, e in intervals:
          events.append((s, 1))
          events.append((e, -1))
      events.sort()
      active = best = 0
      for _, delta in events:
          active += delta
          best = max(best, active)
    self_check: 구간 [1,3), [3,5), [2,4) 에서 사건을 정렬한 순서와 최대 겹침 수를 적어 보세요.

  - skill_code: CCW_ORIENTATION
    title: 외적의 부호로 방향 보기
    summary: 세 점 A, B, C 에 대해 (B - A) × (C - A) 의 부호가 양수면 반시계, 음수면 시계, 0 이면 일직선이다. 좌표가 정수면 곱셈과 뺄셈만 쓰므로 오차가 없다.
    key_points:
      - 각도나 기울기를 실수로 구하지 않는다. 나눗셈과 실수 비교가 오차를 만든다.
      - 두 선분이 교차하는지는 각 선분에 대해 다른 선분의 두 끝점이 서로 다른 쪽에 있는지로 본다. 일직선인 경우를 따로 다룬다.
      - 다각형 넓이는 원점에 대한 외적을 차례로 더한 값의 절반이다(신발끈 공식).
    example: |
      def ccw(ax, ay, bx, by, cx, cy):
          cross = (bx - ax) * (cy - ay) - (by - ay) * (cx - ax)
          return (cross > 0) - (cross < 0)
    self_check: (0,0), (4,0), (4,3) 과 (0,0), (4,0), (8,0) 의 방향을 각각 판정해 보세요.

  - skill_code: CONVEX_HULL
    title: 오목해지면 빼며 쌓기
    summary: 점을 x, y 순으로 정렬한 뒤 왼쪽에서 오른쪽으로 아래 껍질을, 오른쪽에서 왼쪽으로 위 껍질을 쌓는다. 새 점을 넣기 전에 마지막 두 점과 새 점이 반시계가 아니면 마지막 점을 뺀다.
    key_points:
      - 일직선 위의 점을 껍질에 넣을지는 뺄 때의 비교(<= 0 인지 < 0 인지)가 정한다.
      - 정렬이 N log N 이고 쌓기는 점마다 한 번 넣고 한 번 빼므로 N 이다.
      - 점이 하나거나 모두 같은 점이면 따로 처리한다.
      - 가장 아래 점을 기준으로 각도 순 정렬 뒤 쌓는 방법(그레이엄 스캔)도 N log N 이다.
    example: |
      def cross(o, a, b):
          return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0])
      pts = sorted(set(points))
      if len(pts) <= 2:
          hull = pts
      else:
          lower, upper = [], []
          for p in pts:
              while len(lower) >= 2 and cross(lower[-2], lower[-1], p) <= 0:
                  lower.pop()
              lower.append(p)
          for p in reversed(pts):
              while len(upper) >= 2 and cross(upper[-2], upper[-1], p) <= 0:
                  upper.pop()
              upper.append(p)
          hull = lower[:-1] + upper[:-1]
    self_check: 점 (0,0), (2,0), (1,1), (2,2), (0,2) 의 볼록 껍질을 이 방법으로 쌓는 과정을 적어 보세요.

  - skill_code: SEGMENT_TREE_RANGE_QUERY
    title: 구간을 반씩 나눠 미리 합쳐 두기
    summary: 수열을 반씩 나눈 구간마다 최솟값을 저장해 두면, 어떤 구간이든 저장된 구간 O(log N) 개로 덮이고 값 하나를 바꿀 때도 그 값을 품은 O(log N) 개만 고치면 된다.
    key_points:
      - 최솟값은 누적 합처럼 빼서 되돌릴 수 없다 - 그래서 누적 배열 대신 구간마다 값을 저장한다.
      - 크기를 2 의 거듭제곱 size 로 잡고 잎을 size 부터 두면, 부모는 i // 2, 자식은 2i, 2i+1 이다.
      - 질의는 [l, r) 의 양 끝에서 안쪽으로 올라가며 겹치는 노드만 합친다.
      - 갱신은 잎을 바꾸고 루트까지 부모를 다시 계산한다.
    example: |
      size = 1
      while size < n:
          size *= 2
      tree = [INF] * (2 * size)
      tree[size:size + n] = values
      for i in range(size - 1, 0, -1):
          tree[i] = min(tree[2 * i], tree[2 * i + 1])

      def update(i, value):
          i += size
          tree[i] = value
          while i > 1:
              i //= 2
              tree[i] = min(tree[2 * i], tree[2 * i + 1])

      def query(l, r):  # [l, r)
          best = INF
          l += size
          r += size
          while l < r:
              if l & 1:
                  best = min(best, tree[l]); l += 1
              if r & 1:
                  r -= 1; best = min(best, tree[r])
              l //= 2; r //= 2
          return best
    self_check: 수열 길이 8 에서 구간 [1, 6) 의 최솟값을 구할 때 합치는 노드를 적어 보세요.

  - skill_code: SEGMENT_TREE_LAZY
    title: 구간 갱신을 미뤄 두기
    summary: 구간 전체에 더하는 갱신은 그 구간을 완전히 덮는 노드에 "아직 자식에게 내려보내지 않은 값" 으로 적어 두고, 그 노드 아래로 내려갈 일이 생길 때 내려보낸다.
    key_points:
      - 노드마다 구간 합과 미뤄 둔 더하기 값(lazy)을 함께 둔다.
      - 노드 구간이 갱신 구간에 완전히 들어가면 합에 (값 × 길이) 를 더하고 lazy 에 값을 쌓은 뒤 멈춘다.
      - 부분적으로 겹치면 먼저 lazy 를 자식에게 내려보내고(push) 두 자식으로 내려간다.
      - 갱신 하나가 원소 수만큼이 아니라 O(log N) 개의 노드만 건드린다.
    example: |
      def apply(node, length, value):
          total[node] += value * length
          lazy[node] += value

      def push(node, left_len, right_len):
          if lazy[node]:
              apply(2 * node, left_len, lazy[node])
              apply(2 * node + 1, right_len, lazy[node])
              lazy[node] = 0

      def update(node, lo, hi, l, r, value):  # [lo, hi) 노드, [l, r) 갱신
          if r <= lo or hi <= l:
              return
          if l <= lo and hi <= r:
              apply(node, hi - lo, value)
              return
          mid = (lo + hi) // 2
          push(node, mid - lo, hi - mid)
          update(2 * node, lo, mid, l, r, value)
          update(2 * node + 1, mid, hi, l, r, value)
          total[node] = total[2 * node] + total[2 * node + 1]
    self_check: 구간 [0, 8) 에 3 을 더한 직후, 루트 아래 어느 노드에 lazy 가 남는지 설명해 보세요.

  - skill_code: FENWICK_PREFIX_SUM
    title: 가장 낮은 1 비트로 나눈 누적 합
    summary: i 번 칸이 (i - (i & -i), i] 구간의 합을 갖게 두면, 접두사 합은 i 에서 가장 낮은 1 비트를 빼며 O(log N) 칸을 더하고, 갱신은 가장 낮은 1 비트를 더하며 O(log N) 칸을 고친다.
    key_points:
      - 인덱스는 1 부터 쓴다. 0 은 가장 낮은 1 비트가 없어 멈추지 않는다.
      - 구간 [l, r] 의 합은 prefix(r) - prefix(l - 1) 이다 - 합은 빼서 되돌릴 수 있다.
      - 값을 v 로 "바꾸는" 갱신은 차이(v - 지금 값)를 더하는 것이다. 지금 값을 따로 들고 있어야 한다.
    example: |
      tree = [0] * (n + 1)

      def add(i, delta):  # 1-indexed
          while i <= n:
              tree[i] += delta
              i += i & -i

      def prefix(i):
          s = 0
          while i > 0:
              s += tree[i]
              i -= i & -i
          return s
    self_check: n = 8 일 때 add(3, 5) 가 고치는 칸과 prefix(7) 이 더하는 칸을 적어 보세요.

  - skill_code: SCC_DECOMPOSITION
    title: 서로 오갈 수 있는 정점 묶기
    summary: 방향 그래프에서 서로 도달할 수 있는 정점끼리 묶으면 묶음 사이의 간선은 사이클이 없는 그래프가 된다. 한 번 DFS 로 끝나는 순서를 얻고, 간선을 뒤집은 그래프에서 끝난 순서의 역순으로 DFS 하면 한 번에 한 묶음씩 나온다(코사라주).
    key_points:
      - 첫 DFS 는 정점이 끝나는 순서를 기록한다. 가장 늦게 끝난 정점은 "출발점 쪽" 묶음에 있다.
      - 뒤집은 그래프에서는 그 묶음 밖으로 나가는 간선이 모두 막혀, DFS 한 번이 정확히 한 묶음을 돈다.
      - 정점이 많으면 재귀 깊이가 한계를 넘는다 - 스택으로 반복 DFS 를 쓴다.
      - 한 번의 DFS 로 low-link 를 이용하는 타잔 방법도 같은 결과를 낸다.
    example: |
      order, seen = [], [False] * n
      for s in range(n):
          if seen[s]:
              continue
          seen[s] = True
          stack = [(s, 0)]
          while stack:
              v, i = stack.pop()
              if i < len(graph[v]):
                  stack.append((v, i + 1))
                  w = graph[v][i]
                  if not seen[w]:
                      seen[w] = True
                      stack.append((w, 0))
              else:
                  order.append(v)
      comp = [-1] * n
      count = 0
      for s in reversed(order):
          if comp[s] != -1:
              continue
          comp[s] = count
          stack = [s]
          while stack:
              v = stack.pop()
              for w in reverse[v]:
                  if comp[w] == -1:
                      comp[w] = count
                      stack.append(w)
          count += 1
    self_check: 간선 1→2, 2→3, 3→1, 3→4 인 그래프의 강한 연결 요소와 묶음 사이의 간선을 적어 보세요.

  - skill_code: ARTICULATION_POINT
    title: 되돌아갈 길이 없는 정점
    summary: DFS 트리에서 정점 v 의 자식 c 쪽 부분 트리가 v 의 조상으로 가는 뒷간선을 하나도 갖지 않으면, v 를 지울 때 그 부분 트리가 떨어져 나간다. 방문 순서(order)와 부분 트리가 닿는 가장 이른 방문 순서(low)로 이것을 한 번의 DFS 로 가린다.
    key_points:
      - low[c] >= order[v] 인 자식 c 가 하나라도 있으면 v 는 단절점이다(루트는 제외).
      - 루트는 DFS 트리에서 자식이 둘 이상일 때만 단절점이다.
      - 연결 요소가 여럿이면 요소마다 DFS 를 새로 시작한다.
      - 정점이 많으면 재귀 깊이가 한계를 넘는다 - 스택으로 반복 DFS 를 쓴다.
    example: |
      order = [0] * n; low = [0] * n; cut = [False] * n; timer = 1
      def dfs(v, parent):
          global timer
          order[v] = low[v] = timer; timer += 1
          children = 0
          for w in graph[v]:
              if w == parent:
                  continue
              if order[w]:
                  low[v] = min(low[v], order[w])
              else:
                  children += 1
                  dfs(w, v)
                  low[v] = min(low[v], low[w])
                  if parent != -1 and low[w] >= order[v]:
                      cut[v] = True
          if parent == -1 and children >= 2:
              cut[v] = True
    self_check: 간선 1-2, 2-3, 3-1, 3-4 인 그래프에서 각 정점의 order 와 low, 그리고 단절점을 적어 보세요.

  - skill_code: BRIDGE
    title: 우회로가 없는 간선
    summary: DFS 트리의 간선 (v, c) 는 c 쪽 부분 트리가 v 나 그 조상으로 돌아가는 뒷간선을 갖지 않을 때, 곧 low[c] > order[v] 일 때 단절선이다. 단절점과 같은 order · low 로 한 번의 DFS 에 구한다.
    key_points:
      - 단절점은 low[c] >= order[v], 단절선은 low[c] > order[v] 다 - 등호 하나가 다르다.
      - 부모로 가는 간선은 "간선 번호" 로 건너뛴다. 정점 번호로 건너뛰면 같은 두 정점 사이의 중복 간선을 놓친다.
      - 사이클 위의 간선은 단절선이 아니다.
    example: |
      def dfs(v, parent_edge):
          global timer
          order[v] = low[v] = timer; timer += 1
          for w, eid in graph[v]:
              if eid == parent_edge:
                  continue
              if order[w]:
                  low[v] = min(low[v], order[w])
              else:
                  dfs(w, eid)
                  low[v] = min(low[v], low[w])
                  if low[w] > order[v]:
                      bridges.append(eid)
    self_check: 두 정점 사이에 간선이 두 개 있으면 그 간선들이 단절선이 아닌 이유를 설명해 보세요.

  - skill_code: MAX_FLOW
    title: 남은 용량으로 길 찾기
    summary: 출발점에서 도착점으로 남은 용량이 있는 경로를 찾아 흘리고, 흘린 만큼 역방향 간선에 되돌릴 수 있는 용량을 준다. 더 찾을 경로가 없을 때 흘린 양이 최대 유량이고, 그때 출발점에서 닿는 정점과 닿지 않는 정점 사이의 간선이 최소 컷이다.
    key_points:
      - 역방향 간선이 없으면 먼저 잘못 흘린 것을 되돌릴 수 없어 최대가 아닌 값에서 멈춘다.
      - 경로를 BFS 로 가장 짧은 것부터 찾으면(에드몬드-카프) 반복 횟수가 용량에 매이지 않는다.
      - BFS 로 층을 나누고 층을 따라 여러 경로를 한꺼번에 흘리면(디닉) 더 빠르다.
      - 같은 두 정점 사이의 간선이 여럿이면 용량을 합치거나 따로 둔다.
    example: |
      from collections import deque
      def max_flow(s, t):
          flow = 0
          while True:
              parent = [-1] * n; parent[s] = s
              q = deque([s])
              while q and parent[t] == -1:
                  v = q.popleft()
                  for w in range(n):
                      if parent[w] == -1 and cap[v][w] > 0:
                          parent[w] = v; q.append(w)
              if parent[t] == -1:
                  return flow
              push, w = float("inf"), t
              while w != s:
                  push = min(push, cap[parent[w]][w]); w = parent[w]
              w = t
              while w != s:
                  cap[parent[w]][w] -= push; cap[w][parent[w]] += push; w = parent[w]
              flow += push
    self_check: 역방향 간선 없이 흘리면 최대 유량보다 작은 값에서 멈추는 그래프를 하나 만들어 보세요.

  - skill_code: BIPARTITE_MATCHING
    title: 짝을 바꿔 가며 늘리기
    summary: 왼쪽 사람마다 짝을 찾되, 원하는 자리가 이미 찼으면 그 자리의 주인이 다른 자리로 옮길 수 있는지 DFS 로 따라가 본다. 옮길 길(증가 경로)이 있으면 짝이 하나 는다. 모든 왼쪽 사람에게 한 번씩 시도하면 최대 매칭이다.
    key_points:
      - 왼쪽 사람마다 visited 를 새로 비운다 - 한 번의 시도 안에서만 같은 자리를 두 번 보지 않는다.
      - 먼저 온 사람에게 탐욕으로 자리를 주는 것만으로는 최대가 아니다 - 옮기기가 핵심이다.
      - 출발점 · 도착점을 붙인 용량 1 짜리 최대 유량과 같은 값이다.
    example: |
      match_right = [-1] * m
      def try_assign(u, seen):
          for v in adj[u]:
              if seen[v]:
                  continue
              seen[v] = True
              if match_right[v] == -1 or try_assign(match_right[v], seen):
                  match_right[v] = u
                  return True
          return False
      result = sum(try_assign(u, [False] * m) for u in range(n))
    self_check: 왼쪽 A 가 1, 2 를, B 가 1 만 원할 때 A 에게 먼저 1 을 주면 어떻게 옮겨 최대 매칭 2 에 이르는지 적어 보세요.

  - skill_code: STATE_GRAPH_DIJKSTRA
    title: 정점에 상태를 붙인 그래프
    summary: 같은 정점이라도 남은 쿠폰 수가 다르면 다른 상황이다. 상태를 (정점, 부가 상태) 로 두고 그 위에서 다익스트라를 돌리면, 부가 상태를 어떻게 썼는지 나열하지 않고 최단 경로를 구한다. 상태 수는 정점 수 × 부가 상태 수다.
    key_points:
      - dist 를 dist[정점][부가 상태] 로 둔다. 정점만으로 방문을 막으면 쿠폰을 아껴 둔 경로를 버린다.
      - 간선마다 "쿠폰을 쓰는 전이" 와 "쓰지 않는 전이" 를 따로 만든다.
      - 답은 도착 정점의 모든 부가 상태 중 가장 작은 값이다.
      - 상태 수 × 간선 수가 시간을 정한다 - 부가 상태의 범위를 먼저 본다.
    example: |
      import heapq
      dist = [[INF] * (k + 1) for _ in range(n)]
      dist[s][0] = 0
      heap = [(0, s, 0)]
      while heap:
          d, v, used = heapq.heappop(heap)
          if d > dist[v][used]:
              continue
          for w, c in graph[v]:
              if d + c < dist[w][used]:
                  dist[w][used] = d + c
                  heapq.heappush(heap, (d + c, w, used))
              if used < k and d < dist[w][used + 1]:  # 쿠폰으로 이 간선을 공짜로
                  dist[w][used + 1] = d
                  heapq.heappush(heap, (d, w, used + 1))
      answer = min(dist[t])
    self_check: 쿠폰 k 장, 정점 n 개일 때 상태 수와, 정점만으로 방문을 막으면 틀리는 예를 적어 보세요.
