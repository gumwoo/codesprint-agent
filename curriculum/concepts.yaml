  - skill_code: DIVIDE_AND_CONQUER
    title: 반으로 나눠 풀고 합치기
    summary: 크기 N 문제를 N/2 크기 두 개(또는 하나)로 나누면 단계 수가 log N으로 줄어든다.
    key_points:
      - a의 b제곱은 a의 b//2제곱을 한 번 구해 제곱하면 된다. b가 홀수면 a를 한 번 더 곱한다.
      - 나눈 결과를 다시 쓰는 곳에서 같은 계산을 두 번 호출하지 않는다.
      - 큰 수는 곱할 때마다 나머지를 취해 크기를 줄인다.
    example: |
      def power(a, b, m):
          if b == 0:
              return 1 % m
          half = power(a, b // 2, m)
          result = half * half % m
          return result * a % m if b % 2 else result
    self_check: b가 10^18일 때 위 함수가 몇 번 정도 호출되는지 어림해 보세요.

  - skill_code: BACKTRACKING
