  - skill_code: PREFIX_SUM
    title: 누적 합으로 구간 합 바로 구하기
    summary: prefix[i]를 앞에서부터 i개의 합으로 두면, 구간 [l, r]의 합은 뺄셈 한 번이다.
    key_points:
      - prefix는 길이 N+1로 만들고 prefix[0] = 0으로 두면 경계 처리가 줄어든다.
      - 구간 [l, r] (0부터, 양 끝 포함)의 합은 prefix[r + 1] - prefix[l]이다.
      - 질의마다 sum(values[l:r+1])을 하면 질의 수 × 구간 길이만큼 더한다.
    example: |
      prefix = [0] * (n + 1)
      for i in range(n):
          prefix[i + 1] = prefix[i] + values[i]
      answer = prefix[r + 1] - prefix[l]
    self_check: 1부터 세는 구간 [l, r]의 합을 prefix로 쓰면 식이 어떻게 달라지는지 써 보세요.

  - skill_code: DIFFERENCE_ARRAY
    title: 구간 갱신을 양 끝에만 적기
    summary: 구간 [l, r]에 v를 더하는 갱신은 diff[l]에 v를 더하고 diff[r+1]에서 v를 빼 두면 된다. 마지막에 한 번 누적하면 모든 칸이 반영된다.
    key_points:
      - diff는 길이 N+1로 만들어 r+1이 넘치지 않게 한다.
      - 갱신이 끝난 뒤 누적 합을 한 번 구하면 각 칸의 최종 증가량이다.
      - 갱신마다 구간 전체를 고치면 갱신 수 × 구간 길이만큼 쓴다.
    example: |
      diff = [0] * (n + 1)
      for l, r, v in updates:
          diff[l] += v
          diff[r + 1] -= v
      running = 0
      for i in range(n):
          running += diff[i]
          values[i] += running
    self_check: 갱신 두 개 [0,2]+1, [1,3]+2 를 diff로 적고 누적해 보세요.

