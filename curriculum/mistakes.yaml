# Mistake Taxonomy — 첫 Vertical Slice
#
# 정본: docs/_archive/CodeSprint_Agent_Implementation_Spec_Addendum.md §37, §42
#       전체 35종은 PRD §70. 여기에는 슬라이스 1 의 8종만 둔다.
#
# Mistake 는 Skill 이 아니다(§30).
#   Skill   = 할 수 있어야 하는 것 → GRID_BOUNDARY_CHECK  (skills.yaml)
#   Mistake = 틀리는 방식          → BOUNDARY_CHECK       (이 파일)
#
# ── auto_drill ────────────────────────────────────────────────────────
# 확정된 Mistake 가 자동으로 Micro Drill 을 유발하는지. 슬라이스 1 에서는
# BOUNDARY_CHECK 와 VISITED_TIMING 둘만 자동 액션까지 연결한다(§42).
# 나머지는 탐지·기록만 하고 Decision Engine 을 건드리지 않는다.
#
# 자동 드릴을 2개로 묶어두는 이유는, 확정 조건(§21)이 실제 제출 데이터로
# 검증되기 전에 자동 액션을 넓히면 오분류가 곧바로 학습 경로 오염이 되기
# 때문이다. Reviewer 정확도가 측정된 뒤 하나씩 연다.
#
# ── target_skill ──────────────────────────────────────────────────────
# auto_drill: true 인 Mistake 는 반드시 존재하는 Skill 을 가리켜야 한다.
# CI 가 검증한다.

mistakes:
  - code: BOUNDARY_CHECK
    name: 경계 검사 누락
    auto_drill: true
    target_skill: GRID_BOUNDARY_CHECK
    description: >-
      격자 이동 후 좌표가 범위를 벗어났는지 검사하지 않는다.
      IndexError 로 드러나기도 하고, Python 의 음수 인덱싱 때문에
      조용히 잘못된 답을 내기도 한다.

  - code: VISITED_TIMING
    name: 방문 처리 시점 오류
    auto_drill: true
    target_skill: BFS_VISITED_MANAGEMENT
    description: >-
      방문 처리를 큐에 넣을 때가 아니라 꺼낼 때 수행한다.
      같은 좌표가 큐에 여러 번 들어가 탐색량이 불어나고,
      최단거리 문제에서는 거리 갱신이 어긋날 수 있다.

  - code: NO_VISITED
    name: 방문 배열 부재
    auto_drill: false
    target_skill: BFS_VISITED_MANAGEMENT
    description: >-
      방문 상태를 아예 기록하지 않아 무한 탐색에 빠진다.

  - code: INDEX_ERROR
    name: 인덱스 오류
    auto_drill: false
    target_skill: null
    description: >-
      경계 검사와 무관한 인덱싱 실수. row/column 뒤바꿈 등.

  - code: INPUT_PARSE
    name: 입력 파싱 오류
    auto_drill: false
    target_skill: null
    description: >-
      입력 형식을 잘못 읽는다. split / map 사용 오류 포함.

  - code: OUTPUT_FORMAT
    name: 출력 형식 오류
    auto_drill: false
    target_skill: null
    description: >-
      알고리즘은 맞으나 출력 형식이 요구와 다르다.

  - code: SYNTAX_ERROR
    name: 문법 오류
    auto_drill: false
    target_skill: null
    description: >-
      알고리즘 Skill 의 mastery 에 penalty 를 주지 않는다(§12).
      별도 Language Skill 에 Evidence 를 기록한다.

  - code: IMPLEMENTATION_MISC
    name: 기타 구현 오류
    auto_drill: false
    target_skill: null
    description: >-
      슬라이스 1 의 분류 체계로 확정할 수 없는 나머지.
      Reviewer 가 다른 오류를 발견하더라도 여기로 저장한다(§37).
      이 항목의 비율이 높으면 taxonomy 를 넓혀야 한다는 신호다.
