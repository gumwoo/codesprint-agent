# 학습 트랙 - 목표별 활성 Skill 범위
#
# 정본: PRD §129(목표별 권장 범위), §56(초기 진단 입력: 목표 난이도), §152(사용자 설정).
# 근거: docs/adr/0035-a-learning-track-scopes-the-skill-graph.md
#
# "사용자가 어떤 목표를 선택하더라도 전체 커리큘럼 데이터는 존재하고 목표에 따라 활성
# 범위만 달라진다" (§129). 여기가 그 범위다.
#
# 사용자에게 켜지는 Skill 은 두 조건을 모두 만족하는 것이다.
#
#   Skill 의 domain 이 domains 에 있다
#   Skill 의 tier 가 tiers 에 있다
#
# 도메인만으로는 부족하다 - 같은 Tree 도메인 안에 CORE Skill(tree_dfs)과 INTERMEDIATE
# Skill(lca)이 섞여 있다(PRD §33).
#
# ── 규칙 (CI 가 검사한다) ───────────────────────────────────────────────
# 1. 트랙 안의 Skill 이 요구하는 선수 Skill 도 그 트랙 안에 있어야 한다. 아니면 그 Skill 은
#    영원히 LOCKED 이고, Decision Engine 은 트랙 밖으로 사용자를 보낸다.
# 2. 트랙마다 활성 Skill 이 하나 이상 있어야 한다. 빈 트랙을 고르면 진단이 물을 것이 없다.
# 3. code 는 users.track 에 저장된다. 한번 쓰이면 바꾸지 않는다(Addendum §35 와 같은 이유).

tracks:
  - code: INTRO
    name: 입문
    description: 문법과 기본 자료구조로 푸는 구현 문제까지
    tiers: [FOUNDATION, CORE]
    domains:
      - FOUNDATIONS
      - IMPLEMENTATION
      - ARRAY_MATRIX
      - STRING
      - HASH
      - SORTING
      - STACK_QUEUE
      - BRUTE_FORCE

  - code: JOB
    name: 일반 취업 코딩테스트
