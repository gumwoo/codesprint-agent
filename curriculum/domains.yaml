# 커리큘럼 도메인 레지스트리
#
# PRD §5 의 45개 도메인 + §6 의 00 Programming Foundations = 46개.
# 이 파일은 **골격만** 등록한다. 실제 Skill 은 skills.yaml 에 검증된 것만 넣는다.
# PRD §167 원칙 1("전체 커리큘럼은 처음부터 설계한다")과
# Addendum §31("첫 슬라이스 Skill 은 8개로 고정")을 동시에 만족시키기 위한 분리다.
#
# code    : Skill 의 domain 필드가 참조하는 값. 한번 쓰이면 변경 금지(§35).
# order   : PRD 문서상의 도메인 번호. 학습 순서를 강제하지 않는다(§130).
# tier    : 대표 등급. 도메인 안에서 Skill 마다 다를 수 있어 어디까지나 기본값이다.
# active  : skills.yaml 에 Skill 이 하나라도 등록됐는지. 첫 슬라이스는 3개만 true.

domains:
  - code: FOUNDATIONS
    order: 0
    name: Programming Foundations
    tier: CORE
    active: true

