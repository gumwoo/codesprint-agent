# Skill 선수 관계
#
# 정본: docs/_archive/CodeSprint_Agent_Implementation_Spec_Addendum.md §33~34
#
# skill 을 학습하려면 prerequisite 이 minimum_mastery 이상이어야 한다.
# minimum_mastery 기본값 0.65 는 Addendum §76 skill_prerequisites 스키마의
# DEFAULT 와 같다.
#
# ── CI 가 막는 것 (tools/check_curriculum.py) ─────────────────────────
#   - skills.yaml 에 없는 code 참조
#   - 자기 자신을 prerequisite 으로 지정
#   - 순환 참조
# 이 셋은 전부 "런타임에 학습 경로가 무한루프에 빠지거나 영원히 LOCKED 로
# 남는" 형태로 나타난다. 데이터 단계에서 막는 편이 압도적으로 싸다.
#
# ⚠️ GRID_COORDINATE ← PYTHON_LIST_BASIC 은 Addendum §33 에 명시된 관계를
#    그대로 옮긴 것이다. 다만 언어 독립 Skill 이 언어 종속 Skill 을 요구하는
#    형태라 PRD §67(Skill Graph 는 특정 언어에 종속되지 않는다)과 긴장이 있다.
#    Java/C++ 를 추가하는 시점에 재검토가 필요하다. 지금 바꾸지 않는 이유는
#    첫 슬라이스가 Python 단일 언어이고, 정본 문서를 임의로 고치지 않기 위해서다.

prerequisites:
  # 격자 계열
  - skill: GRID_COORDINATE
    requires: PYTHON_LIST_BASIC
    minimum_mastery: 0.65

  - skill: GRID_BOUNDARY_CHECK
    requires: GRID_COORDINATE
    minimum_mastery: 0.65

  # BFS 계열
  - skill: BFS_BASIC
    requires: PYTHON_DEQUE_BASIC
    minimum_mastery: 0.65

  - skill: BFS_VISITED_MANAGEMENT
    requires: BFS_BASIC
    minimum_mastery: 0.65

  # 두 갈래가 합류하는 지점
  - skill: BFS_GRID_TRAVERSAL
    requires: BFS_BASIC
    minimum_mastery: 0.65

  - skill: BFS_GRID_TRAVERSAL
    requires: BFS_VISITED_MANAGEMENT
    minimum_mastery: 0.65

  - skill: BFS_GRID_TRAVERSAL
    requires: GRID_BOUNDARY_CHECK
    minimum_mastery: 0.65

  - skill: BFS_SHORTEST_PATH
    requires: BFS_GRID_TRAVERSAL
    minimum_mastery: 0.70

  # ── W2 · CORE-1 (ADR-0034) ──────────────────────────────────────────
  # 기본값 0.65(Addendum §76). 슬라이스 1 과 같은 문턱을 쓴다 - 새 값을 만들 근거가 없다.
  - skill: SIMULATION_STATE
    requires: PYTHON_LIST_BASIC
    minimum_mastery: 0.65

  - skill: MATRIX_TRANSFORM
    requires: GRID_COORDINATE
    minimum_mastery: 0.65

  - skill: MATRIX_TRAVERSAL
    requires: GRID_BOUNDARY_CHECK
    minimum_mastery: 0.65

  - skill: STRING_MANIPULATION
    requires: PYTHON_LIST_BASIC
    minimum_mastery: 0.65

  - skill: STRING_PARSING
    requires: STRING_MANIPULATION
    minimum_mastery: 0.65

  - skill: HASH_SET_MEMBERSHIP
    requires: PYTHON_LIST_BASIC
    minimum_mastery: 0.65

  - skill: HASH_MAP_COUNTING
    requires: HASH_SET_MEMBERSHIP
    minimum_mastery: 0.65

  - skill: SORT_CUSTOM_KEY
    requires: PYTHON_LIST_BASIC
    minimum_mastery: 0.65

  - skill: SORT_THEN_SCAN
    requires: SORT_CUSTOM_KEY
    minimum_mastery: 0.65

  - skill: STACK_BASIC
    requires: PYTHON_LIST_BASIC
    minimum_mastery: 0.65

  - skill: BRUTE_FORCE_ENUMERATION
    requires: PYTHON_LIST_BASIC
    minimum_mastery: 0.65

  - skill: COMBINATORIAL_ENUMERATION
    requires: BRUTE_FORCE_ENUMERATION
    minimum_mastery: 0.65

  # ── W3 · CORE-2 (ADR-0034) ──────────────────────────────────────────
  - skill: HEAP_PRIORITY
    requires: SORT_CUSTOM_KEY
    minimum_mastery: 0.65

  - skill: RECURSION_BASIC
    requires: PYTHON_LIST_BASIC
    minimum_mastery: 0.65

  - skill: DIVIDE_AND_CONQUER
    requires: RECURSION_BASIC
    minimum_mastery: 0.65

  - skill: BACKTRACKING
    requires: RECURSION_BASIC
    minimum_mastery: 0.65

  - skill: BACKTRACKING
    requires: COMBINATORIAL_ENUMERATION
    minimum_mastery: 0.65

  - skill: TWO_POINTER
    requires: SORT_CUSTOM_KEY
    minimum_mastery: 0.65

  - skill: SLIDING_WINDOW
    requires: TWO_POINTER
    minimum_mastery: 0.65

  - skill: PREFIX_SUM
    requires: PYTHON_LIST_BASIC
    minimum_mastery: 0.65

  - skill: PREFIX_SUM_2D
    requires: PREFIX_SUM
    minimum_mastery: 0.65

  - skill: PREFIX_SUM_2D
    requires: GRID_COORDINATE
    minimum_mastery: 0.65

  - skill: DIFFERENCE_ARRAY
    requires: PREFIX_SUM
    minimum_mastery: 0.65
