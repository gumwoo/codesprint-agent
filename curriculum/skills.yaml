# Canonical Skill Catalog
#
# 정본: docs/_archive/CodeSprint_Agent_Implementation_Spec_Addendum.md §25~35
#
# ── 규칙 ───────────────────────────────────────────────────────────────
# 1. code 는 UPPER_SNAKE_CASE. 서비스 전 영역(DB / API / Event / Prompt /
#    Problem Metadata / Reviewer Output / Analytics)에서 동일하게 쓴다(§25~26).
#    ADR-0003 에서 확정. PRD 본문의 소문자 표기(bfs_basic)는 폐기한다.
# 2. Production 데이터에 한번 쓰인 code 는 변경 금지. 필요하면 deprecated +
#    replacement 로 대체한다(§35).
# 3. Skill 과 Mistake 를 섞지 않는다(§30).
#    Skill  = 할 수 있어야 하는 것  → GRID_BOUNDARY_CHECK
#    Mistake= 틀리는 방식           → BOUNDARY_CHECK (mistakes.yaml)
# 4. Technique 을 Skill 로 만들지 않는다(§29). BFS 에서 Queue 를 쓰는 것은
#    BFS_QUEUE 라는 Skill 이 아니라 BFS_BASIC 의 prerequisite 이다.
# 5. 여기 등록된 Skill 은 **검증된 것만**이다. 45개 도메인 골격은
#    domains.yaml 이 갖고 있다. 첫 슬라이스는 아래 8개로 고정한다(§31).
#
# ── 필드 ───────────────────────────────────────────────────────────────
# domain   : domains.yaml 의 code. 존재하지 않으면 CI 실패.
# tier     : FOUNDATION | CORE | INTERMEDIATE | ADVANCED
# language : 특정 언어에 종속된 Skill 만 채운다. 알고리즘 Skill 은 null.
#            PRD §67 "Skill Graph 는 특정 언어에 종속되지 않는다"를 지키면서
#            Addendum §12 의 별도 Language Skill 요구를 함께 만족시킨다.
# slice    : 이 Skill 이 처음 활성화되는 Vertical Slice 번호.

skills:
  # ── LANGUAGE (Python) ────────────────────────────────────────────────
  - code: PYTHON_LIST_BASIC
    name: Python List 기본
    domain: FOUNDATIONS
    tier: FOUNDATION
    language: PYTHON
    slice: 1
    description: >-
      Python list 와 2차원 list 를 생성하고 인덱스로 접근한다.

  - code: PYTHON_DEQUE_BASIC
    name: Python deque 기본
    domain: FOUNDATIONS
    tier: FOUNDATION
    language: PYTHON
    slice: 1
    description: >-
      collections.deque 의 append / popleft 를 사용할 수 있다.

  # ── IMPLEMENTATION ───────────────────────────────────────────────────
  - code: GRID_COORDINATE
    name: 격자 좌표 처리
    domain: IMPLEMENTATION
    tier: CORE
    language: null
    slice: 1
    description: >-
      2차원 격자의 row/column 과 좌표 이동을 올바르게 처리한다.

  - code: GRID_BOUNDARY_CHECK
    name: 격자 경계 판정
    domain: IMPLEMENTATION
    tier: CORE
    language: null
    slice: 1
    description: >-
      이동 후 좌표가 격자 범위 내부인지 올바르게 판정한다.

  # ── BFS ──────────────────────────────────────────────────────────────
  - code: BFS_BASIC
    name: BFS 기본
    domain: BFS
    tier: CORE
    language: null
    slice: 1
    description: >-
      Queue 기반 너비 우선 탐색의 기본 흐름을 이해하고 구현한다.

  - code: BFS_VISITED_MANAGEMENT
    name: BFS 방문 관리
    domain: BFS
    tier: CORE
    language: null
    slice: 1
    description: >-
      BFS 에서 방문 상태를 기록하고 중복 탐색을 방지한다.
      방문 처리 시점(큐에 넣을 때 vs 꺼낼 때)의 차이를 구분한다.

  - code: BFS_GRID_TRAVERSAL
    name: 격자 BFS 탐색
    domain: BFS
    tier: CORE
    language: null
    slice: 1
    description: >-
      2차원 격자를 BFS 로 탐색한다.

  - code: BFS_SHORTEST_PATH
    name: BFS 최단거리
    domain: BFS
    tier: CORE
    language: null
    slice: 1
    description: >-
      가중치가 동일한 그래프/격자에서 BFS 로 최단거리를 계산한다.
