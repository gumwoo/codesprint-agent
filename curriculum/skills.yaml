# Canonical Skill Catalog
#
# 정본: docs/_archive/CodeSprint_Agent_Implementation_Spec_Addendum.md §25~35
#
# ── 규칙 ───────────────────────────────────────────────────────────────
# 1. code 는 UPPER_SNAKE_CASE. 서비스 전 영역(DB / API / Event / Prompt /
#    Problem Metadata / Reviewer Output / Analytics)에서 동일하게 쓴다(§25~26).
#    ADR-0003 에서 확정. PRD 본문의 소문자 표기(bfs_basic)는 폐기한다.
# 2. Production 데이터에 한번 쓰인 code 는 변경 금지. 필요하면 deprecated +
#    replacement 로 대체한다(§35).
# 3. Skill 과 Mistake 를 섞지 않는다(§30).
#    Skill  = 할 수 있어야 하는 것  → GRID_BOUNDARY_CHECK
#    Mistake= 틀리는 방식           → BOUNDARY_CHECK (mistakes.yaml)
# 4. Technique 을 Skill 로 만들지 않는다(§29). BFS 에서 Queue 를 쓰는 것은
#    BFS_QUEUE 라는 Skill 이 아니라 BFS_BASIC 의 prerequisite 이다.
# 5. 여기 등록된 Skill 은 **검증된 것만**이다. 45개 도메인 골격은
#    domains.yaml 이 갖고 있다. 첫 슬라이스는 아래 8개로 고정한다(§31).
#
# ── 필드 ───────────────────────────────────────────────────────────────
# domain   : domains.yaml 의 code. 존재하지 않으면 CI 실패.
# tier     : FOUNDATION | CORE | INTERMEDIATE | ADVANCED
# language : 특정 언어에 종속된 Skill 만 채운다. 알고리즘 Skill 은 null.
#            PRD §67 "Skill Graph 는 특정 언어에 종속되지 않는다"를 지키면서
#            Addendum §12 의 별도 Language Skill 요구를 함께 만족시킨다.
# slice    : 이 Skill 이 처음 활성화되는 Vertical Slice 번호.
# needs_skill_control : 정답 여부만으로 이 Skill 을 썼는지 가를 수 없으면 true(ADR-0033).
#            true 인 Skill 을 PRIMARY 로 갖는 문제는 skill_control.py(그 Skill 없이 같은
#            답을 내는 풀이)가 실제 채점에서 걸려야 한다. false 는 "정답이 곧 그 Skill 을
#            보여준다고 판단했다" 이지 검증된 사실이 아니다.

skills:
  # ── LANGUAGE (Python) ────────────────────────────────────────────────
  - code: PYTHON_LIST_BASIC
    name: Python List 기본
    domain: FOUNDATIONS
    tier: FOUNDATION
    language: PYTHON
    slice: 1
    needs_skill_control: false
    description: >-
      Python list 와 2차원 list 를 생성하고 인덱스로 접근한다.

  - code: PYTHON_DEQUE_BASIC
    name: Python deque 기본
    domain: FOUNDATIONS
    tier: FOUNDATION
    language: PYTHON
    slice: 1
    needs_skill_control: true
    description: >-
      먼저 들어온 값을 앞에서 꺼내고 뒤에 넣는 처리를, 줄이 길어져도 꺼낼 때마다
      원소를 옮기지 않는 방식(collections.deque 의 append / popleft)으로 시간 안에 한다.

  # ── IMPLEMENTATION ───────────────────────────────────────────────────
  - code: GRID_COORDINATE
    name: 격자 좌표 처리
    domain: IMPLEMENTATION
    tier: CORE
    language: null
    slice: 1
    needs_skill_control: false
    description: >-
      2차원 격자의 row/column 과 좌표 이동을 올바르게 처리한다.

  - code: GRID_BOUNDARY_CHECK
    name: 격자 경계 판정
    domain: IMPLEMENTATION
    tier: CORE
    language: null
    slice: 1
    needs_skill_control: false
    description: >-
      이동 후 좌표가 격자 범위 내부인지 올바르게 판정한다.

  # ── BFS ──────────────────────────────────────────────────────────────
  - code: BFS_BASIC
    name: BFS 기본
    domain: BFS
    tier: CORE
    language: null
    slice: 1
    needs_skill_control: false
    description: >-
      Queue 기반 너비 우선 탐색의 기본 흐름을 이해하고 구현한다.

  - code: BFS_VISITED_MANAGEMENT
    name: BFS 방문 관리
    domain: BFS
    tier: CORE
    language: null
    slice: 1
    needs_skill_control: false
    description: >-
      BFS 에서 방문 상태를 기록하고 중복 탐색을 방지한다.
      방문 처리 시점(큐에 넣을 때 vs 꺼낼 때)의 차이를 구분한다.

  - code: BFS_GRID_TRAVERSAL
    name: 격자 BFS 탐색
    domain: BFS
    tier: CORE
    language: null
    slice: 1
    needs_skill_control: false
    description: >-
      2차원 격자를 BFS 로 탐색한다.

  - code: BFS_SHORTEST_PATH
    name: BFS 최단거리
    domain: BFS
    tier: CORE
    language: null
    slice: 1
    needs_skill_control: false
    description: >-
      가중치가 동일한 그래프/격자에서 BFS 로 최단거리를 계산한다.

  # ══ W2 · CORE-1 (ADR-0034) ═════════════════════════════════════════════
  # PRD §7~12, §15 의 소문자 목록을 채점으로 가를 수 있는 행동으로 묶었다(Addendum §29,
  # ADR-0033). needs_skill_control 이 true 인 것은 "정답이 곧 그 Skill 을 보여주지 않는"
  # 것 - 매번 전체를 훑는 풀이도 작은 입력에서는 같은 답을 낸다.

  # ── IMPLEMENTATION ───────────────────────────────────────────────────
  - code: SIMULATION_STATE
    name: 상태 시뮬레이션
    domain: IMPLEMENTATION
    tier: CORE
    language: null
    slice: 2
    needs_skill_control: false
    description: >-
      명령이나 규칙을 순서대로 적용해 위치 · 방향 · 값 같은 상태를 갱신하고 최종 상태를 낸다.

  # ── ARRAY_MATRIX ─────────────────────────────────────────────────────
  - code: MATRIX_TRANSFORM
    name: 2차원 배열 변환
    domain: ARRAY_MATRIX
    tier: CORE
    language: null
    slice: 2
    needs_skill_control: false
    description: >-
      2차원 배열을 전치 · 회전 · 뒤집기해 각 칸의 새 위치를 계산하고 새 배열을 만든다.

  - code: MATRIX_TRAVERSAL
    name: 2차원 배열 순회 순서
    domain: ARRAY_MATRIX
    tier: CORE
    language: null
    slice: 2
    needs_skill_control: false
    description: >-
      2차원 배열을 대각선 · 지그재그 · 나선 같은 정해진 순서로 모든 칸을 정확히 한 번씩 방문한다.

  # ── STRING ───────────────────────────────────────────────────────────
  - code: STRING_MANIPULATION
    name: 문자열 조작
    domain: STRING
    tier: CORE
    language: null
    slice: 2
    needs_skill_control: false
    description: >-
      문자열을 문자 단위로 다뤄 뒤집기 · 치환 · 대소문자 변환 · 회문 판정 · 연속 문자 압축을 한다.

  - code: STRING_PARSING
    name: 문자열 해석
    domain: STRING
    tier: CORE
    language: null
    slice: 2
    needs_skill_control: false
    description: >-
      구분자와 형식이 섞인 문자열을 토큰으로 나누고 숫자 · 이름 · 기호로 해석해 계산한다.

  # ── HASH ─────────────────────────────────────────────────────────────
  - code: HASH_SET_MEMBERSHIP
    name: 집합으로 존재 확인
    domain: HASH
    tier: CORE
    language: null
    slice: 2
    needs_skill_control: true
    description: >-
      많은 질의에 대해 매번 전체를 훑지 않고 존재 여부를 답한다(set · dict).
      매 질의마다 목록을 처음부터 찾는 풀이는 입력이 커지면 시간 안에 끝나지 않는다.

  - code: HASH_MAP_COUNTING
    name: 키별로 세고 모으기
    domain: HASH
    tier: CORE
    language: null
    slice: 2
    needs_skill_control: true
    description: >-
      키마다 개수 · 합계를 한 번 훑어 모은다(dict · Counter). 키마다 전체를 다시 세는
      풀이는 입력이 커지면 시간 안에 끝나지 않는다.

  # ── SORTING ──────────────────────────────────────────────────────────
  - code: SORT_CUSTOM_KEY
    name: 여러 기준으로 정렬
    domain: SORTING
    tier: CORE
    language: null
    slice: 2
    needs_skill_control: false
    description: >-
      오름차순 · 내림차순 · 동점 처리를 섞은 여러 기준으로 정렬 key 를 구성한다.

  - code: SORT_THEN_SCAN
    name: 정렬 후 한 번 훑기
    domain: SORTING
    tier: CORE
    language: null
    slice: 2
    needs_skill_control: true
    description: >-
      정렬로 가까운 것끼리 모은 뒤 한 번 훑어 답한다. 모든 쌍을 비교하는 풀이는 입력이
      커지면 시간 안에 끝나지 않는다.

  # ── STACK_QUEUE ──────────────────────────────────────────────────────
  - code: STACK_BASIC
    name: 스택
    domain: STACK_QUEUE
    tier: CORE
    language: null
    slice: 2
    needs_skill_control: false
    description: >-
      나중에 들어온 것을 먼저 처리하는 스택으로 여러 종류의 괄호 짝 · 되돌리기 · 중첩 구조를 처리한다.

  # ── BRUTE_FORCE ──────────────────────────────────────────────────────
  - code: BRUTE_FORCE_ENUMERATION
    name: 완전 탐색
    domain: BRUTE_FORCE
    tier: CORE
    language: null
    slice: 2
    needs_skill_control: false
    description: >-
      입력 크기로 경우의 수를 어림하고, 가능한 후보를 빠짐없이 만들어 조건을 검사한다.

  - code: COMBINATORIAL_ENUMERATION
    name: 순열 · 조합 · 부분집합 생성
    domain: BRUTE_FORCE
    tier: CORE
    language: null
    slice: 2
    needs_skill_control: false
    description: >-
      순열 · 조합 · 부분집합을 빠짐없이, 중복 없이 만들어 각각을 검사한다.

  # ══ W3 · CORE-2 (ADR-0034) ═════════════════════════════════════════════
  # 여섯 도메인 전부 "매번 처음부터 다시 하는 풀이도 작은 입력에서는 같은 답" 인 기법이다.
  # 재귀 기본(RECURSION_BASIC)만 정답이 곧 그 능력을 보여준다고 본다.

  # ── HEAP ─────────────────────────────────────────────────────────────
  - code: HEAP_PRIORITY
    name: 힙으로 가장 작은 값 꺼내기
    domain: HEAP
    tier: CORE
    language: null
    slice: 3
    needs_skill_control: true
    description: >-
      값이 계속 들어오고 나가는 동안 가장 작은(큰) 값을 매번 전체를 훑지 않고 꺼낸다(heapq).
      꺼낼 때마다 최솟값을 찾거나 다시 정렬하는 풀이는 입력이 커지면 시간 안에 끝나지 않는다.

  # ── RECURSION ────────────────────────────────────────────────────────
  - code: RECURSION_BASIC
    name: 재귀
    domain: RECURSION
    tier: CORE
    language: null
    slice: 3
    needs_skill_control: false
    description: >-
      자기 자신을 더 작은 크기로 품은 구조(S(n) 이 S(n-1) 로 정의되는 모양)의 n 단계 결과를 구한다.
      자기 호출 · 반복 · 통째로 만들기 중 무엇으로 구했는지는 채점으로 가를 수 없다 - 재귀적
      정의를 읽고 계산하는 능력을 잰다.

  - code: DIVIDE_AND_CONQUER
    name: 분할 정복
    domain: RECURSION
    tier: CORE
    language: null
    slice: 3
    needs_skill_control: true
    description: >-
      문제를 절반 크기의 같은 문제로 나눠 풀고 합친다(빠른 거듭제곱 등). 하나씩 줄여 가는
      풀이는 입력이 커지면 시간 안에 끝나지 않는다.

  # ── BACKTRACKING ─────────────────────────────────────────────────────
  - code: BACKTRACKING
    name: 백트래킹
    domain: BACKTRACKING
    tier: CORE
    language: null
    slice: 3
    needs_skill_control: true
    description: >-
      선택 · 탐색 · 되돌리기로 조건을 만족하는 경우를 찾고, 이미 조건을 어긴 가지는 더 내려가지
      않는다. 모든 경우를 다 만든 뒤 거르는 풀이는 입력이 커지면 시간 안에 끝나지 않는다.

  # ── TWO_POINTER ──────────────────────────────────────────────────────
  - code: TWO_POINTER
    name: 투 포인터
    domain: TWO_POINTER
    tier: CORE
    language: null
    slice: 3
    needs_skill_control: true
    description: >-
      정렬된 배열이나 연속 구간에서 두 위치를 한 방향으로만 옮기며 쌍 · 구간을 찾는다.
      모든 쌍 · 모든 구간을 확인하는 풀이는 입력이 커지면 시간 안에 끝나지 않는다.

  # ── SLIDING_WINDOW ───────────────────────────────────────────────────
  - code: SLIDING_WINDOW
    name: 슬라이딩 윈도우
    domain: SLIDING_WINDOW
    tier: CORE
    language: null
    slice: 3
    needs_skill_control: true
    description: >-
      연속 구간을 한 칸씩 옮기며 들어오는 값과 나가는 값만으로 구간의 합 · 개수 · 종류 수를
      갱신한다. 구간마다 처음부터 다시 세는 풀이는 입력이 커지면 시간 안에 끝나지 않는다.

  # ── PREFIX_SUM ───────────────────────────────────────────────────────
  - code: PREFIX_SUM
    name: 누적 합
    domain: PREFIX_SUM
    tier: CORE
    language: null
    slice: 3
    needs_skill_control: true
    description: >-
      누적 합을 한 번 만들어 구간 합 질의에 바로 답한다. 질의마다 구간을 더하는 풀이는
      입력이 커지면 시간 안에 끝나지 않는다.

  - code: DIFFERENCE_ARRAY
    name: 차분 배열
    domain: PREFIX_SUM
    tier: CORE
    language: null
    slice: 3
    needs_skill_control: true
    description: >-
      구간에 같은 값을 더하는 갱신을 구간의 양 끝에만 기록해 두고 마지막에 한 번 누적해 반영한다.
      갱신마다 구간 전체를 고치는 풀이는 입력이 커지면 시간 안에 끝나지 않는다.

  # ══ W4 · CORE-3 (ADR-0034) ═════════════════════════════════════════════

  # ── BINARY_SEARCH ────────────────────────────────────────────────────
  - code: BINARY_SEARCH_BOUNDS
    name: 이분 탐색 경계
    domain: BINARY_SEARCH
    tier: CORE
    language: null
    slice: 4
    needs_skill_control: true
    description: >-
      정렬된 배열에서 값 이상(초과)이 처음 나오는 위치를 절반씩 좁혀 찾는다(lower / upper bound).
      질의마다 앞에서부터 훑는 풀이는 입력이 커지면 시간 안에 끝나지 않는다.

  - code: PARAMETRIC_SEARCH
    name: 매개 변수 탐색
    domain: BINARY_SEARCH
    tier: CORE
    language: null
    slice: 4
    needs_skill_control: true
    description: >-
      "답이 x 이하로 가능한가" 가 x 에 대해 단조로울 때 답 자체를 이분 탐색한다. 후보 답을
      하나씩 모두 확인하는 풀이는 답의 범위가 크면 시간 안에 끝나지 않는다.

  # ── GREEDY ───────────────────────────────────────────────────────────
  - code: GREEDY_CHOICE
    name: 그리디 선택
    domain: GREEDY
    tier: CORE
    language: null
    slice: 4
    needs_skill_control: true
    description: >-
      정렬 기준을 세우고 매 단계 지금 가장 좋은 것을 고르는 규칙으로 최적해를 구한다(구간 선택 ·
      마감 · 자원 배분). 모든 조합을 시도하는 풀이는 입력이 커지면 시간 안에 끝나지 않는다.

  # ── MATH ─────────────────────────────────────────────────────────────
  - code: MATH_GCD_LCM
    name: 최대공약수 · 최소공배수
    domain: MATH
    tier: CORE
    language: null
    slice: 4
    needs_skill_control: true
    description: >-
      유클리드 호제법으로 최대공약수를 구하고 최소공배수를 계산한다. 작은 수부터 하나씩 나눠 보는
      풀이는 수가 크면 시간 안에 끝나지 않는다.

  - code: NUMBER_BASE_CONVERSION
    name: 자릿수와 진법
    domain: MATH
    tier: CORE
    language: null
    slice: 4
    needs_skill_control: false
    description: >-
      수를 자릿수로 나누고 합치며, 10 진법과 다른 진법 사이를 나눗셈과 나머지로 바꾼다.

  # ── GRAPH ────────────────────────────────────────────────────────────
  - code: GRAPH_REPRESENTATION
    name: 그래프 표현
    domain: GRAPH
    tier: CORE
    language: null
    slice: 4
    needs_skill_control: true
    description: >-
      간선 목록으로 인접 리스트를 만들어 정점의 이웃 · 차수를 바로 찾는다. 이웃을 찾을 때마다
      간선 전체를 훑는 풀이는 입력이 커지면 시간 안에 끝나지 않는다.

  # ── DFS ──────────────────────────────────────────────────────────────
  - code: DFS_TRAVERSAL
    name: 깊이 우선 탐색
    domain: DFS
    tier: CORE
    language: null
    slice: 4
    needs_skill_control: false
    description: >-
      한 이웃으로 끝까지 들어갔다 돌아오는 순서로 방문한다(재귀 또는 스택). 방문 순서 · 경로처럼
      깊이 우선이어야 나오는 결과를 구한다.

  - code: GRAPH_CYCLE_DETECTION
    name: 사이클 판정
    domain: DFS
    tier: CORE
    language: null
    slice: 4
    needs_skill_control: false
    description: >-
      방향 · 무방향 그래프에 사이클이 있는지 판정한다.

